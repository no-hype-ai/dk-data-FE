# TAVR Targeting Tool - Docker Compose
# Feature: 001-data-layer-postgrest-gitops
# Tasks: T038-T041
#
# Services:
#   - postgres: PostgreSQL database
#   - postgrest: REST API layer for PostgreSQL
#   - job-trigger: FastAPI service for triggering batch jobs
#   - metabase: BI dashboard tool
#
# Usage:
#   docker compose up -d
#   docker compose down
#
# Initialize database after first start:
#   docker compose exec postgres psql -U postgres -d edwards_tavr -f /docker-entrypoint-initdb.d/init_database.sql
#
# Health checks:
#   curl http://localhost:3030/health
#   curl http://localhost:8000/health

services:
  # ==========================================================================
  # PostgreSQL - Database
  # Includes pgvector extension for molecule platform
  # ==========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tavr-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-edwards_tavr}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Mount SQL files for initialization
      - ./sql:/docker-entrypoint-initdb.d:ro
    networks:
      - tavr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-edwards_tavr}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================================================
  # PostgREST - REST API for PostgreSQL
  # ==========================================================================
  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: tavr-postgrest
    restart: unless-stopped
    ports:
      - "${POSTGREST_PORT:-3030}:3000"
    environment:
      # Database connection - connects to postgres service within docker network
      PGRST_DB_URI: "postgres://authenticator:${POSTGREST_PASSWORD:-postgrest_secret_change_me}@postgres:5432/${POSTGRES_DB:-edwards_tavr}"
      PGRST_DB_SCHEMAS: "api,mol_api,gold,silver,bronze"
      PGRST_DB_ANON_ROLE: "web_anon"
      PGRST_DB_POOL: "10"
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: "10"
      PGRST_SERVER_HOST: "0.0.0.0"
      PGRST_SERVER_PORT: "3000"
      PGRST_MAX_ROWS: "1000"
      PGRST_LOG_LEVEL: "info"
      PGRST_DB_PREPARED_STATEMENTS: "true"
      PGRST_OPENAPI_MODE: "follow-privileges"
      # JWT configuration for role-based access
      PGRST_JWT_SECRET: "${PGRST_JWT_SECRET:-}"
      PGRST_JWT_ROLE_CLAIM_KEY: ".role"
    networks:
      - tavr-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================================================
  # Job Trigger - FastAPI service for batch job management
  # ==========================================================================
  job-trigger:
    build:
      context: ./ingestion/batch
      dockerfile: Dockerfile
    container_name: tavr-job-trigger
    restart: unless-stopped
    ports:
      - "${JOB_TRIGGER_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-edwards_tavr}"
      # For local dev, use subprocess runner instead of K8s
      JOB_RUNNER_MODE: "local"
      LOG_LEVEL: "info"
    volumes:
      # Mount scripts from project root (organized by purpose)
      - ../../scripts:/app/scripts:ro
      # Mount legacy scripts location for backwards compatibility
      - ./scripts:/app/legacy_scripts:ro
      # Data and logs directories
      - ./data:/app/data
      - ./logs:/app/logs
      # Mount ingestion module for fetch jobs
      - ./ingestion:/app/ingestion:ro
    networks:
      - tavr-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================================================
  # Metabase - BI Dashboard Tool
  # ==========================================================================
  metabase:
    image: metabase/metabase:v0.50.26
    platform: linux/amd64
    container_name: tavr-metabase
    restart: unless-stopped
    ports:
      - "${METABASE_PORT:-3000}:3000"
    environment:
      # Metabase application database (embedded H2 for simplicity)
      MB_DB_TYPE: "h2"
      MB_DB_FILE: "/metabase-data/metabase.db"
      # Java memory settings
      JAVA_OPTS: "-Xmx1g"
      # Timezone
      MB_JAVA_TIMEZONE: "US/Pacific"
    volumes:
      - metabase-data:/metabase-data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - tavr-network

  # ==========================================================================
  # Prometheus - Metrics Collection
  # ==========================================================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: tavr-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - tavr-network
    profiles:
      - monitoring

  # ==========================================================================
  # Grafana - Metrics Visualization
  # ==========================================================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: tavr-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3003}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/data-platform-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - tavr-network
    profiles:
      - monitoring

  # ==========================================================================
  # Jaeger - Distributed Tracing
  # ==========================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.51
    container_name: tavr-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"  # Jaeger UI
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"    # OTLP gRPC
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"    # OTLP HTTP
    networks:
      - tavr-network
    profiles:
      - monitoring

  # ==========================================================================
  # Frontend - Data Platform Onboarding UI
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tavr-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      - job-trigger
    environment:
      - VITE_API_URL=http://localhost:8000
    networks:
      - tavr-network
    profiles:
      - frontend

# ==========================================================================
# Networks
# ==========================================================================
networks:
  tavr-network:
    driver: bridge

# ==========================================================================
# Volumes
# ==========================================================================
volumes:
  postgres-data:
    driver: local
  metabase-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
