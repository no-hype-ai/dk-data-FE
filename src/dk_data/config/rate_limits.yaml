# Rate Limit Registry for MCP Tools
# Feature: 015-assessment-dashboard-integration
# FR-026: Per-source rate limits matching upstream API published limits
# FR-029: Per-source configurable timeouts (default 30s)
#
# Each source inherits from defaults unless overridden.
# Backoff: base_delay * 2^attempt with jitter, capped at max_delay.
#
# API Key Status (Doppler env vars):
#   OPENFDA_API_KEY    — free via api.data.gov (daily limit: 1K→120K)
#   OPENALEX_API_KEY   — REQUIRED since Feb 2026 (openalex.org/settings/api)
#   NCBI_API_KEY       — free via ncbi.nlm.nih.gov (rate: 3→10 req/s)
#   ORCID_CLIENT_ID    — OAuth2 via orcid.org Developer Tools
#   ORCID_CLIENT_SECRET
#   WHO_ICD_CLIENT_ID  — OAuth2 via icd.who.int/icdapi
#   WHO_ICD_CLIENT_SECRET

defaults:
  requests_per_second: 5
  timeout_seconds: 30
  burst_limit: 10
  base_delay_seconds: 1
  max_delay_seconds: 30
  max_retries: 3
  jitter: true

sources:
  # =========================================================================
  # Tier 1: Direct drug-name query tools (19)
  # =========================================================================

  # mol_raw sources
  clinicaltrials:
    requests_per_second: 1     # ClinicalTrials.gov v2: ~50 req/min, no API key available
    timeout_seconds: 30
    burst_limit: 5

  chembl:
    requests_per_second: 1     # ChEMBL REST API: shared IP limit, no formal API key
    timeout_seconds: 30
    burst_limit: 5

  drugbank:
    requests_per_second: 5     # DrugBank REST API (requires license key)
    timeout_seconds: 60        # XML parsing is slow
    burst_limit: 10
    max_retries: 5             # DrugBank XML responses are large

  openfda_faers:
    requests_per_second: 4     # OpenFDA 240/min with OPENFDA_API_KEY; 40/min without
    timeout_seconds: 30
    burst_limit: 20
    # daily_limit: 120000 with key, 1000 without

  openfda_labels:
    requests_per_second: 4     # OpenFDA 240/min with OPENFDA_API_KEY; 40/min without
    timeout_seconds: 30
    burst_limit: 20

  uniprot:
    requests_per_second: 10    # UniProt REST: fair-use, no auth required
    timeout_seconds: 30
    burst_limit: 20

  openalex:
    requests_per_second: 10    # OpenAlex: OPENALEX_API_KEY required since Feb 2026
    timeout_seconds: 30        # Hard cap 100 req/s; deprecated polite pool removed
    burst_limit: 30

  pubmed:
    requests_per_second: 3     # NCBI eutils: 3/s without NCBI_API_KEY, 10/s with
    timeout_seconds: 30
    burst_limit: 10

  pubchem:
    requests_per_second: 5     # PubChem: 5 req/s, 400 req/min; no API key available
    timeout_seconds: 30        # Monitor X-Throttling-Control response header
    burst_limit: 10

  # raw sources — regulatory
  ema:
    requests_per_second: 5     # EMA open data: no auth, fair-use
    timeout_seconds: 30
    burst_limit: 10

  hta_decisions:
    requests_per_second: 5
    timeout_seconds: 30
    burst_limit: 10

  cochrane_reviews:
    requests_per_second: 5     # Cochrane: no public API, web scraping only
    timeout_seconds: 30
    burst_limit: 10

  orange_book:
    requests_per_second: 4     # OpenFDA shared limit (uses OPENFDA_API_KEY)
    timeout_seconds: 30
    burst_limit: 20

  # raw sources — IP
  uspto_patents:
    requests_per_second: 5     # PatentsView API: no auth required
    timeout_seconds: 30
    burst_limit: 15

  epo_patents:
    requests_per_second: 10    # EPO OPS: registered users get generous limits
    timeout_seconds: 30
    burst_limit: 20

  sec_edgar:
    requests_per_second: 10    # SEC EDGAR: 10 req/s, User-Agent required (no API key)
    timeout_seconds: 45        # EDGAR responses can be large
    burst_limit: 20

  who_icd:
    requests_per_second: 10    # WHO ICD API: OAuth2 required (WHO_ICD_CLIENT_ID)
    timeout_seconds: 30
    burst_limit: 15

  pdb_structures:
    requests_per_second: 3     # RCSB PDB search API: no auth, be conservative
    timeout_seconds: 30
    burst_limit: 10

  orcid:
    requests_per_second: 12    # ORCID: 24 req/s max, 12 recommended (OAuth2 required)
    timeout_seconds: 30
    burst_limit: 20

  # =========================================================================
  # Tier 2: Fetch and filter tools (4)
  # =========================================================================

  journal_rss:
    requests_per_second: 5
    timeout_seconds: 30
    burst_limit: 10

  medical_news:
    requests_per_second: 5
    timeout_seconds: 30
    burst_limit: 10

  uspto_trademarks:
    requests_per_second: 5     # USPTO TSDR
    timeout_seconds: 30
    burst_limit: 15

  euipo_trademarks:
    requests_per_second: 5     # TMview search
    timeout_seconds: 30
    burst_limit: 15

  # =========================================================================
  # Tier 3: Supplementary context tools (5)
  # =========================================================================

  cms_medicare_inpatient:
    requests_per_second: 5     # CMS data.gov: fully open, no auth
    timeout_seconds: 30
    burst_limit: 10

  cms_hospital_info:
    requests_per_second: 5
    timeout_seconds: 30
    burst_limit: 10

  cms_cost_reports:
    requests_per_second: 5
    timeout_seconds: 30
    burst_limit: 10

  acc_tvc:
    requests_per_second: 5
    timeout_seconds: 30
    burst_limit: 10

  hrsa_shortage_areas:
    requests_per_second: 5     # HRSA: separate registration + web token
    timeout_seconds: 30
    burst_limit: 10
