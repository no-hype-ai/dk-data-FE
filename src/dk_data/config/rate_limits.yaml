  # Tier 1: Direct drug-name query tools (19)
  # =========================================================================

  # mol_raw sources
  clinicaltrials:
    requests_per_second: 1     # ClinicalTrials.gov v2: ~50 req/min, no API key available
    timeout_seconds: 30
    burst_limit: 5

  chembl:
    requests_per_second: 1     # ChEMBL REST API: shared IP limit, no formal API key
    timeout_seconds: 30
    burst_limit: 5

  drugbank:
    requests_per_second: 5     # DrugBank REST API (requires license key)
    timeout_seconds: 60        # XML parsing is slow
    burst_limit: 10
    max_retries: 5             # DrugBank XML responses are large

  openfda_faers:
    requests_per_second: 4     # OpenFDA 240/min with OPENFDA_API_KEY; 40/min without
    timeout_seconds: 30
    burst_limit: 20
    # daily_limit: 120000 with key, 1000 without

  openfda_labels:
