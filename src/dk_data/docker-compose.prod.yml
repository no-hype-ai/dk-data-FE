# DK Data Platform - Production Docker Compose
# For server deployment with nginx reverse proxy and SSL
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   1. Copy .env.example to .env and configure production values
#   2. Place SSL certificates in ./nginx/ssl/
#   3. Run: ./scripts/setup_ssl.sh (for self-signed) or use Let's Encrypt

services:
  # ==========================================================================
  # Nginx - Reverse Proxy with SSL Termination
  # ==========================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: tavr-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    networks:
      - tavr-network
    depends_on:
      - frontend
      - job-trigger
      - postgrest
      - metabase
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # PostgreSQL - Override for production
  # ==========================================================================
  postgres:
    # Don't expose port externally in production - access via SSH tunnel
    ports: []
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      # Performance tuning for production
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "max_worker_processes=4"
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "max_parallel_workers=4"
      - "-c"
      - "log_statement=mod"
      - "-c"
      - "log_duration=on"
      - "-c"
      - "log_min_duration_statement=1000"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # ==========================================================================
  # PostgREST - Override for production
  # ==========================================================================
  postgrest:
    # Don't expose port externally - access via nginx
    ports: []
    environment:
      PGRST_DB_URI: "postgres://authenticator:${POSTGREST_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      PGRST_DB_SCHEMAS: "api,mol_api,gold,silver,bronze"
      PGRST_DB_ANON_ROLE: "web_anon"
      PGRST_DB_POOL: "20"
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: "10"
      PGRST_SERVER_HOST: "0.0.0.0"
      PGRST_SERVER_PORT: "3000"
      PGRST_MAX_ROWS: "10000"
      PGRST_LOG_LEVEL: "warn"
      PGRST_DB_PREPARED_STATEMENTS: "true"
      PGRST_OPENAPI_MODE: "follow-privileges"
      PGRST_JWT_SECRET: "${PGRST_JWT_SECRET}"
      PGRST_JWT_ROLE_CLAIM_KEY: ".role"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ==========================================================================
  # Job Trigger - Override for production
  # ==========================================================================
  job-trigger:
    # Don't expose port externally - access via nginx
    ports: []
    environment:
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      JOB_RUNNER_MODE: "local"
      LOG_LEVEL: "warning"
      # Production settings
      WORKERS: "4"
      TIMEOUT: "300"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # ==========================================================================
  # Metabase - Override for production
  # ==========================================================================
  metabase:
    # Don't expose port externally - access via nginx at /metabase
    ports: []
    environment:
      MB_DB_TYPE: "h2"
      MB_DB_FILE: "/metabase-data/metabase.db"
      JAVA_OPTS: "-Xmx2g"
      MB_JAVA_TIMEZONE: "UTC"
      MB_SITE_URL: "https://${SERVER_DOMAIN}/metabase"
      MB_EMBEDDING_APP_ORIGIN: "https://${SERVER_DOMAIN}"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ==========================================================================
  # Frontend - Override for production
  # ==========================================================================
  frontend:
    # Don't expose port externally - access via nginx
    ports: []
    environment:
      VITE_API_URL: "https://${SERVER_DOMAIN}"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ==========================================================================
  # Grafana - Override for production (monitoring profile)
  # ==========================================================================
  grafana:
    ports: []
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://${SERVER_DOMAIN}/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ==========================================================================
  # pgAdmin - Database Management UI (production profile)
  # ==========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tavr-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL:-admin@localhost}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD}"
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "True"
      SCRIPT_NAME: "/pgadmin"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - tavr-network
    depends_on:
      - postgres
    profiles:
      - dbadmin
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

# ==========================================================================
# Additional Volumes for Production
# ==========================================================================
volumes:
  nginx-logs:
    driver: local
  pgadmin-data:
    driver: local
