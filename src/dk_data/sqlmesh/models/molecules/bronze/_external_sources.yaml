# External source declarations for DDL-managed bronze tables.
# These are populated by bulk loaders (load_chembl_bulk.py, load_drugbank.py),
# not by SQLMesh models. Declaring them here lets silver models reference
# them without SQLMesh attempting to manage their snapshots.

sources:
  - name: mol_bronze.chembl_targets
    description: "ChEMBL targets with UniProt mappings — populated by load_chembl_bulk.py"
    columns:
      - name: id
      - name: chembl_target_id
      - name: protein_name
      - name: organism
      - name: target_type
      - name: uniprot_id
      - name: source_updated_at
      - name: created_at
      - name: processed_to_silver

  - name: mol_bronze.drugbank_data
    description: "DrugBank bulk XML data — populated by load_drugbank.py"
    columns:
      - name: drugbank_id
      - name: drug_name
      - name: drug_type
      - name: drug_groups
      - name: smiles
      - name: inchi_key
      - name: cas_number
      - name: unii
      - name: indication
      - name: mechanism_of_action
      - name: source_updated_at
