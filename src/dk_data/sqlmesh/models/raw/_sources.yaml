# SQLMesh External Source Definitions
# These reference existing PostgreSQL tables moved to hcs_raw.* by migration 099
# (schema_prefix_normalization). Updated from raw.* names to hcs_raw.* names.
# Ref: issue #171 M1

sources:
  - name: hcs_raw.cms_medicare_inpatient
    description: CMS Medicare Inpatient data with TAVR procedure volumes
    columns:
      - name: id
      - name: provider_id
      - name: provider_name
      - name: provider_street_address
      - name: provider_city
      - name: provider_state
      - name: provider_zip_code
      - name: drg_code
      - name: drg_description
      - name: total_discharges
      - name: average_covered_charges
      - name: average_total_payments
      - name: average_medicare_payments
      - name: fiscal_year
      - name: _loaded_at
      - name: _source_file
      - name: _source_hash

  - name: hcs_raw.acc_tvc_certification
    description: ACC Transcatheter Valve Certification data
    columns:
      - name: id
      - name: facility_name
      - name: facility_address
      - name: city
      - name: state
      - name: zip_code
      - name: certification_type
      - name: certification_date
      - name: expiration_date
      - name: _loaded_at
      - name: _source_file
      - name: _source_hash

  - name: hcs_raw.hrsa_shortage_areas
    description: HRSA Health Professional Shortage Area designations
    columns:
      - name: id
      - name: hpsa_id
      - name: hpsa_name
      - name: hpsa_type
      - name: designation_type
      - name: state_abbr
      - name: county_name
      - name: hpsa_score
      - name: designation_date
      - name: rural_status
      - name: _loaded_at
      - name: _source_hash

  - name: hcs_raw.cms_hospital_info
    description: CMS Hospital General Information
    columns:
      - name: id
      - name: provider_id
      - name: hospital_name
      - name: address
      - name: city
      - name: state
      - name: zip_code
      - name: county_name
      - name: phone_number
      - name: hospital_type
      - name: hospital_ownership
      - name: emergency_services
      - name: hospital_overall_rating
      - name: _loaded_at
      - name: _source_hash

  - name: hcs_raw.cms_cost_reports
    description: CMS Hospital Cost Reports financial data
    columns:
      - name: id
      - name: provider_id
      - name: fiscal_year_begin
      - name: fiscal_year_end
      - name: total_beds
      - name: total_discharges
      - name: net_patient_revenue
      - name: total_operating_expenses
      - name: operating_margin
      - name: _loaded_at
      - name: _source_hash
