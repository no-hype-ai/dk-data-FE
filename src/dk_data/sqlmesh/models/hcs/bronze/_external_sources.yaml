# External source declarations for hcs_raw.* tables.
# These are populated by CMS PUF file-based loaders and legacy HCS loaders,
# not by SQLMesh models. Declaring them here lets HCS bronze models reference
# them without SQLMesh attempting to manage their snapshots.
# Feature: 019-cms-puf-platform-reconciliation (M2)

