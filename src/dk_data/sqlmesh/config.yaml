# SQLMesh Configuration for TAVR Data Infrastructure Platform
# See: https://sqlmesh.readthedocs.io/en/stable/guides/configuration/

gateways:
  local:
    connection:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'postgres') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', '') }}"
      database: "{{ env_var('POSTGRES_DB', 'dk_data') }}"

default_gateway: local

# Model defaults
model_defaults:
  dialect: postgres
  start: '2024-01-01'

# Physical schema mapping
# Maps logical schema names to actual PostgreSQL schemas
physical_schema_mapping:
  # ALL data schemas map to mol_ prefixed physical schemas
  # SQLMesh model logical names (raw, bronze, silver, gold) → mol_ physical schemas
  raw: mol_raw
  bronze: mol_bronze
  silver: mol_silver
  gold: mol_gold
  # Explicit mol_ prefix mappings (same target, for models that already use mol_ prefix)
  mol_raw: mol_raw
  mol_bronze: mol_bronze
  mol_silver: mol_silver
  mol_gold: mol_gold
  mol_app: mol_app
  # Indication data schemas
  ind_silver: ind_silver
  ind_gold: ind_gold
  # HCP/researcher data schemas
  hcp_silver: hcp_silver
  hcp_gold: hcp_gold
  # Healthcare system (CMS) schemas
  hcs_silver: hcs_silver
  hcs_gold: hcs_gold
  # Application/infrastructure schemas (not molecule data)
  staging: staging
  mart: mart
  scoring: scoring
  # Xenon application schema (015-assessment-dashboard-integration)
  xenon: xenon
  meta: meta

# Project metadata
project: tavr_data_infrastructure

# Environment variables
variables:
  postgres_host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
  postgres_port: "{{ env_var('POSTGRES_PORT', '5432') }}"
  postgres_user: "{{ env_var('POSTGRES_USER', 'postgres') }}"
  postgres_password: "{{ env_var('POSTGRES_PASSWORD', '') }}"
  postgres_db: "{{ env_var('POSTGRES_DB', 'dk_data') }}"

# Plan options
plan:
  auto_apply: false
  include_unmodified: false
