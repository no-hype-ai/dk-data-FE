# SQLMesh Configuration for TAVR Data Infrastructure Platform
# See: https://sqlmesh.readthedocs.io/en/stable/guides/configuration/

gateways:
  local:
    connection:
      type: postgres
      host: localhost
      port: 5433
      user: postgres
      password: postgres
      database: edwards_tavr

default_gateway: local

# Model defaults
model_defaults:
  dialect: postgres
  start: '2024-01-01'

# Physical schema mapping
# Maps logical schema names to actual PostgreSQL schemas
physical_schema_mapping:
  raw: raw
  staging: staging
  mart: mart
  scoring: scoring

# Project metadata
project: tavr_data_infrastructure

# Environment variables (loaded from .env.local)
variables:
  postgres_host: ${POSTGRES_HOST:-localhost}
  postgres_port: ${POSTGRES_PORT:-5433}
  postgres_user: ${POSTGRES_USER:-postgres}
  postgres_password: ${POSTGRES_PASSWORD:-postgres}
  postgres_db: ${POSTGRES_DB:-edwards_tavr}

# Plan options
plan:
  auto_apply: false
  include_unmodified: false
