# SQLMesh Configuration for TAVR Data Infrastructure Platform
# See: https://sqlmesh.readthedocs.io/en/stable/guides/configuration/

gateways:
  local:
    connection:
      type: postgres
      host: ${POSTGRES_HOST:-localhost}
      port: ${POSTGRES_PORT:-5432}
      user: ${POSTGRES_USER:-postgres}
      password: ${POSTGRES_PASSWORD}
      database: ${POSTGRES_DB:-dk_data}

default_gateway: local

# Model defaults
model_defaults:
  dialect: postgres
  start: '2024-01-01'

# Physical schema mapping
# Maps logical schema names to actual PostgreSQL schemas
physical_schema_mapping:
  # TAVR schemas
  raw: raw
  staging: staging
  mart: mart
  scoring: scoring
  # Molecule platform schemas
  mol_raw: mol_raw
  mol_bronze: mol_bronze
  mol_silver: mol_silver
  mol_gold: mol_gold
  mol_app: mol_app

# Project metadata
project: tavr_data_infrastructure

# Environment variables (loaded from .env.local)
variables:
  postgres_host: ${POSTGRES_HOST:-localhost}
  postgres_port: ${POSTGRES_PORT:-5432}
  postgres_user: ${POSTGRES_USER:-postgres}
  postgres_password: ${POSTGRES_PASSWORD}
  postgres_db: ${POSTGRES_DB:-dk_data}

# Plan options
plan:
  auto_apply: false
  include_unmodified: false
