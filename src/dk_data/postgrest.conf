# PostgREST Configuration for DK Data Platform API
# Documentation: https://postgrest.org/en/stable/configuration.html
#
# Usage:
#   postgrest postgrest.conf
#
# Environment variables can be used: PGRST_* prefix

# =============================================================================
# DATABASE CONNECTION
# =============================================================================

# PostgreSQL connection string
# Format: postgres://user:password@host:port/database
# Use environment variables: PGRST_DB_URI=postgres://authenticator:<password>@localhost:5433/dk_data
db-uri = "$(PGRST_DB_URI)"

# Schemas to expose — must match the production k8s configmap
# (see k8s/apps/postgrest/base/configmap.yaml PGRST_DB_SCHEMAS).
# Keep standalone dev parity with production to avoid surprises when
# reproducing prod bugs locally. Feature 002-external-integration-foundation
# T010 synced this from `api` to the full production list.
db-schemas = "api, mol_api, ip_api, mol_silver, mol_gold, hcs_silver, hcs_gold, ind_silver, ind_gold, hcp_silver, hcp_gold, hcs_agents, mol_agents, agents, xenon, meta, mart, scoring, staging, application"

# Role to use for anonymous requests.
# Feature 002-external-integration-foundation US-2: web_anon dropped by
# migration 218. db-anon-role intentionally unset so unauthenticated
# requests return 401 at the protocol level. To temporarily revert the
# lockdown (e.g., during rollback), uncomment the line below AFTER
# running 218_drop_web_anon_rollback.sql.
# db-anon-role = "web_anon"

# Enable connection pooling
db-pool = 10
db-pool-acquisition-timeout = 10

# =============================================================================
# SERVER SETTINGS
# =============================================================================

# Server binding
server-host = "0.0.0.0"
server-port = 3000

# Unix socket (alternative to TCP)
# server-unix-socket = "/tmp/pgrst.sock"

# =============================================================================
# AUTHENTICATION (Anonymous access for read-only)
# =============================================================================

# JWT Secret (not required for anonymous access, but set for future use)
# jwt-secret = "your-256-bit-secret"

# JWT role claim key
# jwt-role-claim-key = ".role"

# =============================================================================
# API BEHAVIOR
# =============================================================================

# Maximum number of rows returned (0 = unlimited)
max-rows = 1000

# Enable count header for pagination
db-extra-search-path = "public"

# Enable OpenAPI generation
openapi-mode = "follow-privileges"
openapi-server-proxy-uri = ""

# Root endpoint behavior
# root-spec = "api.targets"

# =============================================================================
# REQUEST HANDLING
# =============================================================================

# Enable CORS
# Note: For production, configure specific origins
# raw-media-types = "application/json"

# Prefer headers
db-tx-end = "commit"

# =============================================================================
# LOGGING
# =============================================================================

# Log level: crit, error, warn, info, debug
log-level = "info"

# =============================================================================
# PERFORMANCE
# =============================================================================

# Statement timeout (milliseconds)
# db-plan-enabled = false

# Prepared statements
db-prepared-statements = true

# Pre-request function (for custom authorization)
# db-pre-request = "api.check_request"
