name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: data-kinetic/dk-data-fe/job-trigger

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}-${{ steps.vars.outputs.sha_short }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update staging overlay image tag
        run: |
          NEW_TAG="${{ github.ref_name }}-${{ steps.vars.outputs.sha_short }}"
          echo "Updating staging overlay image tag to: $NEW_TAG"
          cd k8s/overlays/staging
          kustomize edit set image "ghcr.io/data-kinetic/dk-data-fe/job-trigger=ghcr.io/data-kinetic/dk-data-fe/job-trigger:${NEW_TAG}"

      - name: Update manifest via PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ github.ref_name }}-${{ steps.vars.outputs.sha_short }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/image-tag-$(date +%s)"
          git checkout -b "$BRANCH"
          git add k8s/overlays/staging/kustomization.yaml
          git diff --staged --quiet && exit 0
          git commit -m "chore: update staging image tag to $NEW_TAG"
          git push -u origin "$BRANCH"
          gh pr create --base "${{ github.ref_name }}" \
            --title "chore: update staging image tag to $NEW_TAG" \
            --body "Auto-generated by CI build workflow." \
            --label ci/cd
          gh pr merge "$BRANCH" --squash --auto --delete-branch
