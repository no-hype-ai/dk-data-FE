name: CI

on:
  pull_request:
    branches:
      - main
      - staging

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linting
        run: ruff check .

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dk_data_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check lock file freshness
        run: |
          pip install uv
          uv lock --check || echo "::warning::Lock file out of date with pyproject.toml"

      - name: Run tests with coverage
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dk_data_test
        run: pytest tests/ -v --tb=short

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

      - name: Coverage PR comment
        if: github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: coverage.xml

  sqlmesh-validate:
    name: Validate SQLMesh Models
    runs-on: ubuntu-latest
    continue-on-error: true  # Informational — CI cannot fully replicate production DB state
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dk_data
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create required schemas
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: dk_data
        run: |
          psql <<'SQL'
          CREATE SCHEMA IF NOT EXISTS raw;
          CREATE SCHEMA IF NOT EXISTS staging;
          CREATE SCHEMA IF NOT EXISTS mart;
          CREATE SCHEMA IF NOT EXISTS scoring;
          CREATE SCHEMA IF NOT EXISTS meta;
          CREATE SCHEMA IF NOT EXISTS api;
          CREATE SCHEMA IF NOT EXISTS mol_raw;
          CREATE SCHEMA IF NOT EXISTS mol_bronze;
          CREATE SCHEMA IF NOT EXISTS mol_silver;
          CREATE SCHEMA IF NOT EXISTS mol_gold;
          CREATE SCHEMA IF NOT EXISTS mol_app;
          CREATE SCHEMA IF NOT EXISTS mol_api;
          CREATE SCHEMA IF NOT EXISTS bronze;
          CREATE SCHEMA IF NOT EXISTS silver;
          CREATE SCHEMA IF NOT EXISTS gold;
          SQL
          echo "All 15 schemas created"

      - name: Initialize base tables
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: dk_data
        run: |
          psql -v AUTHENTICATOR_PASSWORD="ci_test_password" \
            -f src/dk_data/sql/init_database.sql || true
          echo "Base tables initialized (non-fatal errors from roles/auth are expected in CI)"

      - name: Run pending migrations
        continue-on-error: true
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dk_data
        run: python -m dk_data.scripts.run_migrations

      - name: Validate SQLMesh models compile
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dk_data
          SQLMESH_CONFIG: src/dk_data/sqlmesh/config.yaml
        run: |
          set -o pipefail
          cd src/dk_data
          sqlmesh plan --no-prompts --no-auto-categorization 2>&1 | tee /tmp/sqlmesh-plan.log
          echo "SQLMesh model validation passed"

  validate-manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate base manifests
        run: |
          # Install kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

          # Validate kustomize builds
          kubectl kustomize k8s/overlays/staging --enable-helm > /dev/null
          kubectl kustomize k8s/overlays/prod --enable-helm > /dev/null
          echo "Kubernetes manifests validated successfully"
