name: CI

on:
  pull_request:
    branches:
      - main
      - staging

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linting
        run: ruff check .

      # T135 — source-name consistency check (feature 002 US-20).
      # Fails the build if a PR reintroduces a deprecated source name
      # that migration 220 renamed. See scripts/check_source_naming.py.
      - name: Source-name consistency check
        run: python scripts/check_source_naming.py

      # T164 — open-question default lint (feature 002 D14).
      # Ensures feature 002's open-question defaults are still
      # enforced (strict JWT audience, no web_anon grants in new
      # migrations, etc.).
      - name: Open-question defaults lint
        run: python scripts/check_feature_002_defaults.py

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dk_data_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check lock file freshness
        run: |
          pip install uv
          uv lock --check || echo "::warning::Lock file out of date with pyproject.toml"

      - name: Initialize test database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: dk_data_test
        run: |
          # Create extensions and schemas
          psql <<'SQL'
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS "pgcrypto";
          CREATE EXTENSION IF NOT EXISTS "pg_trgm";
          CREATE EXTENSION IF NOT EXISTS "vector";
          CREATE SCHEMA IF NOT EXISTS raw;
          CREATE SCHEMA IF NOT EXISTS staging;
          CREATE SCHEMA IF NOT EXISTS mart;
          CREATE SCHEMA IF NOT EXISTS scoring;
          CREATE SCHEMA IF NOT EXISTS meta;
          CREATE SCHEMA IF NOT EXISTS api;
          CREATE SCHEMA IF NOT EXISTS mol_raw;
          CREATE SCHEMA IF NOT EXISTS mol_bronze;
          CREATE SCHEMA IF NOT EXISTS mol_silver;
          CREATE SCHEMA IF NOT EXISTS mol_gold;
          CREATE SCHEMA IF NOT EXISTS mol_app;
          CREATE SCHEMA IF NOT EXISTS mol_api;
          CREATE SCHEMA IF NOT EXISTS bronze;
          CREATE SCHEMA IF NOT EXISTS silver;
          CREATE SCHEMA IF NOT EXISTS gold;
          CREATE SCHEMA IF NOT EXISTS xenon;
          SQL
          # Create PostgREST roles before init_database.sql (which uses psql :var syntax
          # that can fail in CI). This ensures the authenticator role exists for PostgREST.
          psql <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'web_anon') THEN
              CREATE ROLE web_anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'analyst') THEN
              CREATE ROLE analyst NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'api_user') THEN
              CREATE ROLE api_user NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticator') THEN
              CREATE ROLE authenticator NOINHERIT LOGIN PASSWORD 'ci_test_password_32chars_min!!';
            END IF;
          END $$;
          GRANT web_anon TO authenticator;
          GRANT analyst TO authenticator;
          GRANT api_user TO authenticator;
          GRANT USAGE ON SCHEMA api TO web_anon, analyst, api_user;
          -- 015: analyst access to new schemas
          GRANT USAGE ON SCHEMA mol_gold TO analyst;
          GRANT USAGE ON SCHEMA mol_silver TO analyst;
          GRANT USAGE ON SCHEMA xenon TO analyst;
          GRANT USAGE ON SCHEMA meta TO analyst;
          GRANT SELECT ON ALL TABLES IN SCHEMA mol_gold TO analyst;
          GRANT SELECT ON ALL TABLES IN SCHEMA mol_silver TO analyst;
          GRANT SELECT ON ALL TABLES IN SCHEMA meta TO analyst;
          GRANT SELECT, INSERT, UPDATE ON ALL TABLES IN SCHEMA xenon TO analyst;
          SQL
          # Initialize tables and views (role errors are non-fatal since we created them above)
          # Use ON_ERROR_STOP=0 so psql continues past role-related errors (already handled above)
          # but capture the exit code to warn on unexpected failures
          psql -v AUTHENTICATOR_PASSWORD="ci_test_password_32chars_min!!" \
            -v ON_ERROR_STOP=0 \
            -f src/dk_data/sql/init_database.sql 2>&1 | tee /tmp/init_db.log
          # Fail only if critical table/view creation errors occurred (not role errors)
          if grep -qiE 'ERROR:.*(relation|table|view|function|schema)' /tmp/init_db.log \
             && ! grep -qi 'already exists' /tmp/init_db.log; then
            echo "::warning::init_database.sql had errors — check log above"
          fi
          # Grant SELECT on API views — mirror production db-init Step 10
          # SECURITY: web_anon may ONLY access api.health and api.data_catalog (issue #550)
          psql <<'SQL'
          -- Clean slate: revoke any stale web_anon grants
          REVOKE ALL PRIVILEGES ON ALL TABLES IN SCHEMA api FROM web_anon;

          -- web_anon: only public endpoints
          GRANT SELECT ON api.health TO web_anon;
          GRANT SELECT ON api.data_catalog TO web_anon;

          -- analyst + api_user: explicit view grants (no blanket grants)
          DO $$
          DECLARE v_name TEXT;
          BEGIN
            FOR v_name IN
              SELECT table_name FROM information_schema.views WHERE table_schema = 'api'
            LOOP
              EXECUTE format('GRANT SELECT ON api.%I TO analyst, api_user', v_name);
            END LOOP;
          END $$;
          ALTER DEFAULT PRIVILEGES IN SCHEMA api GRANT SELECT ON TABLES TO analyst, api_user;
          ALTER DEFAULT PRIVILEGES IN SCHEMA mol_gold GRANT SELECT ON TABLES TO analyst, api_user;
          ALTER DEFAULT PRIVILEGES IN SCHEMA mol_silver GRANT SELECT ON TABLES TO analyst, api_user;
          ALTER DEFAULT PRIVILEGES IN SCHEMA meta GRANT SELECT ON TABLES TO analyst, api_user;
          ALTER DEFAULT PRIVILEGES IN SCHEMA xenon GRANT SELECT, INSERT, UPDATE ON TABLES TO analyst;
          ALTER DEFAULT PRIVILEGES IN SCHEMA xenon GRANT SELECT ON TABLES TO api_user;
          SQL
          echo "Database initialized"

      - name: Run migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dk_data_test
        run: python -m dk_data.scripts.run_migrations

      - name: Apply SQLMesh virtual views
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dk_data_test
        run: |
          # Migration 144 drops legacy physical tables so SQLMesh can create
          # virtual views. Run SQLMesh plan here so mol_bronze/silver/gold/staging
          # views exist before PostgREST starts and integration tests run.
          # Use --auto-apply so model-kind changes don't require interactive confirmation.
          sqlmesh -p src/dk_data/sqlmesh plan --auto-apply --skip-backfill 2>&1 | tail -10 || true
          echo "SQLMesh virtual views applied"

      - name: Start PostgREST
        run: |
          docker run -d --name postgrest \
            --network host \
            -e PGRST_DB_URI="postgresql://authenticator:ci_test_password_32chars_min!!@localhost:5432/dk_data_test" \
            -e PGRST_DB_ANON_ROLE="api_user" \
            -e PGRST_DB_SCHEMAS="api,mol_api,mol_gold,mol_silver,xenon,meta" \
            -e PGRST_JWT_SECRET="test-secret-must-be-at-least-32-chars" \
            -e PGRST_SERVER_PORT="3030" \
            postgrest/postgrest:v12.2.3
          # Wait for PostgREST to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3030/ > /dev/null 2>&1; then
              echo "PostgREST is ready"
              break
            fi
            # Check if container is still running
            if ! docker ps -q -f name=postgrest | grep -q .; then
              echo "::error::PostgREST container exited unexpectedly"
              docker logs postgrest 2>&1 || true
              exit 1
            fi
            sleep 1
          done
          # Final check
          curl -sf http://localhost:3030/ > /dev/null 2>&1 || {
            echo "::error::PostgREST failed to start within 30s"
            docker logs postgrest 2>&1 || true
            exit 1
          }

      - name: Run unit tests with coverage
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dk_data_test
          POSTGREST_URL: http://localhost:3030
          JWT_SECRET: test-secret-must-be-at-least-32-chars
        run: pytest tests/ -v --tb=short -m "not integration"

      - name: Run integration tests (PostgREST)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dk_data_test
          POSTGREST_URL: http://localhost:3030
          JWT_SECRET: test-secret-must-be-at-least-32-chars
        run: pytest tests/ -v --tb=short -m "integration" --no-cov

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/


  sqlmesh-validate:
    name: Validate SQLMesh Models
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dk_data
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create required schemas
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: dk_data
        run: |
          psql <<'SQL'
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS "pgcrypto";
          CREATE EXTENSION IF NOT EXISTS "pg_trgm";
          CREATE EXTENSION IF NOT EXISTS "vector";
          CREATE SCHEMA IF NOT EXISTS raw;
          CREATE SCHEMA IF NOT EXISTS staging;
          CREATE SCHEMA IF NOT EXISTS mart;
          CREATE SCHEMA IF NOT EXISTS scoring;
          CREATE SCHEMA IF NOT EXISTS meta;
          CREATE SCHEMA IF NOT EXISTS api;
          CREATE SCHEMA IF NOT EXISTS mol_raw;
          CREATE SCHEMA IF NOT EXISTS mol_bronze;
          CREATE SCHEMA IF NOT EXISTS mol_silver;
          CREATE SCHEMA IF NOT EXISTS mol_gold;
          CREATE SCHEMA IF NOT EXISTS mol_app;
          CREATE SCHEMA IF NOT EXISTS mol_api;
          CREATE SCHEMA IF NOT EXISTS bronze;
          CREATE SCHEMA IF NOT EXISTS silver;
          CREATE SCHEMA IF NOT EXISTS gold;
          CREATE SCHEMA IF NOT EXISTS xenon;
          SQL
          echo "Extensions and schemas created"

      - name: Initialize base tables
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: dk_data
        run: |
          # Create roles first (init_database.sql psql :var syntax can fail in CI)
          psql <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'web_anon') THEN
              CREATE ROLE web_anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'analyst') THEN
              CREATE ROLE analyst NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'api_user') THEN
              CREATE ROLE api_user NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticator') THEN
              CREATE ROLE authenticator NOINHERIT LOGIN PASSWORD 'ci_test_password';
            END IF;
          END $$;
          GRANT web_anon TO authenticator;
          GRANT analyst TO authenticator;
          GRANT api_user TO authenticator;
          GRANT USAGE ON SCHEMA api TO web_anon, analyst, api_user;
          SQL
          psql -v AUTHENTICATOR_PASSWORD="ci_test_password" \
            -v ON_ERROR_STOP=0 \
            -f src/dk_data/sql/init_database.sql 2>&1 | tee /tmp/init_db.log
          if grep -qiE 'ERROR:.*(relation|table|view|function|schema)' /tmp/init_db.log \
             && ! grep -qi 'already exists' /tmp/init_db.log; then
            echo "::warning::init_database.sql had errors — check log above"
          fi
          echo "Base tables initialized"

      - name: Run pending migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dk_data
        run: python -m dk_data.scripts.run_migrations

      - name: Validate SQLMesh models compile
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dk_data
        run: |
          set -o pipefail
          # Run SQLMesh plan in dry-run mode; capture output for analysis
          SQLMESH_EXIT=0
          echo n | sqlmesh -p src/dk_data/sqlmesh plan --no-prompts 2>&1 | tee /tmp/sqlmesh-plan.log || SQLMESH_EXIT=$?
          # Check for compilation/SQL errors (not just backfill abort which is expected)
          if grep -qiE '(Error:|error:|FATAL|SyntaxError|sqlmesh\.utils\.errors)' /tmp/sqlmesh-plan.log \
             && ! grep -qE '(Plan application failed|Aborted|No changes)' /tmp/sqlmesh-plan.log; then
            echo "::error::SQLMesh model compilation failed"
            grep -iE '(Error:|error:|FATAL)' /tmp/sqlmesh-plan.log
            exit 1
          fi
          echo "SQLMesh model validation passed (exit=$SQLMESH_EXIT)"

  validate-manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate base manifests
        run: |
          # Install kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

          # Validate kustomize builds
          kubectl kustomize k8s/overlays/staging --enable-helm > /dev/null
          kubectl kustomize k8s/overlays/prod --enable-helm > /dev/null
          echo "Kubernetes manifests validated successfully"

  # ---------------------------------------------------------------------------
  # Feature: 005-prestaged-hydration — T084
  # Smoke test: import the new prestaged module + run it in --dry-run mode
  # against an empty fixture root. Catches import errors, missing deps, and
  # any breakage in plan_load() before it ships. Non-blocking by design — the
  # full e2e test is gated behind @pytest.mark.integration and lives in
  # tests/load/test_prestaged_e2e.py.
  #
  # Note: no untrusted GitHub event inputs are referenced in any run: block
  # below — only fixed paths and PYTHONPATH=src.
  # ---------------------------------------------------------------------------
  prestaged-smoke:
    name: Prestaged Hydration Smoke (005)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic loguru psycopg2-binary tenacity pytest mypy httpx python-dotenv prometheus-client

      - name: Run prestaged unit tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest \
            tests/ingestion/test_load_order.py \
            tests/ingestion/test_wal_throttle.py \
            tests/ingestion/test_prestaged_discovery.py \
            tests/ingestion/test_prestaged_validate.py \
            tests/ingestion/test_prestaged_fallback.py \
            tests/ingestion/test_prestaged_idempotency.py \
            --override-ini="addopts="

      - name: mypy --strict on new modules
        run: |
          # --follow-imports=silent keeps the strict checks scoped to the
          # six new 005 modules only; transitive imports into unrelated
          # files (e.g. cms_catalog.py) are type-checked by their own
          # owners, not this gate.
          cd src && python -m mypy --strict --ignore-missing-imports --follow-imports=silent \
            dk_data/ingestion/prestaged_types.py \
            dk_data/ingestion/prestaged_safety.py \
            dk_data/ingestion/transform_runs_writer.py \
            dk_data/ingestion/load_order.py \
            dk_data/ingestion/wal_throttle.py \
            dk_data/ingestion/prestaged.py

      - name: CLI dry-run against empty PRESTAGED_ROOT
        env:
          PYTHONPATH: src
        run: |
          mkdir -p /tmp/empty_prestaged
          PRESTAGED_ROOT=/tmp/empty_prestaged \
            python -m dk_data.ingestion.prestaged --dry-run --source-list all \
            > /tmp/dry-run.json
          tail -1 /tmp/dry-run.json | python -c "import json,sys; d=json.loads(sys.stdin.read()); assert d.get('summary'), d; assert d['total_steps'] > 50, d; print('OK', d['total_steps'], 'steps')"

      - name: kubectl dry-run on Job manifest
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          kubectl --dry-run=client apply -f deploy/jobs/prestaged-hydrate.yaml

  # ---------------------------------------------------------------------------
  # Feature: 001-silver-medallion-rebuild — T003
  # FR-030 / SC-015: Enforce that every dk-data Python entry point obtains its
  # DB connection via build_dsn() — no direct psycopg2.connect() outside
  # database.py.  A match here is a CI failure.
  # ---------------------------------------------------------------------------
  enforce-build-dsn:
    name: Enforce build_dsn() usage (FR-030)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Grep for direct psycopg2.connect() calls outside database.py
        run: |
          # Find any psycopg2.connect( call outside the canonical helper module.
          # We exclude:
          #   - database.py itself (the only allowed location)
          #   - tests/ (test fixtures may use direct connections for schema setup)
          #   - conftest.py (test infrastructure)
          VIOLATIONS=$(grep -rn "psycopg2\.connect(" src/ \
            --include="*.py" \
            --exclude="database.py" --exclude="run_migrations.py" \
            | grep -v "build_dsn" \
            || true)

          if [ -n "$VIOLATIONS" ]; then
            echo "::error::FR-030 violation: direct psycopg2.connect() found outside database.py"
            echo "All connections must go through dk_data.ingestion.utils.database.build_dsn()"
            echo ""
            echo "Violations:"
            echo "$VIOLATIONS"
            exit 1
          fi

          echo "FR-030 check passed: no direct psycopg2.connect() calls outside database.py"

  # ---------------------------------------------------------------------------
  # Feature: 001-silver-medallion-rebuild — T004
  # FR-015–FR-020 / SC-012: Grep for the 5 banned silver antipattern signatures.
  # Any match in src/dk_data/sqlmesh/models/ is a CI failure.
  # ---------------------------------------------------------------------------
  enforce-no-silver-antipatterns:
    name: Enforce zero silver antipatterns (FR-015–FR-020)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: S1 — OR-join between two hub-eligible identifiers
        run: |
          # S1: OR-join pattern — e.g. a.inchi_key = b.inchi_key OR LOWER(a.name) = LOWER(b.name)
          # This forces a hash join to degrade to a nested loop.
          MATCHES=$(grep -rn \
            --include="*.sql" \
            -E "\.(inchi_key|chembl_id|pubchem_cid|unii|ndc|rxcui|npi|ccn|orcid|patent_number|trademark_id)\s*=.*\bOR\b.*\.(name|canonical_name|brand_name|generic_name)" \
            src/dk_data/sqlmesh/models/ || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::S1 antipattern (OR-join hub identifiers) found in silver models"
            echo "$MATCHES"
            exit 1
          fi
          echo "S1 check passed"

      - name: S2 — Leading-wildcard LIKE against indexed columns
        run: |
          # S2: '%' || name || '%' — forces full table scan, kills index
          MATCHES=$(grep -rn \
            --include="*.sql" \
            -E "LIKE\s+'%'\s*\|\|" \
            src/dk_data/sqlmesh/models/ || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::S2 antipattern (leading-wildcard LIKE) found in silver models"
            echo "$MATCHES"
            exit 1
          fi
          echo "S2 check passed"

      - name: S3 — Correlated scalar subqueries in SELECT lists
        run: |
          # S3: (SELECT ... FROM ... WHERE outer_col = ...) in a SELECT list
          # This runs once per output row — O(N) DB round trips.
          MATCHES=$(grep -rn \
            --include="*.sql" \
            -P "SELECT\s+\(SELECT\s+\S.*?FROM\s+\S" \
            src/dk_data/sqlmesh/models/ || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::S3 antipattern (correlated scalar subquery in SELECT) found in silver models"
            echo "$MATCHES"
            exit 1
          fi
          echo "S3 check passed"

      - name: S4 — Global DISTINCT ON over multi-way UNION ALL
        run: |
          # S4: DISTINCT ON (...) ... UNION ALL — sorts the entire union result
          MATCHES=$(grep -rn \
            --include="*.sql" \
            -E "DISTINCT ON.*UNION ALL|UNION ALL.*DISTINCT ON" \
            src/dk_data/sqlmesh/models/ || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::S4 antipattern (DISTINCT ON over UNION ALL) found in silver models"
            echo "$MATCHES"
            exit 1
          fi
          echo "S4 check passed"

      - name: S5 — similarity() combined with = in the same OR clause
        run: |
          # S5: similarity(...) >= 0.85 OR col = 'value' — forces sequential scan
          MATCHES=$(grep -rn \
            --include="*.sql" \
            -E "similarity\s*\(.*\)\s*(>=|>|<=|<)\s*[0-9.]+\s+(OR|AND).*=" \
            src/dk_data/sqlmesh/models/ || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::S5 antipattern (similarity() mixed with = in OR) found in silver models"
            echo "$MATCHES"
            exit 1
          fi
          echo "S5 check passed"

      - name: Summary
        run: echo "All 5 silver antipattern checks passed (FR-015–FR-020 / SC-012)"
