name: CI

on:
  pull_request:
    branches:
      - main
      - staging

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linting
        run: ruff check .

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dk_data_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check lock file freshness
        run: |
          pip install uv
          uv lock --check || echo "::warning::Lock file out of date with pyproject.toml"

      - name: Initialize test database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: dk_data_test
        run: |
          # Create extensions and schemas
          psql <<'SQL'
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS "pgcrypto";
          CREATE EXTENSION IF NOT EXISTS "pg_trgm";
          CREATE EXTENSION IF NOT EXISTS "vector";
          CREATE SCHEMA IF NOT EXISTS raw;
          CREATE SCHEMA IF NOT EXISTS staging;
          CREATE SCHEMA IF NOT EXISTS mart;
          CREATE SCHEMA IF NOT EXISTS scoring;
          CREATE SCHEMA IF NOT EXISTS meta;
          CREATE SCHEMA IF NOT EXISTS api;
          CREATE SCHEMA IF NOT EXISTS mol_raw;
          CREATE SCHEMA IF NOT EXISTS mol_bronze;
          CREATE SCHEMA IF NOT EXISTS mol_silver;
          CREATE SCHEMA IF NOT EXISTS mol_gold;
          CREATE SCHEMA IF NOT EXISTS mol_app;
          CREATE SCHEMA IF NOT EXISTS mol_api;
          CREATE SCHEMA IF NOT EXISTS bronze;
          CREATE SCHEMA IF NOT EXISTS silver;
          CREATE SCHEMA IF NOT EXISTS gold;
          CREATE SCHEMA IF NOT EXISTS xenon;
          SQL
          # Create PostgREST roles before init_database.sql (which uses psql :var syntax
          # that can fail in CI). This ensures the authenticator role exists for PostgREST.
          psql <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'web_anon') THEN
              CREATE ROLE web_anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'analyst') THEN
              CREATE ROLE analyst NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'api_user') THEN
              CREATE ROLE api_user NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticator') THEN
              CREATE ROLE authenticator NOINHERIT LOGIN PASSWORD 'ci_test_password_32chars_min!!';
            END IF;
          END $$;
          GRANT web_anon TO authenticator;
          GRANT analyst TO authenticator;
          GRANT api_user TO authenticator;
          GRANT USAGE ON SCHEMA api TO web_anon, analyst, api_user;
          -- 015: analyst access to new schemas
          GRANT USAGE ON SCHEMA mol_gold TO analyst;
          GRANT USAGE ON SCHEMA mol_silver TO analyst;
          GRANT USAGE ON SCHEMA xenon TO analyst;
          GRANT USAGE ON SCHEMA meta TO analyst;
          GRANT SELECT ON ALL TABLES IN SCHEMA mol_gold TO analyst;
          GRANT SELECT ON ALL TABLES IN SCHEMA mol_silver TO analyst;
          GRANT SELECT ON ALL TABLES IN SCHEMA meta TO analyst;
          GRANT SELECT, INSERT, UPDATE ON ALL TABLES IN SCHEMA xenon TO analyst;
          SQL
          # Initialize tables and views (role errors are non-fatal since we created them above)
          # Use ON_ERROR_STOP=0 so psql continues past role-related errors (already handled above)
          # but capture the exit code to warn on unexpected failures
          psql -v AUTHENTICATOR_PASSWORD="ci_test_password_32chars_min!!" \
            -v ON_ERROR_STOP=0 \
            -f src/dk_data/sql/init_database.sql 2>&1 | tee /tmp/init_db.log
          # Fail only if critical table/view creation errors occurred (not role errors)
          if grep -qiE 'ERROR:.*(relation|table|view|function|schema)' /tmp/init_db.log \
             && ! grep -qi 'already exists' /tmp/init_db.log; then
            echo "::warning::init_database.sql had errors — check log above"
          fi
          # Grant SELECT on API views — mirror production db-init Step 10
          # SECURITY: web_anon may ONLY access api.health and api.data_catalog (issue #550)
          psql <<'SQL'
          -- Clean slate: revoke any stale web_anon grants
          REVOKE ALL PRIVILEGES ON ALL TABLES IN SCHEMA api FROM web_anon;

          -- web_anon: only public endpoints
          GRANT SELECT ON api.health TO web_anon;
          GRANT SELECT ON api.data_catalog TO web_anon;

          -- analyst + api_user: explicit view grants (no blanket grants)
          DO $$
          DECLARE v_name TEXT;
          BEGIN
            FOR v_name IN
              SELECT table_name FROM information_schema.views WHERE table_schema = 'api'
            LOOP
              EXECUTE format('GRANT SELECT ON api.%I TO analyst, api_user', v_name);
            END LOOP;
          END $$;
          ALTER DEFAULT PRIVILEGES IN SCHEMA api GRANT SELECT ON TABLES TO analyst, api_user;
          ALTER DEFAULT PRIVILEGES IN SCHEMA mol_gold GRANT SELECT ON TABLES TO analyst, api_user;
          ALTER DEFAULT PRIVILEGES IN SCHEMA mol_silver GRANT SELECT ON TABLES TO analyst, api_user;
          ALTER DEFAULT PRIVILEGES IN SCHEMA meta GRANT SELECT ON TABLES TO analyst, api_user;
          ALTER DEFAULT PRIVILEGES IN SCHEMA xenon GRANT SELECT, INSERT, UPDATE ON TABLES TO analyst;
          ALTER DEFAULT PRIVILEGES IN SCHEMA xenon GRANT SELECT ON TABLES TO api_user;
          SQL
          echo "Database initialized"

      - name: Run migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dk_data_test
        run: python -m dk_data.scripts.run_migrations

      - name: Apply SQLMesh virtual views
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dk_data_test
        run: |
          # Migration 144 drops legacy physical tables so SQLMesh can create
          # virtual views. Run SQLMesh plan here so mol_bronze/silver/gold/staging
          # views exist before PostgREST starts and integration tests run.
          echo n | sqlmesh -p src/dk_data/sqlmesh plan --no-prompts 2>&1 | tail -5 || true
          echo "SQLMesh virtual views applied"

      - name: Start PostgREST
        run: |
          docker run -d --name postgrest \
            --network host \
            -e PGRST_DB_URI="postgresql://authenticator:ci_test_password_32chars_min!!@localhost:5432/dk_data_test" \
            -e PGRST_DB_ANON_ROLE="web_anon" \
            -e PGRST_DB_SCHEMAS="api,mol_api,mol_gold,mol_silver,xenon,meta" \
            -e PGRST_JWT_SECRET="test-secret-must-be-at-least-32-chars" \
            -e PGRST_SERVER_PORT="3030" \
            postgrest/postgrest:v12.2.3
          # Wait for PostgREST to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3030/ > /dev/null 2>&1; then
              echo "PostgREST is ready"
              break
            fi
            # Check if container is still running
            if ! docker ps -q -f name=postgrest | grep -q .; then
              echo "::error::PostgREST container exited unexpectedly"
              docker logs postgrest 2>&1 || true
              exit 1
            fi
            sleep 1
          done
          # Final check
          curl -sf http://localhost:3030/ > /dev/null 2>&1 || {
            echo "::error::PostgREST failed to start within 30s"
            docker logs postgrest 2>&1 || true
            exit 1
          }

      - name: Run unit tests with coverage
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dk_data_test
          POSTGREST_URL: http://localhost:3030
          JWT_SECRET: test-secret-must-be-at-least-32-chars
        run: pytest tests/ -v --tb=short -m "not integration"

      - name: Run integration tests (PostgREST)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dk_data_test
          POSTGREST_URL: http://localhost:3030
          JWT_SECRET: test-secret-must-be-at-least-32-chars
        run: pytest tests/ -v --tb=short -m "integration" --no-cov

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/


  sqlmesh-validate:
    name: Validate SQLMesh Models
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dk_data
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create required schemas
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: dk_data
        run: |
          psql <<'SQL'
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS "pgcrypto";
          CREATE EXTENSION IF NOT EXISTS "pg_trgm";
          CREATE EXTENSION IF NOT EXISTS "vector";
          CREATE SCHEMA IF NOT EXISTS raw;
          CREATE SCHEMA IF NOT EXISTS staging;
          CREATE SCHEMA IF NOT EXISTS mart;
          CREATE SCHEMA IF NOT EXISTS scoring;
          CREATE SCHEMA IF NOT EXISTS meta;
          CREATE SCHEMA IF NOT EXISTS api;
          CREATE SCHEMA IF NOT EXISTS mol_raw;
          CREATE SCHEMA IF NOT EXISTS mol_bronze;
          CREATE SCHEMA IF NOT EXISTS mol_silver;
          CREATE SCHEMA IF NOT EXISTS mol_gold;
          CREATE SCHEMA IF NOT EXISTS mol_app;
          CREATE SCHEMA IF NOT EXISTS mol_api;
          CREATE SCHEMA IF NOT EXISTS bronze;
          CREATE SCHEMA IF NOT EXISTS silver;
          CREATE SCHEMA IF NOT EXISTS gold;
          CREATE SCHEMA IF NOT EXISTS xenon;
          SQL
          echo "Extensions and schemas created"

      - name: Initialize base tables
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: dk_data
        run: |
          # Create roles first (init_database.sql psql :var syntax can fail in CI)
          psql <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'web_anon') THEN
              CREATE ROLE web_anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'analyst') THEN
              CREATE ROLE analyst NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'api_user') THEN
              CREATE ROLE api_user NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticator') THEN
              CREATE ROLE authenticator NOINHERIT LOGIN PASSWORD 'ci_test_password';
            END IF;
          END $$;
          GRANT web_anon TO authenticator;
          GRANT analyst TO authenticator;
          GRANT api_user TO authenticator;
          GRANT USAGE ON SCHEMA api TO web_anon, analyst, api_user;
          SQL
          psql -v AUTHENTICATOR_PASSWORD="ci_test_password" \
            -v ON_ERROR_STOP=0 \
            -f src/dk_data/sql/init_database.sql 2>&1 | tee /tmp/init_db.log
          if grep -qiE 'ERROR:.*(relation|table|view|function|schema)' /tmp/init_db.log \
             && ! grep -qi 'already exists' /tmp/init_db.log; then
            echo "::warning::init_database.sql had errors — check log above"
          fi
          echo "Base tables initialized"

      - name: Run pending migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dk_data
        run: python -m dk_data.scripts.run_migrations

      - name: Validate SQLMesh models compile
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dk_data
        run: |
          set -o pipefail
          # Run SQLMesh plan in dry-run mode; capture output for analysis
          SQLMESH_EXIT=0
          echo n | sqlmesh -p src/dk_data/sqlmesh plan --no-prompts 2>&1 | tee /tmp/sqlmesh-plan.log || SQLMESH_EXIT=$?
          # Check for compilation/SQL errors (not just backfill abort which is expected)
          if grep -qiE '(Error:|error:|FATAL|SyntaxError|sqlmesh\.utils\.errors)' /tmp/sqlmesh-plan.log \
             && ! grep -qE '(Plan application failed|Aborted|No changes)' /tmp/sqlmesh-plan.log; then
            echo "::error::SQLMesh model compilation failed"
            grep -iE '(Error:|error:|FATAL)' /tmp/sqlmesh-plan.log
            exit 1
          fi
          echo "SQLMesh model validation passed (exit=$SQLMESH_EXIT)"

  validate-manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate base manifests
        run: |
          # Install kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

          # Validate kustomize builds
          kubectl kustomize k8s/overlays/staging --enable-helm > /dev/null
          kubectl kustomize k8s/overlays/prod --enable-helm > /dev/null
          echo "Kubernetes manifests validated successfully"
