name: Promote to Production

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types:
      - completed
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: data-kinetic/dk-data-fe/job-trigger

jobs:
  promote:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      packages: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get staging image tag from overlay
        id: staging
        run: |
          # Read the actual image tag from the staging overlay instead of
          # computing from HEAD (which may be a manifest commit, not the
          # build commit — causing MANIFEST_UNKNOWN errors).
          STAGING_TAG=$(awk '/newTag:/ {print $2}' k8s/overlays/staging/kustomization.yaml)
          SHORT_SHA=${STAGING_TAG#main-}
          echo "tag=${STAGING_TAG}" >> $GITHUB_OUTPUT
          echo "sha_short=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Staging image tag: ${STAGING_TAG} (sha: ${SHORT_SHA})"

      - name: Tag image for production
        run: |
          STAGING_TAG="${{ steps.staging.outputs.tag }}"
          PROD_TAG="prod-${{ steps.staging.outputs.sha_short }}"
          echo "Promoting ${STAGING_TAG} -> ${PROD_TAG}"
          crane tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${STAGING_TAG}" "${PROD_TAG}"

      - name: Update production overlay
        run: |
          PROD_TAG="prod-${{ steps.staging.outputs.sha_short }}"
          cd k8s/overlays/prod
          kustomize edit set image "ghcr.io/data-kinetic/dk-data-fe/job-trigger=ghcr.io/data-kinetic/dk-data-fe/job-trigger:${PROD_TAG}"

      - name: Update production manifest via PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROD_TAG: prod-${{ steps.staging.outputs.sha_short }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/prod-image-tag-$(date +%s)"
          git checkout -b "$BRANCH"
          git add k8s/overlays/prod/kustomization.yaml
          git diff --staged --quiet && exit 0
          git commit -m "chore: promote image to $PROD_TAG"
          git push -u origin "$BRANCH"
          gh pr create --base main \
            --title "chore: promote image to $PROD_TAG" \
            --body "Auto-generated by CI promote-to-prod workflow." \
            --label ci/cd
          gh pr merge "$BRANCH" --squash --auto --delete-branch
