name: Grafana Uplift

# T068 (026-observability-dashboard-metrics-fix): Thin caller for the shared Grafana
# sync workflow in data-kinetic/.github. Triggers when grafana/ files change on main
# and opens a PR in dk-alchemy to apply dashboard/alert changes.
#
# NOTE: Blocked on the shared reusable workflow being published in data-kinetic/.github.
# When available, replace the placeholder job below with:
#   uses: data-kinetic/.github/.github/workflows/grafana-sync.yaml@main
#   with:
#     source-path: grafana/
#     exclude: cms-pipeline-health.json

on:
  push:
    branches:
      - main
    paths:
      - 'grafana/**'
      - '!grafana/dashboards/cms-pipeline-health.json'

jobs:
  grafana-uplift:
    name: Sync Grafana assets to dk-alchemy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log changed grafana files
        run: |
          echo "Grafana files changed on main:"
          git diff --name-only HEAD~1 HEAD -- grafana/ \
            | grep -v 'cms-pipeline-health.json' || true

      # TODO: Replace this placeholder with the shared reusable workflow call once
      # data-kinetic/.github/.github/workflows/grafana-sync.yaml is published.
      # Example:
      #   uses: data-kinetic/.github/.github/workflows/grafana-sync.yaml@main
      #   secrets: inherit
      #   with:
      #     source-path: grafana/
      #     target-repo: data-kinetic/dk-alchemy
      #     exclude: cms-pipeline-health.json
      - name: Placeholder — shared workflow not yet available
        run: |
          echo "Shared grafana-sync workflow not yet published in data-kinetic/.github."
          echo "Manual sync required until the shared workflow is available."
          echo "Changed files:"
          git diff --name-only HEAD~1 HEAD -- grafana/ | grep -v cms-pipeline-health || true
