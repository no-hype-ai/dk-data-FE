# Kubernetes CronJob Contract: Molecule Pipeline
#
# Three CronJobs added to k8s/base/ingestion/:
# All use the same GHCR image as job-trigger with different command entrypoints.
# All mount dk-data-secrets for database credentials.
# All include imagePullSecrets for GHCR access.

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mol-fetch-daily
  labels:
    app: mol-fetch-daily
    app.kubernetes.io/name: mol-fetch-daily
    app.kubernetes.io/component: ingestion
    app.kubernetes.io/part-of: dk-data
spec:
  schedule: "0 2 * * *"  # 2 AM UTC daily
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200  # 2 hour timeout
      template:
        metadata:
          labels:
            app: mol-fetch-daily
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-credentials
          containers:
            - name: mol-fetch-daily
              image: ghcr.io/data-kinetic-projects/dk-data-fe/job-trigger:latest
              command: ["python", "-m", "dk_data.ingestion.fetch_molecules"]
              args: ["--source", "clinicaltrials,openfda_labels"]
              env:
                # Database credentials from Doppler
                - name: POSTGRES_HOST
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_HOST
                - name: POSTGRES_PORT
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_PORT
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_PASSWORD
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_DB
                # Observability
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_ENABLED
                  value: "true"
                # Pipeline config from ConfigMap
              envFrom:
                - configMapRef:
                    name: molecule-pipeline-config
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "300m"

