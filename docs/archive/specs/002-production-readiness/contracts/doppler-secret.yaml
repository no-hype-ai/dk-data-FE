# DopplerSecret Contract for dk-data-fe
# Feature: 002-production-readiness
# Purpose: Define the secret synchronization from Doppler to Kubernetes
#
# This contract specifies:
# 1. Required secrets that MUST exist in Doppler project
# 2. Kubernetes Secret structure created by DopplerSecret operator
# 3. Environment-specific configurations (prod/staging)
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: dk-data-fe-secrets
  namespace: dk-data-fe-prod  # Parameterized per environment
  labels:
    app.kubernetes.io/name: dk-data-fe
    app.kubernetes.io/component: secrets
    app.kubernetes.io/managed-by: doppler-operator
spec:
  # Reference to the Doppler service token
  tokenSecret:
    name: doppler-token-dk-data-fe
    key: serviceToken

  # Doppler project and config
  project: dk-infrastructure
  config: prod  # prod | staging | dev

  # Target Kubernetes Secret
  managedSecret:
    name: dk-data-fe-secrets
    type: Opaque
    # The following keys will be created in the Secret:
    # - POSTGRES_HOST
    # - POSTGRES_PORT
    # - POSTGRES_USER
    # - POSTGRES_PASSWORD
    # - POSTGRES_DB
    # - PGRST_JWT_SECRET
    # - ANTHROPIC_API_KEY (optional, for enrichment service)

  # Resync interval for secret rotation support
  resyncSeconds: 300  # 5 minutes - allows rotation within SLA

---
# Doppler Token Secret (created manually or via CI/CD)
# This is the service account token for Doppler access
apiVersion: v1
kind: Secret
metadata:
  name: doppler-token-dk-data-fe
  namespace: dk-data-fe-prod
type: Opaque
stringData:
  serviceToken: "dp.st.PLACEHOLDER_REPLACE_IN_DEPLOYMENT"
  # Actual token obtained from:
  # doppler configure set token --project dk-infrastructure --config prod

---
# Contract Verification Checklist
#
# Before deployment, verify:
# [ ] Doppler project "dk-infrastructure" exists
# [ ] Config "prod" (or staging) exists in project
# [ ] All required secrets are set in Doppler:
#     [ ] POSTGRES_HOST
#     [ ] POSTGRES_PORT
#     [ ] POSTGRES_USER
#     [ ] POSTGRES_PASSWORD
#     [ ] POSTGRES_DB
#     [ ] PGRST_JWT_SECRET (256-bit minimum)
# [ ] Service token created with read access to config
# [ ] doppler-operator is running in cluster
