# dk-data-fe Docker Compose
# Feature: 002-production-readiness
# Tasks: T031, T033
#
# Services:
#   - postgres: PostgreSQL database
#   - postgrest: REST API layer for PostgreSQL
#   - job-trigger: FastAPI service for triggering batch jobs
#   - sqlmesh-scheduler: SQLMesh daemon — runs bronze/silver/gold models on cron schedule
#   - metabase: BI dashboard tool
#
# Prerequisites:
#   1. Copy .env.example to .env and configure required secrets
#   2. Or use Doppler: doppler run -- docker compose up
#
# Usage:
#   docker compose up -d
#   docker compose down
#
# Initialize database after first start:
#   docker compose exec postgres psql -U postgres -d dk_data -f /docker-entrypoint-initdb.d/init_database.sql
#
# Health checks:
#   curl http://localhost:3030/health
#   curl http://localhost:8000/health

services:
  # ==========================================================================
  # PostgreSQL - Database
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: dk-data-fe-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      # SECURITY: No default password - must be set via environment or .env file
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: "${POSTGRES_DB:-dk_data}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Mount SQL files for initialization
      - ./src/dk_data/sql:/docker-entrypoint-initdb.d:ro
    networks:
      - dk-data-fe-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dk_data}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================================================
  # DB Migrate - One-shot migration runner (runs before API and PostgREST)
  # ==========================================================================
  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dk-data-fe-db-migrate
    restart: "no"
    environment:
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: "${POSTGRES_DB:-dk_data}"
    entrypoint: ["python", "-m", "dk_data.scripts.run_migrations"]
    command: []
    networks:
      - dk-data-fe-network
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================================================
  # PostgREST - REST API for PostgreSQL
  # ==========================================================================
  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: dk-data-fe-postgrest
    restart: unless-stopped
    ports:
      - "${POSTGREST_PORT:-3030}:3000"
    environment:
      # Database connection - connects to postgres service within docker network
      # SECURITY: No default password - must be set via environment or .env file
      PGRST_DB_URI: "postgres://authenticator:${POSTGREST_PASSWORD:?POSTGREST_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-dk_data}"
      PGRST_DB_SCHEMAS: "api,mol_silver,mol_gold,ind_silver,ind_gold,hcp_silver,hcp_gold,hcs_silver,hcs_gold,ops,xenon,meta"
      PGRST_DB_ANON_ROLE: "web_anon"
      PGRST_DB_POOL: "10"
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: "10"
      PGRST_SERVER_HOST: "0.0.0.0"
      PGRST_SERVER_PORT: "3000"
      PGRST_MAX_ROWS: "1000"
      PGRST_LOG_LEVEL: "info"
      PGRST_DB_PREPARED_STATEMENTS: "true"
      PGRST_OPENAPI_MODE: "follow-privileges"
      # JWT configuration for role-based access
      PGRST_JWT_SECRET: "${PGRST_JWT_SECRET:-}"
      PGRST_JWT_ROLE_CLAIM_KEY: ".role"
    networks:
      - dk-data-fe-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  # ==========================================================================
  # Job Trigger - FastAPI service for batch job management
  # ==========================================================================
  job-trigger:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dk-data-fe-job-trigger
    restart: unless-stopped
    ports:
      - "${JOB_TRIGGER_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      # SECURITY: No default password - must be set via environment or .env file
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: "${POSTGRES_DB:-dk_data}"
      # For local dev, use subprocess runner instead of K8s
      JOB_RUNNER_MODE: "local"
      LOG_LEVEL: "info"
      OTEL_SDK_DISABLED: "true"
      # Point hot SQLMesh runner at the volume-mounted project (local dev only)
      # In K8s the image bundles /app/sqlmesh so this env var is not needed
      SQLMESH_PROJECT_PATH: "/app/sqlmesh"
      # WHO ICD-11 API credentials (from Doppler)
      WHO_ICD_CLIENT_ID: "${WHO_ICD_CLIENT_ID:-}"
      WHO_ICD_CLIENT_SECRET: "${WHO_ICD_CLIENT_SECRET:-}"
    volumes:
      # Mount scripts from canonical location
      - ./src/dk_data/scripts:/app/scripts:ro
      # Mount SQLMesh project for hot runner (local dev)
      - ./src/dk_data/sqlmesh:/app/sqlmesh:ro
      # Data and logs directories
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - dk-data-fe-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  # ==========================================================================
  # SQLMesh Scheduler - runs bronze/silver/gold models on cron schedule
  # Reads cron expressions from model definitions and executes them natively.
  # Hot-path transforms (per-ingest) are handled by job-trigger via subprocess.
  # ==========================================================================
  sqlmesh-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dk-data-fe-sqlmesh-scheduler
    restart: unless-stopped
    # `sqlmesh run` is daemon mode: reads cron from model definitions and
    # executes each model when its schedule is due. No --select-model means
    # ALL models are managed by the scheduler.
    entrypoint: []
    command: >
      sqlmesh
        --paths /app/sqlmesh
        --gateway local
        run
    working_dir: /tmp
    volumes:
      # Local dev: mount source for live edits. In K8s the image bundles /app/sqlmesh.
      - ./src/dk_data/sqlmesh:/app/sqlmesh:ro
    environment:
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: "${POSTGRES_DB:-dk_data}"
      SQLMESH_ENV: "prod"
      LOG_LEVEL: "info"
      # WHO ICD-11 API credentials (from Doppler)
      WHO_ICD_CLIENT_ID: "${WHO_ICD_CLIENT_ID:-}"
      WHO_ICD_CLIENT_SECRET: "${WHO_ICD_CLIENT_SECRET:-}"
    networks:
      - dk-data-fe-network
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  # ==========================================================================
  # Metabase - BI Dashboard Tool
  # ==========================================================================
  metabase:
    image: metabase/metabase:v0.50.26
    platform: linux/amd64
    container_name: dk-data-fe-metabase
    restart: unless-stopped
    ports:
      - "${METABASE_PORT:-3000}:3000"
    environment:
      # Metabase application database (embedded H2 for simplicity)
      MB_DB_TYPE: "h2"
      MB_DB_FILE: "/metabase-data/metabase.db"
      # Java memory settings
      JAVA_OPTS: "-Xmx1g"
      # Timezone
      MB_JAVA_TIMEZONE: "US/Pacific"
    volumes:
      - metabase-data:/metabase-data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dk-data-fe-network

# ==========================================================================
# Networks
# ==========================================================================
networks:
  dk-data-fe-network:
    driver: bridge

# ==========================================================================
# Volumes
# ==========================================================================
volumes:
  postgres-data:
    driver: local
  metabase-data:
    driver: local
