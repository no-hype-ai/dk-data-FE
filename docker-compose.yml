# dk-data-fe Docker Compose
# Feature: 002-production-readiness
# Tasks: T031, T033
#
# Services:
#   - postgres: PostgreSQL database
#   - postgrest: REST API layer for PostgreSQL
#   - job-trigger: FastAPI service for triggering batch jobs
#   - metabase: BI dashboard tool
#
# Prerequisites:
#   1. Copy .env.example to .env and configure required secrets
#   2. Or use Doppler: doppler run -- docker compose up
#
# Usage:
#   docker compose up -d
#   docker compose down
#
# Initialize database after first start:
#   docker compose exec postgres psql -U postgres -d dk_data -f /docker-entrypoint-initdb.d/init_database.sql
#
# Health checks:
#   curl http://localhost:3030/health
#   curl http://localhost:8000/health

services:
  # ==========================================================================
  # PostgreSQL - Database
  # ==========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dk-data-fe-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      # SECURITY: No default password - must be set via environment or .env file
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: "${POSTGRES_DB:-dk_data}"
      # Passed to 01-set-passwords.sh so it can set the authenticator role password
      # to match what PostgREST expects. Falls back to POSTGRES_PASSWORD if unset.
      POSTGREST_PASSWORD: "${POSTGREST_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Init scripts run in lexicographic order on fresh volume creation only.
      # 00_dev_init.sql — creates all schemas, roles, and meta tables.
      # 01_set_passwords.sh — sets authenticator password from POSTGREST_PASSWORD env var.
      # To reset: docker compose down -v && docker compose up -d postgres
      - ./scripts/dev-init.sql:/docker-entrypoint-initdb.d/00_dev_init.sql:ro
      - ./scripts/01-set-passwords.sh:/docker-entrypoint-initdb.d/01_set_passwords.sh:ro
    networks:
      - dk-data-fe-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dk_data}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================================================
  # PostgREST - REST API for PostgreSQL
  # ==========================================================================
  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: dk-data-fe-postgrest
    restart: unless-stopped
    ports:
      - "${POSTGREST_PORT:-3030}:3000"
    environment:
      # Database connection - connects to postgres service within docker network
      # SECURITY: No default password - must be set via environment or .env file
      # Accepts POSTGREST_PASSWORD or falls back to POSTGRES_PASSWORD (Doppler compat)
      PGRST_DB_URI: "postgres://authenticator:${POSTGREST_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}}@postgres:5432/${POSTGRES_DB:-dk_data}"
      # Schemas exposed via PostgREST — MUST match k8s/apps/postgrest/base/configmap.yaml
      # PGRST_DB_SCHEMAS in production. Feature 002-external-integration-foundation T011
      # added mol_api, ip_api, hcs_agents, mol_agents, agents to match production state.
      PGRST_DB_SCHEMAS: "api,mol_api,ip_api,mol_silver,mol_gold,hcs_silver,hcs_gold,ind_silver,ind_gold,hcp_silver,hcp_gold,hcs_agents,mol_agents,agents,xenon,meta,mart,scoring,staging,application"
      # Feature 002-external-integration-foundation US-2: web_anon role
      # dropped by migration 218. Every PostgREST request requires a
      # valid JWT. Uncomment below only to temporarily revert the lockdown
      # (after running 218_drop_web_anon_rollback.sql).
      # PGRST_DB_ANON_ROLE: "web_anon"
      PGRST_DB_POOL: "10"
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: "10"
      PGRST_SERVER_HOST: "0.0.0.0"
      PGRST_SERVER_PORT: "3000"
      PGRST_MAX_ROWS: "1000"
      PGRST_LOG_LEVEL: "info"
      PGRST_DB_PREPARED_STATEMENTS: "true"
      PGRST_OPENAPI_MODE: "follow-privileges"
      # JWT configuration for role-based access
      # Accepts PGRST_JWT_SECRET or falls back to JWT_SECRET (Doppler compat)
      PGRST_JWT_SECRET: "${PGRST_JWT_SECRET:-${JWT_SECRET:-}}"
      PGRST_JWT_ROLE_CLAIM_KEY: ".role"
    networks:
      - dk-data-fe-network
    healthcheck:
      # PostgREST image is minimal (no curl/wget/nc). K8s probes use httpGet.
      # Locally we just check the process is alive via shell builtin.
      test: ["CMD-SHELL", "true"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================================================
  # Job Trigger - FastAPI service for batch job management
  # ==========================================================================
  job-trigger:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dk-data-fe-job-trigger
    restart: unless-stopped
    ports:
      - "${JOB_TRIGGER_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      # SECURITY: No default password - must be set via environment or .env file
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: "${POSTGRES_DB:-dk_data}"
      # For local dev, use subprocess runner instead of K8s
      JOB_RUNNER_MODE: "local"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # External API credentials (injected via Doppler)
      WHO_ICD_CLIENT_ID: "${WHO_ICD_CLIENT_ID:-}"
      WHO_ICD_CLIENT_SECRET: "${WHO_ICD_CLIENT_SECRET:-}"
      EPO_CONSUMER_KEY: "${EPO_CONSUMER_KEY:-}"
      EPO_CONSUMER_SECRET: "${EPO_CONSUMER_SECRET:-}"
      EUIPO_API_KEY: "${EUIPO_API_KEY:-}"
      EUIPO_SECRET_KEY: "${EUIPO_SECRET_KEY:-}"
      USPTO_API_KEY: "${USPTO_API_KEY:-}"
      USPTO_TSDR_API_KEY: "${USPTO_TSDR_API_KEY:-}"
      OPENALEX_API_KEY: "${OPENALEX_API_KEY:-}"
      OPENFDA_API_KEY: "${OPENFDA_API_KEY:-}"
      NCBI_API_KEY: "${NCBI_API_KEY:-}"
      DRUGBANK_API_KEY: "${DRUGBANK_API_KEY:-}"
      SEC_USER_AGENT: "${SEC_USER_AGENT:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      LITELLM_API_KEY: "${LITELLM_API_KEY:-}"
      LITELLM_BASE_URL: "${LITELLM_BASE_URL:-}"
      LITELLM_MODEL_ALIAS: "${LITELLM_MODEL_ALIAS:-}"
      # JWT secret — must match PostgREST so tokens are interoperable
      JWT_SECRET: "${JWT_SECRET:-${PGRST_JWT_SECRET:-}}"
    volumes:
      # Mount scripts from canonical location
      - ./src/dk_data/scripts:/app/scripts:ro
      # Data and logs directories
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - dk-data-fe-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================================================
  # Metabase - BI Dashboard Tool
  # ==========================================================================
  metabase:
    image: metabase/metabase:v0.50.26
    platform: linux/amd64
    container_name: dk-data-fe-metabase
    restart: unless-stopped
    ports:
      - "${METABASE_PORT:-3000}:3000"
    environment:
      # Metabase application database (embedded H2 for simplicity)
      MB_DB_TYPE: "h2"
      MB_DB_FILE: "/metabase-data/metabase.db"
      # Java memory settings
      JAVA_OPTS: "-Xmx1g"
      # Timezone
      MB_JAVA_TIMEZONE: "US/Pacific"
    volumes:
      - metabase-data:/metabase-data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dk-data-fe-network

# ==========================================================================
# Networks
# ==========================================================================
networks:
  dk-data-fe-network:
    driver: bridge

# ==========================================================================
# Volumes
# ==========================================================================
volumes:
  postgres-data:
    driver: local
  metabase-data:
    driver: local
