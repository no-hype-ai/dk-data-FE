[project]
name = "dk-data"
version = "0.2.0"
description = "DK Data Platform - TAVR Hospital Intelligence + Molecule Data Pipeline"
requires-python = ">=3.11"
dependencies = [
    # Core dependencies
    "sqlmesh>=0.90.0",
    "psycopg2-binary>=2.9.9",
    "pandas>=2.0.0",
    "anthropic>=0.40.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    # Molecule platform dependencies (004-molecule-platform-integration)
    "aiohttp>=3.9.0",
    "httpx>=0.25.0",
    "pyjwt>=2.8.0",
    "loguru>=0.7.0",
    "tqdm>=4.66.0",
    # API dependencies
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.6",
    # Kubernetes client
    "kubernetes>=29.0.0",
    # Observability dependencies
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-instrumentation-psycopg2>=0.41b0",
    "opentelemetry-instrumentation-requests>=0.41b0",
    "structlog>=24.0.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-postgresql>=6.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dk_data"]
