[project]
name = "dk-data"
version = "0.2.0"
description = "DK Data Platform - TAVR Hospital Intelligence + Molecule Data Pipeline"
requires-python = ">=3.11"
dependencies = [
    # Core dependencies
    "sqlmesh>=0.90.0,<1.0",
    "psycopg2-binary>=2.9.9,<3.0",
    "pandas>=2.0.0,<3.0",
    "anthropic>=0.40.0,<1.0",
    "openai>=1.0.0,<2.0",  # LiteLLM OpenAI-compatible client (016-cms-puf)
    "pydantic>=2.5.0,<3.0",
    "pydantic-settings>=2.0.0,<3.0",
    "requests>=2.31.0,<3.0",
    "python-dotenv>=1.0.0,<2.0",
    "beautifulsoup4>=4.12.0,<5.0",
    "feedparser>=6.0.0,<7.0",
    "openpyxl>=3.1.0,<4.0",
    "lxml>=5.0.0,<6.0",
    # Molecule platform dependencies (004-molecule-platform-integration)
    "aiohttp>=3.9.0,<4.0",
    "cryptography>=41.0.0,<43.0",
    "httpx>=0.25.0,<1.0",
    "jinja2>=3.1.0,<4.0",
    "pyjwt>=2.8.0,<3.0",
    "pyyaml>=6.0.0,<7.0",
    "redis>=5.0.0,<6.0",
    "tenacity>=8.2.0,<9.0",
    "loguru>=0.7.0,<1.0",
    "tqdm>=4.66.0,<5.0",
    "asyncpg>=0.29.0,<1.0",
    # API dependencies
    "fastapi>=0.109.0,<1.0",
    "uvicorn>=0.27.0,<1.0",
    "python-multipart>=0.0.6,<1.0",
    # Kubernetes client
    "kubernetes>=29.0.0,<32.0",
    # Observability dependencies
    "opentelemetry-api>=1.20.0,<2.0",
    "opentelemetry-sdk>=1.20.0,<2.0",
    "opentelemetry-exporter-otlp>=1.20.0,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0,<1.0",
    "opentelemetry-instrumentation-psycopg2>=0.41b0,<1.0",
    "opentelemetry-instrumentation-requests>=0.41b0,<1.0",
    "structlog>=24.0.0,<25.0",
    "prometheus-client>=0.19.0,<1.0",
    "email-validator>=2.0.0,<3.0",
    # MCP server (016-cms-puf)
    "mcp>=1.0.0,<2.0",
    # PDF text extraction for SEC exhibit 15.1 parsing (20-F Annual Report exhibits)
    "pypdf>=4.0.0,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "pytest-cov>=6.0.0,<7.0",
    "pytest-postgresql>=6.0.0,<7.0",
    "responses>=0.25.0,<1.0",
    "ruff>=0.1.0,<1.0",
    "email-validator>=2.0.0,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dk_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--cov=src/dk_data",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=15",
]

[tool.coverage.run]
source = ["src/dk_data"]
branch = true
omit = [
    "src/dk_data/sqlmesh/*",
    "src/dk_data/scripts/*",
    "src/dk_data/data/*",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
