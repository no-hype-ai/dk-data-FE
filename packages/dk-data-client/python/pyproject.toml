[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dk-data-client"
version = "0.1.0"
description = "First-party client for dk-data (behaviorlabs data platform) — auth, caching, fallback, telemetry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "DataKinetic" }]
keywords = ["dk-data", "behaviorlabs", "healthcare", "drug-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database :: Front-Ends",
]

dependencies = [
    "httpx>=0.27,<1.0",
    "cachetools>=5.3,<6.0",
    "pydantic>=2.5,<3.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0,<6.0"]
sqlite = []  # stdlib
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
    "mypy>=1.8",
    "ruff>=0.3",
]

[project.urls]
Homepage = "https://github.com/datakinetic/dk-data-FE"
Documentation = "https://github.com/datakinetic/dk-data-FE/blob/main/packages/dk-data-client/python/README.md"
Repository = "https://github.com/datakinetic/dk-data-FE"
"Bug Tracker" = "https://github.com/datakinetic/dk-data-FE/issues"

[tool.setuptools.packages.find]
include = ["dk_data_client*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter
