# ArgoCD PostSync hook — trigger active fetch CronJobs after each deployment
# Fixes: dk-data-FE #213
# When mol-fetch-daily/weekly/monthly were suspended, ArgoCD dk-data-prod got stuck
# in Running state after every deploy (~18 hours on 2026-04-03 post-PR #211).
# This hook creates a one-time Job that runs all active fetchers after sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: postsync-backfill
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 3600  # 1 hour max
  template:
    metadata:
      labels:
        app: postsync-backfill
        app.kubernetes.io/name: postsync-backfill
        app.kubernetes.io/component: post-deploy
        app.kubernetes.io/part-of: dk-data
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: postsync-backfill
          image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:staging-latest
          command:
            - python
            - -m
            - dk_data.ingestion.fetch_data
          args:
            - --source
            - all
            - --skip-if-recent
            - "12"  # Skip sources refreshed within last 12 hours (idempotent on re-deploys)
          env:
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_DB
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.infra.svc.cluster.local:4317"
            - name: OTEL_ENABLED
              value: "true"
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
