# FDA NDC Fetch CronJob
# Issue #203 phase 2 fix for fda_ndc scheduling/temp file behavior
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fetch-fda-ndc
  labels:
    app: fetch-fda-ndc
    app.kubernetes.io/name: fetch-fda-ndc
    app.kubernetes.io/component: ingestion
    app.kubernetes.io/part-of: dk-data
spec:
  schedule: "0 3 * * 0"  # Weekly Sunday 3 AM UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200  # 2 hour timeout
      template:
        metadata:
          labels:
            app: fetch-fda-ndc
            app.kubernetes.io/component: batch-job
            app.kubernetes.io/part-of: dk-data
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-credentials
          containers:
            - name: fetch-fda-ndc
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:main-5f46ed1
              command:
                - python
                - -m
                - dk_data.ingestion.fetch_data
                - --source
                - fda_ndc
              env:
                - name: POSTGRES_HOST
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_HOST
                - name: POSTGRES_PORT
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_PORT
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_PASSWORD
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_DB
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_ENABLED
                  value: "true"
              securityContext:
                readOnlyRootFilesystem: false
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "1Gi"
                  cpu: "500m"
