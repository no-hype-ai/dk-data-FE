# Molecule Fetch Weekly CronJob
# 004-molecule-platform-integration
# Fetches data from weekly-refresh sources: OpenFDA FAERS, ChEMBL, PubChem
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mol-fetch-weekly
  labels:
    app: mol-fetch-weekly
    app.kubernetes.io/name: mol-fetch-weekly
    app.kubernetes.io/component: ingestion
    app.kubernetes.io/part-of: dk-data
spec:
  schedule: "0 3 * * 0"  # Sunday 3 AM UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 14400  # 4 hour timeout
      template:
        metadata:
          labels:
            app: mol-fetch-weekly
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-credentials
          containers:
            - name: mol-fetch-weekly
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:staging-f0b30ec
              command: ["python", "-m", "dk_data.ingestion.fetch_molecules"]
              args: ["--source", "openfda_faers,chembl,pubchem"]
              env:
                - name: POSTGRES_HOST
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_HOST
                - name: POSTGRES_PORT
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_PORT
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_PASSWORD
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_DB
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_ENABLED
                  value: "true"
              envFrom:
                - configMapRef:
                    name: molecule-pipeline-config
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "300m"
