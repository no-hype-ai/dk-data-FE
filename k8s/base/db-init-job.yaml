apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  labels:
    app.kubernetes.io/name: db-init
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: dk-data
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-init
        app.kubernetes.io/part-of: dk-data
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: postgres:16.4
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_HOST
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_PORT
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_PASSWORD
            - name: PGUSER
              value: "postgres"
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              echo "=== dk-data database initialization ==="
              echo "Host: $PGHOST:$PGPORT"

              # --- Step 1: Create database (connect to default 'postgres' db) ---
              echo "Creating database dk_data if not exists..."
              psql -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'dk_data'" | grep -q 1 || \
                psql -d postgres -c "CREATE DATABASE dk_data"

              # --- Step 2: Create extensions ---
              echo "Creating extensions..."
              psql -d dk_data <<'SQL'
              CREATE EXTENSION IF NOT EXISTS pg_trgm;  -- Fuzzy text matching for molecule search
              CREATE EXTENSION IF NOT EXISTS "uuid-ossp";  -- UUID generation
              SQL

              # --- Step 3: Create schemas ---
              echo "Creating schemas..."
              psql -d dk_data <<'SQL'
              -- TAVR schemas
              CREATE SCHEMA IF NOT EXISTS raw;
              CREATE SCHEMA IF NOT EXISTS staging;
              CREATE SCHEMA IF NOT EXISTS mart;
              CREATE SCHEMA IF NOT EXISTS scoring;
              CREATE SCHEMA IF NOT EXISTS meta;
              CREATE SCHEMA IF NOT EXISTS api;
              -- Molecule platform schemas (004-molecule-platform-integration)
              CREATE SCHEMA IF NOT EXISTS mol_raw;
              CREATE SCHEMA IF NOT EXISTS mol_bronze;
              CREATE SCHEMA IF NOT EXISTS mol_silver;
              CREATE SCHEMA IF NOT EXISTS mol_gold;
              CREATE SCHEMA IF NOT EXISTS mol_app;
              CREATE SCHEMA IF NOT EXISTS mol_api;
              SQL

              # --- Step 4: Create roles ---
              echo "Creating roles..."
              psql -d dk_data <<'SQL'
              DO $role$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticator') THEN
                  CREATE ROLE authenticator LOGIN NOINHERIT;
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'web_anon') THEN
                  CREATE ROLE web_anon NOLOGIN;
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'analyst') THEN
                  CREATE ROLE analyst NOLOGIN;
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'api_user') THEN
                  CREATE ROLE api_user NOLOGIN;
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'readonly') THEN
                  CREATE ROLE readonly LOGIN;
                END IF;
              END $role$;
              SQL

              # --- Step 5: Set authenticator password ---
              echo "Setting authenticator password..."
              AUTHENTICATOR_PASS=$(psql -d postgres -Atc "SELECT current_setting('app.authenticator_password', true)" 2>/dev/null || echo "")
              if [ -n "$AUTHENTICATOR_PASS" ]; then
                psql -d dk_data -c "ALTER ROLE authenticator PASSWORD '$AUTHENTICATOR_PASS'"
              fi

              # --- Step 6: Grant role hierarchy ---
              echo "Granting role hierarchy..."
              psql -d dk_data <<'SQL'
              GRANT web_anon TO authenticator;
              GRANT analyst TO authenticator;
              GRANT api_user TO authenticator;
              SQL

              # --- Step 7: Grant schema usage and table permissions ---
              echo "Granting permissions..."
              psql -d dk_data <<'SQL'
              -- web_anon: minimal access
              REVOKE ALL PRIVILEGES ON ALL TABLES IN SCHEMA api FROM web_anon;
              GRANT USAGE ON SCHEMA api TO web_anon;
              DO $perm$
              BEGIN
                IF EXISTS (SELECT 1 FROM information_schema.tables
                           WHERE table_schema = 'api' AND table_name = 'data_catalog') THEN
                  EXECUTE 'GRANT SELECT ON api.data_catalog TO web_anon';
                END IF;
                IF EXISTS (SELECT 1 FROM information_schema.tables
                           WHERE table_schema = 'api' AND table_name = 'health') THEN
                  EXECUTE 'GRANT SELECT ON api.health TO web_anon';
                END IF;
              END $perm$;

              -- analyst: read targets, scoring, data_sources, data_catalog
              GRANT USAGE ON SCHEMA api TO analyst;
              DO $perm$
              BEGIN
                IF EXISTS (SELECT 1 FROM information_schema.tables
                           WHERE table_schema = 'api' AND table_name = 'targets') THEN
                  EXECUTE 'GRANT SELECT ON api.targets TO analyst';
                END IF;
                IF EXISTS (SELECT 1 FROM information_schema.tables
                           WHERE table_schema = 'api' AND table_name = 'scoring') THEN
                  EXECUTE 'GRANT SELECT ON api.scoring TO analyst';
                END IF;
                IF EXISTS (SELECT 1 FROM information_schema.tables
                           WHERE table_schema = 'api' AND table_name = 'data_sources') THEN
                  EXECUTE 'GRANT SELECT ON api.data_sources TO analyst';
                END IF;
                IF EXISTS (SELECT 1 FROM information_schema.tables
                           WHERE table_schema = 'api' AND table_name = 'data_catalog') THEN
                  EXECUTE 'GRANT SELECT ON api.data_catalog TO analyst';
                END IF;
              END $perm$;

              -- api_user: full read access to api schema
              GRANT USAGE ON SCHEMA api TO api_user;
              GRANT SELECT ON ALL TABLES IN SCHEMA api TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA api GRANT SELECT ON TABLES TO api_user;

              -- readonly: read access to api and mart schemas
              GRANT USAGE ON SCHEMA api TO readonly;
              GRANT USAGE ON SCHEMA mart TO readonly;
              GRANT SELECT ON ALL TABLES IN SCHEMA api TO readonly;
              GRANT SELECT ON ALL TABLES IN SCHEMA mart TO readonly;
              ALTER DEFAULT PRIVILEGES IN SCHEMA api GRANT SELECT ON TABLES TO readonly;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mart GRANT SELECT ON TABLES TO readonly;
              SQL

              # --- Step 8: Grant molecule schema permissions ---
              echo "Granting molecule schema permissions..."
              psql -d dk_data <<'SQL'
              -- mol_api: read access for web_anon, analyst, api_user
              GRANT USAGE ON SCHEMA mol_api TO web_anon;
              GRANT USAGE ON SCHEMA mol_api TO analyst;
              GRANT USAGE ON SCHEMA mol_api TO api_user;
              GRANT SELECT ON ALL TABLES IN SCHEMA mol_api TO web_anon;
              GRANT SELECT ON ALL TABLES IN SCHEMA mol_api TO analyst;
              GRANT SELECT ON ALL TABLES IN SCHEMA mol_api TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_api GRANT SELECT ON TABLES TO web_anon;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_api GRANT SELECT ON TABLES TO analyst;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_api GRANT SELECT ON TABLES TO api_user;

              -- mol_raw, mol_bronze, mol_silver, mol_gold, mol_app: full access for api_user (ingestion)
              GRANT USAGE ON SCHEMA mol_raw TO api_user;
              GRANT USAGE ON SCHEMA mol_bronze TO api_user;
              GRANT USAGE ON SCHEMA mol_silver TO api_user;
              GRANT USAGE ON SCHEMA mol_gold TO api_user;
              GRANT USAGE ON SCHEMA mol_app TO api_user;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA mol_raw TO api_user;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA mol_bronze TO api_user;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA mol_silver TO api_user;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA mol_gold TO api_user;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA mol_app TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_raw GRANT ALL ON TABLES TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_bronze GRANT ALL ON TABLES TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_silver GRANT ALL ON TABLES TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_gold GRANT ALL ON TABLES TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_app GRANT ALL ON TABLES TO api_user;

              -- Sequence permissions for api_user (needed for inserts)
              GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA mol_raw TO api_user;
              GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA mol_bronze TO api_user;
              GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA mol_silver TO api_user;
              GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA mol_gold TO api_user;
              GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA mol_app TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_raw GRANT USAGE, SELECT ON SEQUENCES TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_bronze GRANT USAGE, SELECT ON SEQUENCES TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_silver GRANT USAGE, SELECT ON SEQUENCES TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_gold GRANT USAGE, SELECT ON SEQUENCES TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_app GRANT USAGE, SELECT ON SEQUENCES TO api_user;
              SQL

              # --- Step 9: Create API views ---
              echo "Creating API views..."
              psql -d dk_data <<'SQL'
              -- api.health: Health check endpoint for Kubernetes probes
              CREATE OR REPLACE VIEW api.health AS
              SELECT
                'ok'::text AS status,
                now() AS timestamp,
                current_database() AS database;

              -- api.data_catalog: Metadata about available data sources
              CREATE OR REPLACE VIEW api.data_catalog AS
              SELECT
                schemaname,
                relname AS tablename,
                n_live_tup AS row_count,
                last_vacuum,
                last_analyze
              FROM pg_stat_user_tables
              WHERE schemaname IN ('raw', 'staging', 'mart', 'mol_raw', 'mol_bronze', 'mol_silver', 'mol_gold')
              ORDER BY schemaname, relname;

              -- api.targets: Hospital targeting data (placeholder)
              CREATE OR REPLACE VIEW api.targets AS
              SELECT
                'placeholder'::text AS hospital_id,
                'No data loaded'::text AS name,
                'N/A'::text AS tier,
                0::numeric AS score,
                now() AS updated_at
              WHERE false;

              -- api.scoring: Scoring breakdown details (placeholder)
              CREATE OR REPLACE VIEW api.scoring AS
              SELECT
                'placeholder'::text AS hospital_id,
                'No data loaded'::text AS factor,
                0::numeric AS weight,
                0::numeric AS score
              WHERE false;

              -- api.data_sources: Data source configuration (enhanced for Compass)
              CREATE OR REPLACE VIEW api.data_sources AS
              SELECT
                '00000000-0000-0000-0000-000000000000'::uuid AS id,
                'placeholder'::text AS name,
                'none'::text AS source_type,
                now() AS last_fetch_at,
                'pending'::text AS status,
                0::bigint AS record_count,
                NULL::text AS error_message
              WHERE false;

              -- api.molecules: Molecule discovery data for Compass search (placeholder)
              -- Source: mol_gold.molecules when available
              CREATE OR REPLACE VIEW api.molecules AS
              SELECT
                '00000000-0000-0000-0000-000000000000'::uuid AS id,
                'placeholder'::text AS smiles,
                'placeholder'::text AS inchi_key,
                'No molecules loaded'::text AS name,
                0::numeric AS molecular_weight,
                now() AS created_at,
                now() AS updated_at
              WHERE false;

              -- api.resolution_queue: Pending molecule resolution items for Compass workflow (placeholder)
              -- Source: mol_app.resolution_queue when available
              CREATE OR REPLACE VIEW api.resolution_queue AS
              SELECT
                '00000000-0000-0000-0000-000000000000'::uuid AS id,
                'placeholder'::text AS source_id,
                'placeholder'::text AS target_smiles,
                'pending'::text AS status,
                0::integer AS priority,
                now() AS created_at,
                NULL::timestamptz AS resolved_at
              WHERE false;
              SQL

              # --- Step 10: Grant permissions on API views ---
              echo "Granting permissions on API views..."
              psql -d dk_data <<'SQL'
              -- Clean slate: revoke all existing permissions from web_anon on api schema
              REVOKE ALL PRIVILEGES ON ALL TABLES IN SCHEMA api FROM web_anon;

              -- web_anon: only health and data_catalog (public endpoints)
              GRANT SELECT ON api.health TO web_anon;
              GRANT SELECT ON api.data_catalog TO web_anon;

              -- analyst: read access to targets, scoring, data_sources, data_catalog
              GRANT SELECT ON api.targets TO analyst;
              GRANT SELECT ON api.scoring TO analyst;
              GRANT SELECT ON api.data_sources TO analyst;
              GRANT SELECT ON api.data_catalog TO analyst;
              GRANT SELECT ON api.health TO analyst;

              -- api_user: full read access to all api views
              GRANT SELECT ON api.health TO api_user;
              GRANT SELECT ON api.data_catalog TO api_user;
              GRANT SELECT ON api.targets TO api_user;
              GRANT SELECT ON api.scoring TO api_user;
              GRANT SELECT ON api.data_sources TO api_user;
              GRANT SELECT ON api.molecules TO api_user;
              GRANT SELECT ON api.resolution_queue TO api_user;

              -- Compass views: web_anon gets molecules and data_sources (public), but NOT resolution_queue
              GRANT SELECT ON api.molecules TO web_anon;
              GRANT SELECT ON api.data_sources TO web_anon;
              -- Explicitly ensure web_anon cannot access resolution_queue (internal workflow)
              REVOKE ALL ON api.resolution_queue FROM web_anon;

              -- analyst: gets resolution_queue access
              GRANT SELECT ON api.molecules TO analyst;
              GRANT SELECT ON api.resolution_queue TO analyst;
              SQL

              # --- Step 11: Cross-database isolation ---
              echo "Enforcing cross-database isolation..."
              psql -d postgres <<'SQL'
              DO $iso$
              BEGIN
                IF EXISTS (SELECT 1 FROM pg_database WHERE datname = 'behavior_labs') THEN
                  EXECUTE 'REVOKE CONNECT ON DATABASE behavior_labs FROM authenticator';
                  EXECUTE 'REVOKE CONNECT ON DATABASE behavior_labs FROM readonly';
                END IF;
              END $iso$;
              SQL

              # --- Step 12: Verification ---
              echo "=== Verification ==="
              echo "Checking roles..."
              ROLE_COUNT=$(psql -d dk_data -Atc "SELECT COUNT(*) FROM pg_roles WHERE rolname IN ('authenticator', 'web_anon', 'analyst', 'api_user', 'readonly')")
              if [ "$ROLE_COUNT" -eq 5 ]; then
                echo "✓ All 5 roles created successfully"
              else
                echo "✗ ERROR: Expected 5 roles, found $ROLE_COUNT"
                exit 1
              fi

              echo "Checking schemas..."
              SCHEMA_COUNT=$(psql -d dk_data -Atc "SELECT COUNT(*) FROM pg_namespace WHERE nspname IN ('raw', 'staging', 'mart', 'scoring', 'meta', 'api', 'mol_raw', 'mol_bronze', 'mol_silver', 'mol_gold', 'mol_app', 'mol_api')")
              if [ "$SCHEMA_COUNT" -eq 12 ]; then
                echo "✓ All 12 schemas created successfully"
              else
                echo "✗ ERROR: Expected 12 schemas, found $SCHEMA_COUNT"
                exit 1
              fi

              echo "Checking API views..."
              VIEW_COUNT=$(psql -d dk_data -Atc "SELECT COUNT(*) FROM information_schema.views WHERE table_schema = 'api'")
              if [ "$VIEW_COUNT" -ge 7 ]; then
                echo "✓ Found $VIEW_COUNT API views"
              else
                echo "✗ ERROR: Expected at least 7 views, found $VIEW_COUNT"
                exit 1
              fi

              echo ""
              echo "=== Database initialization complete ==="
              echo "Roles: authenticator, web_anon, analyst, api_user, readonly"
              echo "Schemas: raw, staging, mart, scoring, meta, api, mol_*"
              echo "Views: api.health, api.data_catalog, api.targets, api.scoring, api.data_sources, api.molecules, api.resolution_queue"
