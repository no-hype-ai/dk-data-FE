apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dk-data-alerts
  labels:
    app.kubernetes.io/name: dk-data
    app.kubernetes.io/component: alerts
    prometheus: mimir
spec:
  groups:
    - name: dk-data.data-freshness
      interval: 5m
      rules:
        - alert: DataSourceStale
          expr: |
            (time() - dk_data_source_last_refresh_timestamp) > 172800
          for: 30m
          labels:
            severity: warning
            team: data-platform
          annotations:
            summary: "Data source {{ $labels.source_name }} is stale"
            description: |
              Data source {{ $labels.source_name }} has not been refreshed in over 48 hours.
              Last refresh: {{ $value | humanizeDuration }} ago.

        - alert: DataSourceCriticallyStale
          expr: |
            (time() - dk_data_source_last_refresh_timestamp) > 604800
          for: 1h
          labels:
            severity: critical
            team: data-platform
          annotations:
            summary: "Data source {{ $labels.source_name }} critically stale (>7 days)"
            description: |
              Data source {{ $labels.source_name }} has not been refreshed in over 7 days.

    - name: dk-data.api-health
      interval: 30s
      rules:
        - alert: APIHighErrorRate
          expr: |
            (
              sum(rate(http_requests_total{namespace=~"dk-data-.*", status=~"5.."}[5m]))
              /
              sum(rate(http_requests_total{namespace=~"dk-data-.*"}[5m]))
            ) > 0.05
          for: 5m
          labels:
            severity: critical
            team: data-platform
          annotations:
            summary: "High API error rate (>5%)"
            description: |
              PostgREST API is returning >5% 5xx errors.
              Current error rate: {{ $value | humanizePercentage }}

        - alert: APIUnavailable
          expr: |
            up{job="postgrest", namespace=~"dk-data-.*"} == 0
          for: 2m
          labels:
            severity: critical
            team: data-platform
          annotations:
            summary: "PostgREST API is unavailable"
            description: "PostgREST service is not responding to health checks."

    - name: dk-data.batch-jobs
      interval: 1m
      rules:
        - alert: BatchJobFailed
          expr: |
            increase(batch_job_failures_total{namespace=~"dk-data-.*"}[1h]) > 2
          for: 0m
          labels:
            severity: warning
            team: data-platform
          annotations:
            summary: "Batch job {{ $labels.job_name }} failed >2 times in 1h"
            description: |
              Batch job {{ $labels.job_name }} has failed multiple times.

        - alert: CronJobMissedSchedule
          expr: |
            (time() - kube_cronjob_next_schedule_time{namespace=~"dk-data-.*"}) > 3600
          for: 10m
          labels:
            severity: warning
            team: data-platform
          annotations:
            summary: "CronJob {{ $labels.cronjob }} missed schedule"
            description: |
              CronJob {{ $labels.cronjob }} has missed its scheduled execution by over 1 hour.

    - name: dk-data.resources
      interval: 1m
      rules:
        - alert: PodHighMemory
          expr: |
            (
              container_memory_usage_bytes{namespace=~"dk-data-.*"}
              /
              container_spec_memory_limit_bytes{namespace=~"dk-data-.*"}
            ) > 0.80
          for: 15m
          labels:
            severity: warning
            team: data-platform
          annotations:
            summary: "Pod {{ $labels.pod }} memory usage >80%"
            description: |
              Pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of its memory limit.

        - alert: JobTriggerNotReady
          expr: |
            kube_deployment_status_replicas_ready{namespace=~"dk-data-.*", deployment="job-trigger"} == 0
          for: 5m
          labels:
            severity: critical
            team: data-platform
          annotations:
            summary: "Job Trigger pod not ready for 5m"
            description: "No Job Trigger replicas are ready in namespace {{ $labels.namespace }}."
