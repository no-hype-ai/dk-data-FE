apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dk-data-alerts
  labels:
    app.kubernetes.io/name: dk-data
    app.kubernetes.io/component: alerts
    prometheus: mimir
spec:
  groups:
    - name: dk-data.data-freshness
      interval: 5m
      rules:
        - alert: DataSourceStale
          expr: |
            (time() - dk_data_source_last_refresh_timestamp) > 172800
          for: 30m
          labels:
            severity: warning
            team: data-platform
          annotations:
            summary: "Data source {{ $labels.source_name }} is stale"
            description: |
              Data source {{ $labels.source_name }} has not been refreshed in over 48 hours.
              Last refresh: {{ $value | humanizeDuration }} ago.

        - alert: DataSourceCriticallyStale
          expr: |
            (time() - dk_data_source_last_refresh_timestamp) > 604800
          for: 1h
          labels:
            severity: critical
            team: data-platform
          annotations:
            summary: "Data source {{ $labels.source_name }} critically stale (>7 days)"
            description: |
              Data source {{ $labels.source_name }} has not been refreshed in over 7 days.

    - name: dk-data.api-health
      interval: 30s
      rules:
        - alert: APIHighErrorRate
          expr: |
            (
              sum(rate(http_requests_total{namespace=~"dk-data-.*", status=~"5.."}[5m]))
              /
              sum(rate(http_requests_total{namespace=~"dk-data-.*"}[5m]))
            ) > 0.05
          for: 5m
          labels:
            severity: critical
            team: data-platform
          annotations:
            summary: "High API error rate (>5%)"
            description: |
              PostgREST API is returning >5% 5xx errors.
              Current error rate: {{ $value | humanizePercentage }}

        - alert: APIUnavailable
          expr: |
            probe_success{job="dk-data-postgrest"} == 0
          for: 2m
          labels:
            severity: critical
            team: data-platform
          annotations:
            summary: "PostgREST API is unavailable"
            description: "PostgREST /health probe is failing. Service may be down or unreachable."

    - name: dk-data.batch-jobs
      interval: 1m
      rules:
        - alert: BatchJobFailed
          expr: |
            increase(batch_job_failures_total{namespace=~"dk-data-.*"}[1h]) > 2
          for: 0m
          labels:
            severity: warning
            team: data-platform
          annotations:
            summary: "Batch job {{ $labels.job_name }} failed >2 times in 1h"
            description: |
              Batch job {{ $labels.job_name }} has failed multiple times.

        - alert: CronJobMissedSchedule
          expr: |
            (time() - kube_cronjob_next_schedule_time{namespace=~"dk-data-.*"}) > 3600
          for: 10m
          labels:
            severity: warning
            team: data-platform
          annotations:
            summary: "CronJob {{ $labels.cronjob }} missed schedule"
            description: |
              CronJob {{ $labels.cronjob }} has missed its scheduled execution by over 1 hour.

    # Molecule Pipeline Alerts (004-molecule-platform-integration)
    - name: molecule-pipeline
      interval: 5m
      rules:
        - alert: MoleculeFetchFailed
          expr: |
            increase(kube_job_status_failed{namespace=~"dk-data-.*", job_name=~"mol-fetch-.*"}[1h]) > 0
          for: 0m
          labels:
            severity: warning
            team: data-platform
          annotations:
            summary: "Molecule fetch job {{ $labels.job_name }} failed"
            description: |
              Molecule data fetch CronJob {{ $labels.job_name }} failed in the last hour.
              Check job logs for details.

        - alert: MoleculeTransformStale
          expr: |
            (time() - max(kube_job_status_completion_time{namespace=~"dk-data-.*", job_name=~"mol-transform-.*"}) by (namespace)) > 172800
          for: 30m
          labels:
            severity: warning
            team: data-platform
          annotations:
            summary: "No successful molecule transform in 48h"
            description: |
              The molecule transform pipeline has not completed successfully in over 48 hours.
              Bronze → Silver → Gold transformation may be stalled.

        - alert: BronzeToSilverBacklog
          expr: |
            dk_bronze_unprocessed_total{namespace=~"dk-data-.*"} > 10000
          for: 1h
          labels:
            severity: warning
            team: data-platform
          annotations:
            summary: "Large bronze-to-silver backlog (>10k records)"
            description: |
              There are {{ $value }} unprocessed bronze records waiting for silver transformation.
              This may indicate transform job failures or capacity issues.

        - alert: EntityResolutionQueueHigh
          expr: |
            dk_resolution_queue_size{namespace=~"dk-data-.*"} > 1000
          for: 30m
          labels:
            severity: warning
            team: data-platform
          annotations:
            summary: "Entity resolution queue backlog >1000"
            description: |
              The entity resolution queue has {{ $value }} items pending review.
              Manual review may be required for low-confidence matches.

        - alert: MoleculeQuarantineHigh
          expr: |
            dk_quarantine_count{namespace=~"dk-data-.*"} > 500
          for: 1h
          labels:
            severity: warning
            team: data-platform
          annotations:
            summary: "High quarantine count (>500 molecules)"
            description: |
              {{ $value }} molecules are in quarantine status.
              Review and resolve quarantine reasons.

    # CMS Pipeline Alerts (016-cms-puf-datasource-integration)
    - name: cms-pipeline
      interval: 5m
      rules:
        - alert: CMSSourceStale
          expr: |
            (time() - cms_source_last_sync_timestamp) > (30 * 86400)
          for: 1h
          labels:
            severity: warning
            team: data-platform
          annotations:
            summary: "CMS source {{ $labels.source }} is stale (>30 days)"
            description: |
              CMS source {{ $labels.source }} has not been refreshed in over 30 days.
              Most CMS sources update monthly or quarterly.

        - alert: CMSSourceCriticallyStale
          expr: |
            (time() - cms_source_last_sync_timestamp) > (90 * 86400)
          for: 1h
          labels:
            severity: critical
            team: data-platform
          annotations:
            summary: "CMS source {{ $labels.source }} critically stale (>90 days)"
            description: |
              CMS source {{ $labels.source }} has not been refreshed in over 90 days.
              Investigate CronJob failures.

        - alert: CMSFetchSlow
          expr: |
            histogram_quantile(0.95, rate(cms_fetch_duration_seconds_bucket[1h])) > 1800
          for: 0m
          labels:
            severity: warning
            team: data-platform
          annotations:
            summary: "CMS fetch p95 >30 minutes for {{ $labels.source }}"
            description: |
              CMS source {{ $labels.source }} fetch is taking over 30 minutes (p95).

        - alert: CMSAgentFailed
          expr: |
            cms_agent_last_run_status == 0
          for: 30m
          labels:
            severity: warning
            team: data-platform
          annotations:
            summary: "CMS agent {{ $labels.agent_name }} last run failed"
            description: |
              Agent {{ $labels.agent_name }} last execution status is FAILED.
              Check meta.agent_execution_log for details.

        - alert: CMSAgentCostHigh
          expr: |
            sum(cms_agent_cost_usd) > 385
          for: 1h
          labels:
            severity: warning
            team: data-platform
          annotations:
            summary: "CMS agent monthly cost exceeds $385 budget"
            description: |
              Total CMS agent LLM cost is ${{ $value | printf "%.2f" }}, exceeding the $385/month budget.
              Review agent batch sizes and model selection.

        - alert: CMSQuarantineBacklog
          expr: |
            sum(cms_agent_quarantine_pending) > 100
          for: 1h
          labels:
            severity: warning
            team: data-platform
          annotations:
            summary: "CMS agent quarantine backlog >100 records"
            description: |
              {{ $value }} records pending review in agent quarantine.
              Review via GET /api/v1/agents/quarantine.

        - alert: CMSGoldViewStale
          expr: |
            (time() - cms_gold_view_last_refresh_timestamp) > (3 * 86400)
          for: 1h
          labels:
            severity: warning
            team: data-platform
          annotations:
            summary: "CMS gold view {{ $labels.view }} stale (>3 days)"
            description: |
              Gold view {{ $labels.view }} has not been refreshed in over 3 days.
              Trigger refresh via POST /cms/gold/refresh.

        - alert: CMSRateLimitSpike
          expr: |
            increase(cms_rate_limit_rejections_total[1h]) > 20
          for: 0m
          labels:
            severity: warning
            team: data-platform
          annotations:
            summary: "CMS rate limit rejections spike for {{ $labels.source }}"
            description: |
              {{ $value }} rate limit rejections in the last hour for {{ $labels.source }}.
              May indicate API throttling or misconfigured fetch frequency.

    # CI Fetcher Source Alerts (011-datasource-integration)
    - name: ci-fetcher-sources
      interval: 5m
      rules:
        - alert: CIFetcherJobFailed
          expr: |
            increase(kube_job_status_failed{namespace=~"dk-data-.*",
              job_name=~"fetch-(pubmed|europepmc|uniprot|pdb|openalex|sec-edgar|epo|hta|cochrane|orcid|uspto-ci|uspto-patents|uspto-trademarks|journal-rss|news).*"}[1h]) > 0
          for: 0m
          labels:
            severity: warning
            team: data-platform
          annotations:
            summary: "CI fetcher job {{ $labels.job_name }} failed"
            description: |
              CI data fetcher {{ $labels.job_name }} failed in the last hour.
              Check Loki logs: {service_name="{{ $labels.job_name }}"}.

        - alert: CIFetcherSourceStale
          expr: |
            (
              time() - (
                max by (source_name) (
                  label_replace(
                    kube_job_status_completion_time{namespace=~"dk-data-.*",
                      job_name=~"fetch-(pubmed|europepmc|uniprot|pdb|openalex|sec-edgar|epo|hta|cochrane|orcid|uspto-ci|uspto-patents|uspto-trademarks|journal-rss|news).*"},
                    "source_name", "$1", "job_name", "fetch-(.+)-[0-9]+"
                  )
                )
              )
            ) > 172800
          for: 30m
          labels:
            severity: warning
            team: data-platform
          annotations:
            summary: "CI fetcher {{ $labels.source_name }} stale (>48h since last success)"
            description: |
              CI fetcher source {{ $labels.source_name }} has had no successful job completion
              in over 48 hours. Verify CronJob schedule and check for repeated failures.

        - alert: CIFetcherInterrupted
          expr: |
            increase(kube_job_status_failed{namespace=~"dk-data-.*",
              job_name=~"fetch-(pubmed|europepmc|uniprot|pdb|openalex|sec-edgar|epo|hta|cochrane|orcid|uspto-ci|uspto-patents|uspto-trademarks|journal-rss|news).*"}[6h]) > 3
          for: 0m
          labels:
            severity: critical
            team: data-platform
          annotations:
            summary: "CI fetcher {{ $labels.job_name }} failing repeatedly (>3 in 6h)"
            description: |
              {{ $labels.job_name }} has failed {{ $value }} times in the last 6 hours.
              Manifest cursor/offset may be corrupted. Check raw.fetch_state for source state.

        - alert: CIFetcherCronJobMissed
          expr: |
            (time() - kube_cronjob_next_schedule_time{namespace=~"dk-data-.*",
              cronjob=~"fetch-(pubmed|europepmc|uniprot|pdb|openalex|sec-edgar|epo|hta|cochrane|orcid|uspto-ci|uspto-patents|uspto-trademarks|journal-rss|news)"}) > 7200
          for: 15m
          labels:
            severity: warning
            team: data-platform
          annotations:
            summary: "CI fetcher CronJob {{ $labels.cronjob }} missed schedule by >2h"
            description: |
              CronJob {{ $labels.cronjob }} has missed its scheduled run by more than 2 hours.
              Check for cluster resource pressure or ConcurrencyPolicy=Forbid backlog.

    - name: dk-data.resources
      interval: 1m
      rules:
        - alert: PodHighMemory
          expr: |
            (
              container_memory_usage_bytes{namespace=~"dk-data-.*"}
              /
              container_spec_memory_limit_bytes{namespace=~"dk-data-.*"}
            ) > 0.80
          for: 15m
          labels:
            severity: warning
            team: data-platform
          annotations:
            summary: "Pod {{ $labels.pod }} memory usage >80%"
            description: |
              Pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of its memory limit.

        - alert: JobTriggerNotReady
          expr: |
            kube_deployment_status_replicas_ready{namespace=~"dk-data-.*", deployment="job-trigger"} == 0
          for: 5m
          labels:
            severity: critical
            team: data-platform
          annotations:
            summary: "Job Trigger pod not ready for 5m"
            description: "No Job Trigger replicas are ready in namespace {{ $labels.namespace }}."
