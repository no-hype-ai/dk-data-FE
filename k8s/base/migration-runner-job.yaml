apiVersion: batch/v1
kind: Job
metadata:
  name: migration-runner
  labels:
    app.kubernetes.io/name: migration-runner
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: dk-data
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migration-runner
        app.kubernetes.io/part-of: dk-data
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migration-runner
          image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:latest
          env:
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_PORT
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_DB
              value: "dk_data"
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              echo "=== Migration Runner (sync-wave 2) ==="
              echo "Host: $POSTGRES_HOST:$POSTGRES_PORT"

              # Step 1: Run pending SQL migrations
              echo "Running database migrations..."
              python -m dk_data.scripts.run_migrations
              echo "Migrations complete."

              # Step 2: Seed/update data source catalog
              echo "Seeding data source catalog..."
              python -c "
              import importlib.resources, os, psycopg2
              sql = importlib.resources.files('dk_data.sql').joinpath('seed_data_sources.sql').read_text()
              conn = psycopg2.connect(
                  host=os.environ['POSTGRES_HOST'],
                  port=os.environ['POSTGRES_PORT'],
                  user=os.environ.get('POSTGRES_USER', 'postgres'),
                  password=os.environ['POSTGRES_PASSWORD'],
                  dbname=os.environ.get('POSTGRES_DB', 'dk_data'),
              )
              conn.autocommit = True
              conn.cursor().execute(sql)
              conn.close()
              print('Seed data applied.')
              "

              echo "=== Migration Runner complete ==="
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
