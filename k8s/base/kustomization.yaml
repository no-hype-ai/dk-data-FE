apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: dk-data
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - ../apps/job-trigger/base
  - ../apps/postgrest/base
  - ../apps/metering-proxy/base
  - ../apps/cronjobs/base
  - ../apps/infrastructure/base
  # Horizon 3 / plan §D.1 — hydrate RBAC only (SA + Role + RoleBinding).
  # The hydrate JOBS are excluded from ArgoCD sync because ArgoCD treats
  # never-run Jobs as "Progressing" and blocks the entire sync. Jobs are
  # triggered manually: `dk data hydrate run` or `kubectl apply -f
  # k8s/apps/hydrate/base/job-hydrate-dispatch.yaml`.
  - ../apps/hydrate/rbac

patches:
  # Add metering proxy sidecar to PostgREST deployment
  - path: metering-proxy-patch.yaml
    target:
      kind: Deployment
      name: postgrest
