apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: dk-data
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - ../apps/job-trigger/base
  - ../apps/postgrest/base
  - ../apps/metering-proxy/base
  - ../apps/cronjobs/base
  - ../apps/infrastructure/base

patches:
  # Add metering proxy sidecar to PostgREST deployment
  - path: metering-proxy-patch.yaml
    target:
      kind: Deployment
      name: postgrest
