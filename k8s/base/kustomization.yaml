apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: dk-data
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  # PostgREST API
  - postgrest/deployment.yaml
  - postgrest/service.yaml
  - postgrest/configmap.yaml
  # Ingestion services
  - ingestion/job-trigger-deployment.yaml
  - ingestion/job-trigger-service.yaml
  - ingestion/cronjob-cms-all.yaml
  - ingestion/cronjob-refresh.yaml
  # Molecule platform ingestion (004-molecule-platform-integration)
  - ingestion/cronjob-mol-fetch-daily.yaml
  - ingestion/cronjob-mol-fetch-weekly.yaml
  - ingestion/cronjob-mol-fetch-monthly.yaml
  # SQLMesh scheduler daemon — reads cron from model definitions, runs bronze/silver/gold
  # Replaces cronjob-mol-transform.yaml (Python transforms deprecated in 003-molecule-assessment-dashboard)
  - ingestion/sqlmesh-scheduler-deployment.yaml
  # CI source ingestion (011-datasource-integration)
  - ingestion/cronjob-fetch-pubmed.yaml
  - ingestion/cronjob-fetch-ema-reg.yaml
  - ingestion/cronjob-fetch-openalex-ci.yaml
  - ingestion/cronjob-fetch-drugbank.yaml
  - ingestion/cronjob-fetch-uspto-patents.yaml
  - ingestion/cronjob-fetch-journal-rss.yaml
  - ingestion/cronjob-fetch-uspto-ci.yaml
  - ingestion/cronjob-fetch-hta.yaml
  - ingestion/cronjob-fetch-epo.yaml
  - ingestion/cronjob-fetch-cochrane.yaml
  - ingestion/cronjob-fetch-news.yaml
  - ingestion/cronjob-fetch-sec-edgar.yaml
  # Molecule data sources (012-platform-hardening)
  - ingestion/cronjob-fetch-uniprot.yaml
  - ingestion/cronjob-fetch-pdb.yaml
  # - ingestion/cronjob-fetch-orcid.yaml  # Disabled — no ORCID membership; OpenAlex covers author data
  # Trademark data sources (014-uspto-euipo-model-datasource)
  - ingestion/cronjob-fetch-uspto-trademarks.yaml
  - ingestion/cronjob-fetch-euipo.yaml
  - ingestion/cronjob-fetch-euipo-designs.yaml
  - ingestion/molecule-pipeline-config.yaml
  # CMS PUF data sources (016-cms-puf-datasource-integration)
  # Phase 2: Provider sources
  - ingestion/cronjob-fetch-cms-nppes.yaml
  - ingestion/cronjob-fetch-cms-part-d-prescriber.yaml
  - ingestion/cronjob-fetch-cms-physician-puf.yaml
  - ingestion/cronjob-fetch-cms-open-payments.yaml
  - ingestion/cronjob-fetch-cms-care-compare.yaml
  # Phase 3: Facility sources
  - ingestion/cronjob-fetch-cms-pos.yaml
  - ingestion/cronjob-fetch-cms-pecos.yaml
  - ingestion/cronjob-fetch-cms-chow.yaml
  - ingestion/cronjob-fetch-cms-hospital-affiliation.yaml
  - ingestion/cronjob-fetch-cms-inpatient-puf.yaml
  - ingestion/cronjob-fetch-cms-outpatient-puf.yaml
  - ingestion/cronjob-fetch-cms-hospital-quality.yaml
  - ingestion/cronjob-fetch-cms-hospital-general-info.yaml
  - ingestion/cronjob-fetch-cms-hcris.yaml
  - ingestion/cronjob-fetch-cms-magnet.yaml
  # Phase 4: Drug/Market sources
  - ingestion/cronjob-fetch-cms-ndc.yaml
  - ingestion/cronjob-fetch-cms-part-d-spending.yaml
  - ingestion/cronjob-fetch-cms-part-b-spending.yaml
  - ingestion/cronjob-fetch-cms-formulary.yaml
  - ingestion/cronjob-fetch-cms-rbcs.yaml
  - ingestion/cronjob-fetch-cms-usp.yaml
  - ingestion/cronjob-fetch-cms-nucc.yaml
  - ingestion/cronjob-fetch-cms-geographic-variation.yaml
  - ingestion/cronjob-fetch-cms-chronic-conditions.yaml
  - ingestion/cronjob-fetch-cms-post-acute.yaml
  - ingestion/cronjob-fetch-cms-dmepos.yaml
  - ingestion/cronjob-fetch-cms-ddinter.yaml
  - ingestion/cronjob-fetch-cms-stabilis.yaml
  # CMS orchestration jobs
  - ingestion/cronjob-agents-monthly.yaml
  - ingestion/cronjob-cms-gold-refresh.yaml
  - ingestion/job-agent-template.yaml
  # Backup
  - backup/pg-backup-configmap.yaml
  - backup/minio-credentials.yaml
  - backup/pg-backup-daily.yaml
  - backup/pg-backup-weekly.yaml
  - backup/pg-backup-verify.yaml
  # Database initialization and seeding
  - db-init-job.yaml
  # SQL migration runner (wave 2: runs after db-init) — applies pending migrations from sql/migrations/
  - db-migration-job.yaml
  # DrugBank seed (wave 2): unzips bundled XML and loads into bronze.drugbank_*
  - job-drugbank-seed.yaml
  # USP MMG v9.0 seed (wave 2): loads alignment file into raw.cms_usp
  - job-usp-seed.yaml
  # Networking
  - ingress.yaml
  - middleware-rate-limit.yaml
  - networkpolicy.yaml
  # Secrets
  - doppler-secret.yaml
  - ghcr-secret.yaml
  # Observability (requires Prometheus Operator CRDs)
  - service-monitor.yaml
  - alert-rules.yaml
  # Grafana dashboards (auto-provisioned via sidecar)
  - grafana-cms-dashboard.yaml
  - grafana-ingestion-health-dashboard.yaml
