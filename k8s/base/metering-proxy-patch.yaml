# Strategic merge patch to add the metering proxy sidecar
# to the PostgREST Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
spec:
  template:
    metadata:
      labels:
        app: postgrest
    spec:
      volumes:
        - name: consumers-config
          configMap:
            name: dk-data-consumers
      containers:
        - name: metering-proxy
          image: ghcr.io/data-kinetic/dk-data-fe:latest
          command:
            - uvicorn
            - dk_data.metering_proxy.app:app
            - --host
            - "0.0.0.0"
            - --port
            - "3001"
            - --log-level
            - info
          ports:
            - containerPort: 3001
              name: proxy
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          env:
            - name: POSTGREST_URL
              value: "http://localhost:3000"
            - name: CONSUMERS_CONFIG_PATH
              value: "/etc/dk-data/consumers.yaml"
            - name: LOG_LEVEL
              value: "INFO"
            - name: LOG_FORMAT
              value: "json"
          volumeMounts:
            - name: consumers-config
              mountPath: /etc/dk-data
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: 3001
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
