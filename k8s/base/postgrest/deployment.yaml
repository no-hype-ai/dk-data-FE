apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
  labels:
    app: postgrest
    app.kubernetes.io/name: postgrest
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: dk-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgrest
  template:
    metadata:
      labels:
        app: postgrest
        app.kubernetes.io/name: postgrest
        app.kubernetes.io/part-of: dk-data
    spec:
      initContainers:
        # T009: Validate JWT secret meets minimum security requirements
        - name: jwt-secret-validator
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Validating JWT secret..."
              SECRET_LENGTH=$(echo -n "$JWT_SECRET" | wc -c)
              if [ "$SECRET_LENGTH" -lt 32 ]; then
                echo "ERROR: JWT_SECRET must be at least 32 characters (256 bits) for HS256"
                echo "Current length: $SECRET_LENGTH characters"
                exit 1
              fi
              echo "JWT secret validation passed ($SECRET_LENGTH characters)"
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: JWT_SECRET
      containers:
        - name: postgrest
          image: postgrest/postgrest:v12.2.3
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: postgrest-config
          env:
            # Database connection - must be defined before PGRST_DB_URI for $(VAR) expansion
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_DB
            # PostgREST configuration - uses variables defined above
            - name: PGRST_DB_URI
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - name: PGRST_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: JWT_SECRET
            - name: PGRST_JWT_ROLE_CLAIM_KEY
              value: ".role"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # T038: Health probes - TCP for startup reliability, HTTP for application health
          # NOTE: HTTP probes require api.health view to exist (created by db-init job)
          #       and web_anon role to have USAGE on schema api + SELECT on api.health
          startupProbe:
            tcpSocket:
              port: 3000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
