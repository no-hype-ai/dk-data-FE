# Horizon 3 / plan §D.1 — ServiceAccount for the in-cluster hydrate dispatcher.
#
# Minted with no image-pull secrets mounted automatically; the dispatcher Job
# references its own `imagePullSecrets: ghcr-credentials` explicitly. Drift-
# protection policy treats every SA as ArgoCD-managed only — never
# `kubectl create sa hydrate-dispatcher`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hydrate-dispatcher
  namespace: dk-data-prod
  labels:
    app: prestaged-hydrate
    app.kubernetes.io/name: hydrate-dispatcher
    app.kubernetes.io/component: dispatcher
    app.kubernetes.io/part-of: dk-data
    feature: 005-prestaged-hydration
    horizon: "3"
    product: dk-data
    service: dk-data
    team: data-platform
automountServiceAccountToken: true
