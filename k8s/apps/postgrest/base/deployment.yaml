apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
  labels:
    app: postgrest
    app.kubernetes.io/name: postgrest
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: dk-data
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: postgrest
  template:
    metadata:
      labels:
        app: postgrest
        app.kubernetes.io/name: postgrest
        app.kubernetes.io/part-of: dk-data
        team: data-platform
        service: dk-data
        product: dk-data
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: postgrest
                topologyKey: kubernetes.io/hostname
      initContainers:
        # T009: Validate JWT secret meets minimum security requirements
        - name: jwt-secret-validator
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Validating JWT secret..."
              SECRET_LENGTH=$(echo -n "$JWT_SECRET" | wc -c)
              if [ "$SECRET_LENGTH" -lt 32 ]; then
                echo "ERROR: JWT_SECRET must be at least 32 characters (256 bits) for HS256"
                echo "Current length: $SECRET_LENGTH characters"
                exit 1
              fi
              echo "JWT secret validation passed ($SECRET_LENGTH characters)"
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: JWT_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: postgrest
          image: postgrest/postgrest:v12.2.3
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: postgrest-config
          env:
            # Database connection for PostgREST — connects as authenticator role (not superuser)
            # so that JWT role-switching (web_anon, analyst, api_user) works correctly.
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_PORT
            - name: POSTGREST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGREST_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_DB
            # PostgREST must connect as authenticator (LOGIN, NOINHERIT) which then
            # switches to the JWT-specified role per request.
            - name: PGRST_DB_URI
              value: "postgres://authenticator:$(POSTGREST_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - name: PGRST_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: JWT_SECRET
            - name: PGRST_JWT_ROLE_CLAIM_KEY
              value: ".role"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Health probes are TCP-only (not HTTP). The previous comment
          # claiming HTTP probes required `api.health` + `web_anon` was
          # stale — all three probes below use tcpSocket, not httpGet, so
          # there is no dependency on a database view or anonymous role.
          # Feature 002-external-integration-foundation T085 removed the
          # stale comment; US-2 dropped the web_anon role in migration 218.
          startupProbe:
            tcpSocket:
              port: 3000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
