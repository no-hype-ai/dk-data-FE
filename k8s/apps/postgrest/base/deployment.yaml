apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
  labels:
    app: postgrest
    app.kubernetes.io/name: postgrest
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: dk-data
spec:
  # Feature 002 perf pass: minimum 2 replicas so the PDB
  # (minAvailable: 1) can actually allow node drains. With only 1
  # replica, the PDB blocks every drain forever. Production overlay
  # may bump this further (target = 3 in capacity-signoff.md).
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # +1 surge during rollout so we can update without dropping
      # below the PDB minimum. With replicas=2, that means 3 pods
      # exist briefly during a rolling update.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: postgrest
  template:
    metadata:
      labels:
        app: postgrest
        app.kubernetes.io/name: postgrest
        app.kubernetes.io/part-of: dk-data
        team: data-platform
        service: dk-data
        product: dk-data
    spec:
      # PostgREST holds open DB connections; on shutdown it must be
      # given time to close them cleanly so PgBouncer doesn't see
      # abrupt disconnects (which trigger reset cycles). 60s is
      # well above the 10s statement timeout, so any in-flight
      # query has time to finish or be killed by the timeout.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: postgrest
                topologyKey: kubernetes.io/hostname
      initContainers:
        # T009: Validate JWT secret meets minimum security requirements
        - name: jwt-secret-validator
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Validating JWT secret..."
              SECRET_LENGTH=$(echo -n "$JWT_SECRET" | wc -c)
              if [ "$SECRET_LENGTH" -lt 32 ]; then
                echo "ERROR: JWT_SECRET must be at least 32 characters (256 bits) for HS256"
                echo "Current length: $SECRET_LENGTH characters"
                exit 1
              fi
              echo "JWT secret validation passed ($SECRET_LENGTH characters)"
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: JWT_SECRET
          # Minimal budget — the validator shells out to `wc -c` once and
          # exits. Added to satisfy dk-alchemy Kyverno `require-resource-limits`
          # `check-init-container-limits` rule (Wave 4).
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "50m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: postgrest
          image: postgrest/postgrest:v12.2.3
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: postgrest-config
          env:
            # Database connection for PostgREST — connects as authenticator role (not superuser)
            # so that JWT role-switching (web_anon, analyst, api_user) works correctly.
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_PORT
            - name: POSTGREST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGREST_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_DB
            # PostgREST must connect as authenticator (LOGIN, NOINHERIT) which then
            # switches to the JWT-specified role per request.
            - name: PGRST_DB_URI
              value: "postgres://authenticator:$(POSTGREST_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - name: PGRST_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: JWT_SECRET
            - name: PGRST_JWT_ROLE_CLAIM_KEY
              value: ".role"
          # Guaranteed QoS: requests == limits. Critical so kubelet
          # picks Burstable pods (NOT this one) first under memory
          # pressure. PostgREST is on the read hot path; OOM-killing
          # it would take down every dk-data consumer.
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Health probes are TCP-only (not HTTP). The previous comment
          # claiming HTTP probes required `api.health` + `web_anon` was
          # stale — all three probes below use tcpSocket, not httpGet, so
          # there is no dependency on a database view or anonymous role.
          # Feature 002-external-integration-foundation T085 removed the
          # stale comment; US-2 dropped the web_anon role in migration 218.
          startupProbe:
            tcpSocket:
              port: 3000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
