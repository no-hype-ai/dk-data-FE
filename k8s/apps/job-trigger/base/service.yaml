apiVersion: v1
kind: Service
metadata:
  name: job-trigger
  labels:
    app: job-trigger
    app.kubernetes.io/name: job-trigger
    app.kubernetes.io/component: ingestion
    app.kubernetes.io/part-of: dk-data
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: job-trigger
