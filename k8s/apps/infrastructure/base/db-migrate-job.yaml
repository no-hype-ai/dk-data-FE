apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  labels:
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: dk-data
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 3
  # Bumped from 1800s (30min) to 3600s (1h) to accommodate
  # migration 225 — CREATE INDEX CONCURRENTLY × 7 GIN indexes on
  # multi-million-row tables can take ~5 min each. Total ~35 min,
  # well over the previous deadline.
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
        app.kubernetes.io/part-of: dk-data
        team: data-platform
        service: dk-data
        product: dk-data
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: db-migrate
          image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:latest
          command:
            - /bin/sh
            - -c
            - |
              # Wait for DB connectivity (cross-namespace DNS may lag on pod start)
              for i in 1 2 3 4 5; do
                python -c "import psycopg2,os; psycopg2.connect(host=os.environ.get('POSTGRES_HOST_DIRECT',os.environ['POSTGRES_HOST']),port=os.environ.get('POSTGRES_PORT','5432'),user=os.environ['POSTGRES_USER'],password=os.environ['POSTGRES_PASSWORD'],database=os.environ['POSTGRES_DB']).close()" 2>/dev/null && break
                echo "Waiting for DB (attempt $i/5)..."
                sleep 3
              done
              python -m dk_data.scripts.run_migrations
          env:
            # IMPORTANT: migrations bypass PgBouncer.
            # PgBouncer transaction mode wraps each statement in an
            # implicit transaction, which breaks `CREATE INDEX
            # CONCURRENTLY` (migration 225) and any other
            # non-transactional operation. POSTGRES_HOST_DIRECT
            # points at the CNPG primary directly. Same convention
            # as cronjob-build-model-lineage.yaml + SQLMesh.
            - name: POSTGRES_HOST_DIRECT
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT_DIRECT
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_PORT
                  optional: true
            # Fallback values — the runner prefers _DIRECT but
            # uses POSTGRES_HOST if _DIRECT is unset (with a
            # WARN to stderr).
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_DB
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
