apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  labels:
    app.kubernetes.io/name: db-init
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: dk-data
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-init
        app.kubernetes.io/part-of: dk-data
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: ghcr.io/cloudnative-pg/postgresql:16.4
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_HOST
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_PORT
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_PASSWORD
            - name: PGUSER
              value: "postgres"
            - name: POSTGREST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGREST_PASSWORD
          # PreSync hook that runs psql DDL once against an already-provisioned
          # Postgres — memory usage stays flat. Sized to match the other
          # infrastructure PreSync Jobs (db-migrate). Added to satisfy
          # dk-alchemy Kyverno `require-resource-limits` (Wave 4).
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              echo "=== dk-data database initialization ==="
              echo "Host: $PGHOST:$PGPORT"

              # --- Step 1: Create database (connect to default 'postgres' db) ---
              echo "Creating database dk_data if not exists..."
              psql -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'dk_data'" | grep -q 1 || \
                psql -d postgres -c "CREATE DATABASE dk_data"

              # --- Step 2: Create extensions ---
              echo "Creating extensions..."
              psql -d dk_data <<'SQL'
              CREATE EXTENSION IF NOT EXISTS pg_trgm;  -- Fuzzy text matching for molecule search
              CREATE EXTENSION IF NOT EXISTS "uuid-ossp";  -- UUID generation
              SQL

              # --- Step 3: Create schemas ---
              echo "Creating schemas..."
              psql -d dk_data <<'SQL'
              -- TAVR schemas
              CREATE SCHEMA IF NOT EXISTS raw;
              CREATE SCHEMA IF NOT EXISTS staging;
              CREATE SCHEMA IF NOT EXISTS mart;
              CREATE SCHEMA IF NOT EXISTS scoring;
              CREATE SCHEMA IF NOT EXISTS meta;
              CREATE SCHEMA IF NOT EXISTS api;
              -- Molecule platform schemas (004-molecule-platform-integration)
              CREATE SCHEMA IF NOT EXISTS mol_raw;
              CREATE SCHEMA IF NOT EXISTS mol_bronze;
              CREATE SCHEMA IF NOT EXISTS mol_silver;
              CREATE SCHEMA IF NOT EXISTS mol_gold;
              CREATE SCHEMA IF NOT EXISTS mol_app;
              CREATE SCHEMA IF NOT EXISTS mol_api;
              -- HCS (healthcare/CMS) domain schemas (019-cms-puf-platform-reconciliation)
              CREATE SCHEMA IF NOT EXISTS hcs_raw;
              CREATE SCHEMA IF NOT EXISTS hcs_bronze;
              CREATE SCHEMA IF NOT EXISTS hcs_silver;
              CREATE SCHEMA IF NOT EXISTS hcs_gold;
              -- Indication domain schemas
              CREATE SCHEMA IF NOT EXISTS ind_silver;
              CREATE SCHEMA IF NOT EXISTS ind_gold;
              -- HCP (KOL/researcher) domain schemas
              CREATE SCHEMA IF NOT EXISTS hcp_silver;
              CREATE SCHEMA IF NOT EXISTS hcp_gold;
              -- Application schema
              CREATE SCHEMA IF NOT EXISTS application;
              -- IP/patent/trademark SQLMesh schemas (014-uspto-euipo-model-datasource)
              CREATE SCHEMA IF NOT EXISTS bronze;
              CREATE SCHEMA IF NOT EXISTS silver;
              CREATE SCHEMA IF NOT EXISTS gold;
              -- Xenon application schema (015-assessment-dashboard-integration)
              CREATE SCHEMA IF NOT EXISTS xenon;
              SQL

              # --- Step 4: Create roles ---
              echo "Creating roles..."
              psql -d dk_data <<'SQL'
              DO $role$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticator') THEN
                  CREATE ROLE authenticator LOGIN NOINHERIT;
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'web_anon') THEN
                  CREATE ROLE web_anon NOLOGIN;
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'analyst') THEN
                  CREATE ROLE analyst NOLOGIN;
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'api_user') THEN
                  CREATE ROLE api_user NOLOGIN;
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'readonly') THEN
                  CREATE ROLE readonly LOGIN;
                END IF;
              END $role$;
              SQL

              # --- Step 5: Set authenticator password ---
              echo "Setting authenticator password..."
              if [ -n "$POSTGREST_PASSWORD" ]; then
                psql -d dk_data -c "ALTER ROLE authenticator PASSWORD '$POSTGREST_PASSWORD'"
                echo "✓ authenticator password set from POSTGREST_PASSWORD secret"
              else
                echo "✗ WARNING: POSTGREST_PASSWORD not set — authenticator role will have no password"
                echo "  PostgREST will fail to connect. Add POSTGREST_PASSWORD to Doppler dk-data-applications project."
              fi

              # --- Step 6: Grant role hierarchy ---
              echo "Granting role hierarchy..."
              psql -d dk_data <<'SQL'
              GRANT web_anon TO authenticator;
              GRANT analyst TO authenticator;
              GRANT api_user TO authenticator;
              SQL

              # --- Step 7: Grant schema usage and table permissions ---
              echo "Granting permissions..."
              psql -d dk_data <<'SQL'
              -- web_anon: minimal access
              REVOKE ALL PRIVILEGES ON ALL TABLES IN SCHEMA api FROM web_anon;
              GRANT USAGE ON SCHEMA api TO web_anon;
              DO $perm$
              BEGIN
                IF EXISTS (SELECT 1 FROM information_schema.tables
                           WHERE table_schema = 'api' AND table_name = 'data_catalog') THEN
                  EXECUTE 'GRANT SELECT ON api.data_catalog TO web_anon';
                END IF;
                IF EXISTS (SELECT 1 FROM information_schema.tables
                           WHERE table_schema = 'api' AND table_name = 'health') THEN
                  EXECUTE 'GRANT SELECT ON api.health TO web_anon';
                END IF;
              END $perm$;

              -- analyst: read targets, scoring, data_sources, data_catalog
              GRANT USAGE ON SCHEMA api TO analyst;
              DO $perm$
              BEGIN
                IF EXISTS (SELECT 1 FROM information_schema.tables
                           WHERE table_schema = 'api' AND table_name = 'targets') THEN
                  EXECUTE 'GRANT SELECT ON api.targets TO analyst';
                END IF;
                IF EXISTS (SELECT 1 FROM information_schema.tables
                           WHERE table_schema = 'api' AND table_name = 'scoring') THEN
                  EXECUTE 'GRANT SELECT ON api.scoring TO analyst';
                END IF;
                IF EXISTS (SELECT 1 FROM information_schema.tables
                           WHERE table_schema = 'api' AND table_name = 'data_sources') THEN
                  EXECUTE 'GRANT SELECT ON api.data_sources TO analyst';
                END IF;
                IF EXISTS (SELECT 1 FROM information_schema.tables
                           WHERE table_schema = 'api' AND table_name = 'data_catalog') THEN
                  EXECUTE 'GRANT SELECT ON api.data_catalog TO analyst';
                END IF;
              END $perm$;

              -- api_user: full read access to api schema
              GRANT USAGE ON SCHEMA api TO api_user;
              GRANT SELECT ON ALL TABLES IN SCHEMA api TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA api GRANT SELECT ON TABLES TO api_user;

              -- readonly: read access to api and mart schemas
              GRANT USAGE ON SCHEMA api TO readonly;
              GRANT USAGE ON SCHEMA mart TO readonly;
              GRANT SELECT ON ALL TABLES IN SCHEMA api TO readonly;
              GRANT SELECT ON ALL TABLES IN SCHEMA mart TO readonly;
              ALTER DEFAULT PRIVILEGES IN SCHEMA api GRANT SELECT ON TABLES TO readonly;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mart GRANT SELECT ON TABLES TO readonly;
              SQL

              # --- Step 8: Grant molecule schema permissions ---
              echo "Granting molecule schema permissions..."
              psql -d dk_data <<'SQL'
              -- mol_api: read access for analyst, api_user only (no web_anon)
              GRANT USAGE ON SCHEMA mol_api TO analyst;
              GRANT USAGE ON SCHEMA mol_api TO api_user;
              GRANT SELECT ON ALL TABLES IN SCHEMA mol_api TO analyst;
              GRANT SELECT ON ALL TABLES IN SCHEMA mol_api TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_api GRANT SELECT ON TABLES TO analyst;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_api GRANT SELECT ON TABLES TO api_user;

              -- mol_raw, mol_bronze, mol_silver, mol_gold, mol_app: full access for api_user (ingestion)
              GRANT USAGE ON SCHEMA mol_raw TO api_user;
              GRANT USAGE ON SCHEMA mol_bronze TO api_user;
              GRANT USAGE ON SCHEMA mol_silver TO api_user;
              GRANT USAGE ON SCHEMA mol_gold TO api_user;
              GRANT USAGE ON SCHEMA mol_app TO api_user;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA mol_raw TO api_user;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA mol_bronze TO api_user;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA mol_silver TO api_user;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA mol_gold TO api_user;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA mol_app TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_raw GRANT ALL ON TABLES TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_bronze GRANT ALL ON TABLES TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_silver GRANT ALL ON TABLES TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_gold GRANT ALL ON TABLES TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_app GRANT ALL ON TABLES TO api_user;

              -- Sequence permissions for api_user (needed for inserts)
              GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA mol_raw TO api_user;
              GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA mol_bronze TO api_user;
              GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA mol_silver TO api_user;
              GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA mol_gold TO api_user;
              GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA mol_app TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_raw GRANT USAGE, SELECT ON SEQUENCES TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_bronze GRANT USAGE, SELECT ON SEQUENCES TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_silver GRANT USAGE, SELECT ON SEQUENCES TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_gold GRANT USAGE, SELECT ON SEQUENCES TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_app GRANT USAGE, SELECT ON SEQUENCES TO api_user;

              -- 015-assessment-dashboard-integration: analyst access to new schemas
              -- Constraint 7: Use existing analyst role (already granted to authenticator)
              GRANT USAGE ON SCHEMA mol_gold TO analyst;
              GRANT USAGE ON SCHEMA mol_silver TO analyst;
              GRANT USAGE ON SCHEMA xenon TO analyst;
              GRANT USAGE ON SCHEMA meta TO analyst;

              GRANT SELECT ON ALL TABLES IN SCHEMA mol_gold TO analyst;
              GRANT SELECT ON ALL TABLES IN SCHEMA mol_silver TO analyst;
              GRANT SELECT ON ALL TABLES IN SCHEMA meta TO analyst;
              GRANT SELECT, INSERT, UPDATE ON ALL TABLES IN SCHEMA xenon TO analyst;

              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_gold GRANT SELECT ON TABLES TO analyst;
              ALTER DEFAULT PRIVILEGES IN SCHEMA mol_silver GRANT SELECT ON TABLES TO analyst;
              ALTER DEFAULT PRIVILEGES IN SCHEMA xenon GRANT SELECT, INSERT, UPDATE ON TABLES TO analyst;
              ALTER DEFAULT PRIVILEGES IN SCHEMA meta GRANT SELECT ON TABLES TO analyst;

              -- 019-cms-puf-platform-reconciliation: HCS/domain schema permissions
              -- api_user (ingestion service): full access to all domain raw/bronze/silver/gold
              GRANT USAGE ON SCHEMA hcs_raw TO api_user;
              GRANT USAGE ON SCHEMA hcs_bronze TO api_user;
              GRANT USAGE ON SCHEMA hcs_silver TO api_user;
              GRANT USAGE ON SCHEMA hcs_gold TO api_user;
              GRANT USAGE ON SCHEMA ind_silver TO api_user;
              GRANT USAGE ON SCHEMA ind_gold TO api_user;
              GRANT USAGE ON SCHEMA hcp_silver TO api_user;
              GRANT USAGE ON SCHEMA hcp_gold TO api_user;
              GRANT USAGE ON SCHEMA application TO api_user;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA hcs_raw TO api_user;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA hcs_bronze TO api_user;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA hcs_silver TO api_user;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA hcs_gold TO api_user;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA ind_silver TO api_user;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA ind_gold TO api_user;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA hcp_silver TO api_user;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA hcp_gold TO api_user;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA application TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA hcs_raw GRANT ALL ON TABLES TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA hcs_bronze GRANT ALL ON TABLES TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA hcs_silver GRANT ALL ON TABLES TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA hcs_gold GRANT ALL ON TABLES TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA ind_silver GRANT ALL ON TABLES TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA ind_gold GRANT ALL ON TABLES TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA hcp_silver GRANT ALL ON TABLES TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA hcp_gold GRANT ALL ON TABLES TO api_user;
              ALTER DEFAULT PRIVILEGES IN SCHEMA application GRANT ALL ON TABLES TO api_user;

              -- analyst: read access to silver/gold domain schemas
              GRANT USAGE ON SCHEMA hcs_silver TO analyst;
              GRANT USAGE ON SCHEMA hcs_gold TO analyst;
              GRANT USAGE ON SCHEMA ind_silver TO analyst;
              GRANT USAGE ON SCHEMA ind_gold TO analyst;
              GRANT USAGE ON SCHEMA hcp_silver TO analyst;
              GRANT USAGE ON SCHEMA hcp_gold TO analyst;
              GRANT SELECT ON ALL TABLES IN SCHEMA hcs_silver TO analyst;
              GRANT SELECT ON ALL TABLES IN SCHEMA hcs_gold TO analyst;
              GRANT SELECT ON ALL TABLES IN SCHEMA ind_silver TO analyst;
              GRANT SELECT ON ALL TABLES IN SCHEMA ind_gold TO analyst;
              GRANT SELECT ON ALL TABLES IN SCHEMA hcp_silver TO analyst;
              GRANT SELECT ON ALL TABLES IN SCHEMA hcp_gold TO analyst;
              ALTER DEFAULT PRIVILEGES IN SCHEMA hcs_silver GRANT SELECT ON TABLES TO analyst;
              ALTER DEFAULT PRIVILEGES IN SCHEMA hcs_gold GRANT SELECT ON TABLES TO analyst;
              ALTER DEFAULT PRIVILEGES IN SCHEMA ind_silver GRANT SELECT ON TABLES TO analyst;
              ALTER DEFAULT PRIVILEGES IN SCHEMA ind_gold GRANT SELECT ON TABLES TO analyst;
              ALTER DEFAULT PRIVILEGES IN SCHEMA hcp_silver GRANT SELECT ON TABLES TO analyst;
              ALTER DEFAULT PRIVILEGES IN SCHEMA hcp_gold GRANT SELECT ON TABLES TO analyst;
              SQL

              # --- Step 9: Create API views ---
              echo "Creating API views..."
              psql -d dk_data <<'SQL'
              -- api.health: Health check endpoint for Kubernetes probes
              CREATE OR REPLACE VIEW api.health AS
              SELECT
                'ok'::text AS status,
                now() AS timestamp,
                current_database() AS database;

              -- api.data_catalog: Metadata about available data sources
              CREATE OR REPLACE VIEW api.data_catalog AS
              SELECT
                schemaname,
                relname AS tablename,
                n_live_tup AS row_count,
                last_vacuum,
                last_analyze
              FROM pg_stat_user_tables
              WHERE schemaname IN ('raw', 'staging', 'mart', 'mol_raw', 'mol_bronze', 'mol_silver', 'mol_gold')
              ORDER BY schemaname, relname;

              -- api.targets: Hospital targeting data (placeholder)
              CREATE OR REPLACE VIEW api.targets AS
              SELECT
                'placeholder'::text AS hospital_id,
                'No data loaded'::text AS name,
                'N/A'::text AS tier,
                0::numeric AS score,
                now() AS updated_at
              WHERE false;

              -- api.scoring: Scoring breakdown details (placeholder)
              CREATE OR REPLACE VIEW api.scoring AS
              SELECT
                'placeholder'::text AS hospital_id,
                'No data loaded'::text AS factor,
                0::numeric AS weight,
                0::numeric AS score
              WHERE false;

              -- api.data_sources: Data source configuration (enhanced for Compass)
              CREATE OR REPLACE VIEW api.data_sources AS
              SELECT
                '00000000-0000-0000-0000-000000000000'::uuid AS id,
                'placeholder'::text AS name,
                'none'::text AS source_type,
                now() AS last_fetch_at,
                'pending'::text AS status,
                0::bigint AS record_count,
                NULL::text AS error_message
              WHERE false;

              -- api.molecules: Molecule discovery data for Compass search (placeholder)
              -- Source: mol_gold.molecules when available
              CREATE OR REPLACE VIEW api.molecules AS
              SELECT
                '00000000-0000-0000-0000-000000000000'::uuid AS id,
                'placeholder'::text AS smiles,
                'placeholder'::text AS inchi_key,
                'No molecules loaded'::text AS name,
                0::numeric AS molecular_weight,
                now() AS created_at,
                now() AS updated_at
              WHERE false;

              -- api.resolution_queue: Pending molecule resolution items for Compass workflow (placeholder)
              -- Source: mol_app.resolution_queue when available
              CREATE OR REPLACE VIEW api.resolution_queue AS
              SELECT
                '00000000-0000-0000-0000-000000000000'::uuid AS id,
                'placeholder'::text AS source_id,
                'placeholder'::text AS target_smiles,
                'pending'::text AS status,
                0::integer AS priority,
                now() AS created_at,
                NULL::timestamptz AS resolved_at
              WHERE false;

              -- ================================================================
              -- Table-backed API views (conditional — only created if backing tables exist)
              -- ================================================================
              DO $views$
              BEGIN
                -- mol_gold views
                IF EXISTS (SELECT 1 FROM information_schema.tables
                           WHERE table_schema = 'mol_gold' AND table_name = 'competitive_landscape') THEN
                  EXECUTE 'CREATE OR REPLACE VIEW api.competitive_landscape AS
                    SELECT indication, approved_count, phase3_count
                    FROM mol_gold.competitive_landscape';
                ELSE
                  EXECUTE 'CREATE OR REPLACE VIEW api.competitive_landscape AS
                    SELECT NULL::text AS indication, 0::integer AS approved_count, 0::integer AS phase3_count WHERE false';
                END IF;

                IF EXISTS (SELECT 1 FROM information_schema.tables
                           WHERE table_schema = 'mol_gold' AND table_name = 'molecule_profiles') THEN
                  EXECUTE 'CREATE OR REPLACE VIEW api.molecule_properties AS
                    SELECT molecule_id, lifecycle_stage, data_completeness, trial_count, ae_count
                    FROM mol_gold.molecule_profiles';
                ELSE
                  EXECUTE 'CREATE OR REPLACE VIEW api.molecule_properties AS
                    SELECT NULL::uuid AS molecule_id, NULL::text AS lifecycle_stage, 0::numeric AS data_completeness, 0::integer AS trial_count, 0::integer AS ae_count WHERE false';
                END IF;

                IF EXISTS (SELECT 1 FROM information_schema.tables
                           WHERE table_schema = 'mol_gold' AND table_name = 'company_pipeline') THEN
                  EXECUTE 'CREATE OR REPLACE VIEW api.company_pipeline AS
                    SELECT id, company_name, molecule_name, indication, phase, status, mechanism_of_action, source, last_updated
                    FROM mol_gold.company_pipeline';
                ELSE
                  EXECUTE 'CREATE OR REPLACE VIEW api.company_pipeline AS
                    SELECT NULL::uuid AS id, NULL::text AS company_name, NULL::text AS molecule_name, NULL::text AS indication, NULL::text AS phase, NULL::text AS status, NULL::text AS mechanism_of_action, NULL::text AS source, NULL::timestamptz AS last_updated WHERE false';
                END IF;

                IF EXISTS (SELECT 1 FROM information_schema.tables
                           WHERE table_schema = 'mol_gold' AND table_name = 'trial_publication_features') THEN
                  EXECUTE 'CREATE OR REPLACE VIEW api.trial_publication_features AS
                    SELECT id, nct_id, publication_doi, publication_pmid, overlap_score, feature_type, trial_title, publication_title, source
                    FROM mol_gold.trial_publication_features';
                ELSE
                  EXECUTE 'CREATE OR REPLACE VIEW api.trial_publication_features AS
                    SELECT NULL::uuid AS id, NULL::text AS nct_id, NULL::text AS publication_doi, NULL::text AS publication_pmid, 0::numeric AS overlap_score, NULL::text AS feature_type, NULL::text AS trial_title, NULL::text AS publication_title, NULL::text AS source WHERE false';
                END IF;

                -- silver/bronze views (schemas may not exist)
                IF EXISTS (SELECT 1 FROM pg_namespace WHERE nspname = 'silver')
                   AND EXISTS (SELECT 1 FROM information_schema.tables
                               WHERE table_schema = 'silver' AND table_name = 'patents') THEN
                  EXECUTE 'CREATE OR REPLACE VIEW api.patents AS
                    SELECT id, patent_number, title, assignee, filing_date, expiration_date, molecule_id, cpc_codes, country, status, source, ingested_at
                    FROM silver.patents';
                ELSE
                  EXECUTE 'CREATE OR REPLACE VIEW api.patents AS
                    SELECT NULL::uuid AS id, NULL::text AS patent_number, NULL::text AS title, NULL::text AS assignee, NULL::date AS filing_date, NULL::date AS expiration_date, NULL::uuid AS molecule_id, NULL::text[] AS cpc_codes, NULL::text AS country, NULL::text AS status, NULL::text AS source, NULL::timestamptz AS ingested_at WHERE false';
                END IF;

                IF EXISTS (SELECT 1 FROM information_schema.tables
                           WHERE table_schema = 'mol_silver' AND table_name = 'targets') THEN
                  EXECUTE 'CREATE OR REPLACE VIEW api.molecule_targets AS
                    SELECT id, target_name, target_type, uniprot_accession, gene_symbol, organism, molecule_name, action_type, binding_affinity, source
                    FROM mol_silver.targets';
                ELSE
                  EXECUTE 'CREATE OR REPLACE VIEW api.molecule_targets AS
                    SELECT NULL::uuid AS id, NULL::text AS target_name, NULL::text AS target_type, NULL::text AS uniprot_accession, NULL::text AS gene_symbol, NULL::text AS organism, NULL::text AS molecule_name, NULL::text AS action_type, NULL::numeric AS binding_affinity, NULL::text AS source WHERE false';
                END IF;

                IF EXISTS (SELECT 1 FROM pg_namespace WHERE nspname = 'bronze')
                   AND EXISTS (SELECT 1 FROM information_schema.tables
                               WHERE table_schema = 'bronze' AND table_name = 'sider') THEN
                  EXECUTE 'CREATE OR REPLACE VIEW api.sider_side_effects AS
                    SELECT id, drug_name, side_effect, meddra_id, frequency, source, ingested_at
                    FROM bronze.sider';
                ELSE
                  EXECUTE 'CREATE OR REPLACE VIEW api.sider_side_effects AS
                    SELECT NULL::uuid AS id, NULL::text AS drug_name, NULL::text AS side_effect, NULL::text AS meddra_id, NULL::text AS frequency, NULL::text AS source, NULL::timestamptz AS ingested_at WHERE false';
                END IF;

                IF EXISTS (SELECT 1 FROM pg_namespace WHERE nspname = 'silver')
                   AND EXISTS (SELECT 1 FROM information_schema.tables
                               WHERE table_schema = 'silver' AND table_name = 'bioactivity') THEN
                  EXECUTE 'CREATE OR REPLACE VIEW api.bioactivity AS
                    SELECT id, molecule_id, target_name, activity_type, activity_value, activity_unit, assay_type, source, ingested_at
                    FROM silver.bioactivity';
                ELSE
                  EXECUTE 'CREATE OR REPLACE VIEW api.bioactivity AS
                    SELECT NULL::uuid AS id, NULL::uuid AS molecule_id, NULL::text AS target_name, NULL::text AS activity_type, NULL::numeric AS activity_value, NULL::text AS activity_unit, NULL::text AS assay_type, NULL::text AS source, NULL::timestamptz AS ingested_at WHERE false';
                END IF;
              END $views$;

              -- Pure placeholder views (no backing tables needed)
              CREATE OR REPLACE VIEW api.shap_explanations AS
              SELECT NULL::uuid AS molecule_id, NULL::text AS model_id, NULL::text AS feature_name, NULL::numeric AS shap_value, NULL::numeric AS base_value WHERE false;

              CREATE OR REPLACE VIEW api.synthesizability_scores AS
              SELECT NULL::uuid AS molecule_id, NULL::numeric AS sa_score, NULL::numeric AS sc_score, NULL::timestamptz AS computed_at WHERE false;

              CREATE OR REPLACE VIEW api.fingerprints AS
              SELECT NULL::uuid AS molecule_id, NULL::text AS fingerprint_type, NULL::text AS fingerprint_bits, NULL::integer AS radius WHERE false;

              -- ================================================================
              -- Audit Trail View (013-observability-governance, US3)
              -- ================================================================

              -- api.audit_log — Backed by meta.api_audit_log (append-only audit trail)
              -- Only exposes non-sensitive columns; query_params, ip_address,
              -- user_agent intentionally excluded from the API surface.
              DO $audit_view$
              BEGIN
                IF EXISTS (SELECT 1 FROM information_schema.tables
                           WHERE table_schema = 'meta' AND table_name = 'api_audit_log') THEN
                  EXECUTE '
                    CREATE OR REPLACE VIEW api.audit_log AS
                    SELECT id, request_id, timestamp, source, method, path,
                           user_role, user_sub, status_code, response_time_ms,
                           action, category, details, created_at
                    FROM meta.api_audit_log
                    ORDER BY timestamp DESC';
                END IF;
              END $audit_view$;

              -- ================================================================
              -- Migration Status View (013-observability-governance, US4)
              -- ================================================================

              -- api.migration_status — Backed by meta.schema_migrations
              -- Exposes applied migration versions for observability dashboards.
              DO $mig_view$
              BEGIN
                IF EXISTS (SELECT 1 FROM information_schema.tables
                           WHERE table_schema = 'meta' AND table_name = 'schema_migrations') THEN
                  EXECUTE '
                    CREATE OR REPLACE VIEW api.migration_status AS
                    SELECT version, filename, applied_at, applied_by, execution_time_ms
                    FROM meta.schema_migrations
                    ORDER BY version';
                END IF;
              END $mig_view$;

              -- ================================================================
              -- Data Classification View (013-observability-governance, US5)
              -- ================================================================

              -- api.data_classification — Backed by meta.data_classification
              -- Exposes data classification and retention policies for governance.
              DO $class_view$
              BEGIN
                IF EXISTS (SELECT 1 FROM information_schema.tables
                           WHERE table_schema = 'meta' AND table_name = 'data_classification') THEN
                  EXECUTE '
                    CREATE OR REPLACE VIEW api.data_classification AS
                    SELECT schema_name, table_name, classification, pii_fields,
                           retention_days, retention_policy, notes
                    FROM meta.data_classification
                    ORDER BY classification, schema_name, table_name';
                END IF;
              END $class_view$;
              SQL

              # --- Step 10: Grant permissions on API views ---
              echo "Granting permissions on API views..."
              psql -d dk_data <<'SQL'
              -- Clean slate: revoke all existing permissions from web_anon on api and mol_api schemas
              REVOKE ALL PRIVILEGES ON ALL TABLES IN SCHEMA api FROM web_anon;
              -- Defensive: revoke any stale web_anon grants from prior db-init runs
              REVOKE ALL ON ALL TABLES IN SCHEMA mol_api FROM web_anon;
              REVOKE USAGE ON SCHEMA mol_api FROM web_anon;

              -- web_anon: only health and data_catalog (public endpoints)
              GRANT SELECT ON api.health TO web_anon;
              GRANT SELECT ON api.data_catalog TO web_anon;

              -- analyst: read access to targets, scoring, data_sources, data_catalog
              GRANT SELECT ON api.targets TO analyst;
              GRANT SELECT ON api.scoring TO analyst;
              GRANT SELECT ON api.data_sources TO analyst;
              GRANT SELECT ON api.data_catalog TO analyst;
              GRANT SELECT ON api.health TO analyst;

              -- api_user: full read access to all api views
              GRANT SELECT ON api.health TO api_user;
              GRANT SELECT ON api.data_catalog TO api_user;
              GRANT SELECT ON api.targets TO api_user;
              GRANT SELECT ON api.scoring TO api_user;
              GRANT SELECT ON api.data_sources TO api_user;
              GRANT SELECT ON api.molecules TO api_user;
              GRANT SELECT ON api.resolution_queue TO api_user;

              -- analyst: gets molecules, data_sources, and resolution_queue access
              GRANT SELECT ON api.molecules TO analyst;
              GRANT SELECT ON api.resolution_queue TO analyst;

              -- Conditional grants for extended/governance views
              DO $grants$
              DECLARE
                v_name text;
              BEGIN
                FOR v_name IN SELECT table_name FROM information_schema.views
                  WHERE table_schema = 'api'
                  AND table_name IN ('competitive_landscape', 'molecule_properties', 'company_pipeline',
                    'shap_explanations', 'synthesizability_scores', 'fingerprints',
                    'trial_publication_features', 'patents', 'molecule_targets',
                    'sider_side_effects', 'bioactivity')
                LOOP
                  EXECUTE format('GRANT SELECT ON api.%I TO analyst, api_user', v_name);
                END LOOP;

                -- audit_log, migration_status, data_classification: api_user only
                FOR v_name IN SELECT table_name FROM information_schema.views
                  WHERE table_schema = 'api'
                  AND table_name IN ('audit_log', 'migration_status', 'data_classification')
                LOOP
                  EXECUTE format('GRANT SELECT ON api.%I TO api_user', v_name);
                END LOOP;
              END $grants$;
              SQL

              # --- Step 11: Cross-database isolation ---
              echo "Enforcing cross-database isolation..."
              psql -d postgres <<'SQL'
              DO $iso$
              BEGIN
                IF EXISTS (SELECT 1 FROM pg_database WHERE datname = 'behavior_labs') THEN
                  EXECUTE 'REVOKE CONNECT ON DATABASE behavior_labs FROM authenticator';
                  EXECUTE 'REVOKE CONNECT ON DATABASE behavior_labs FROM readonly';
                END IF;
              END $iso$;
              SQL

              # --- Step 12: Verification ---
              echo "=== Verification ==="
              echo "Checking roles..."
              ROLE_COUNT=$(psql -d dk_data -Atc "SELECT COUNT(*) FROM pg_roles WHERE rolname IN ('authenticator', 'web_anon', 'analyst', 'api_user', 'readonly')")
              if [ "$ROLE_COUNT" -eq 5 ]; then
                echo "✓ All 5 roles created successfully"
              else
                echo "✗ ERROR: Expected 5 roles, found $ROLE_COUNT"
                exit 1
              fi

              echo "Checking schemas..."
              SCHEMA_COUNT=$(psql -d dk_data -Atc "SELECT COUNT(*) FROM pg_namespace WHERE nspname IN ('raw', 'staging', 'mart', 'scoring', 'meta', 'api', 'mol_raw', 'mol_bronze', 'mol_silver', 'mol_gold', 'mol_app', 'mol_api', 'hcs_raw', 'hcs_bronze', 'hcs_silver', 'hcs_gold', 'ind_silver', 'ind_gold', 'hcp_silver', 'hcp_gold', 'application', 'bronze', 'silver', 'gold', 'xenon')")
              if [ "$SCHEMA_COUNT" -eq 25 ]; then
                echo "✓ All 25 schemas created successfully"
              else
                echo "✗ ERROR: Expected 25 schemas, found $SCHEMA_COUNT"
                exit 1
              fi

              echo "Checking API views..."
              VIEW_COUNT=$(psql -d dk_data -Atc "SELECT COUNT(*) FROM information_schema.views WHERE table_schema = 'api'")
              if [ "$VIEW_COUNT" -ge 7 ]; then
                echo "✓ Found $VIEW_COUNT API views (7 core + conditional extended views)"
              else
                echo "✗ ERROR: Expected at least 7 views, found $VIEW_COUNT"
                exit 1
              fi

              # --- Step 13: Run database migrations ---
              echo "Step 13: Running database migrations..."
              # Note: For existing databases on first deployment, use --baseline
              # to mark all migrations as applied without re-executing them.
              if command -v python3 &>/dev/null; then
                python3 -m dk_data.scripts.run_migrations || echo "WARN: Migration runner not available (Python image may not have dk_data installed). Skipping."
              else
                echo "WARN: Python not available in this container. Migrations will be run by the application container."
              fi

              echo ""
              echo "=== Database initialization complete ==="
              echo "Roles: authenticator, web_anon, analyst, api_user, readonly"
              echo "Schemas: raw, staging, mart, scoring, meta, api, mol_*, bronze, silver, gold, xenon"
              echo "Views: api.health, api.data_catalog, api.targets, api.scoring, api.data_sources, api.molecules, api.resolution_queue, api.competitive_landscape, api.molecule_properties, api.company_pipeline, api.shap_explanations, api.synthesizability_scores, api.fingerprints, api.trial_publication_features, api.patents, api.molecule_targets, api.sider_side_effects, api.bioactivity, api.audit_log, api.migration_status, api.data_classification"
