---
# PostgREST Probe (013-observability-governance, US2)
# PostgREST v12.2.3 does not expose Prometheus metrics natively.
# This Probe CRD uses blackbox-exporter to check the /health endpoint.
# If blackbox-exporter is not deployed, this resource will be ignored.
# The APIUnavailable alert references probe_success from this probe.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: dk-data-postgrest-probe
  labels:
    app.kubernetes.io/name: dk-data
    app.kubernetes.io/component: postgrest
    release: mimir
spec:
  jobName: dk-data-postgrest
  prober:
    url: blackbox-exporter.infra.svc.cluster.local:9115
    path: /probe
  module: http_2xx
  targets:
    staticConfig:
      static:
        - postgrest:3000/health
      labels:
        app: postgrest
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dk-data-job-trigger
  labels:
    app.kubernetes.io/name: dk-data
    app.kubernetes.io/component: job-trigger
    release: mimir
spec:
  selector:
    matchLabels:
      app: job-trigger
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: dk-data-cronjobs
  labels:
    app.kubernetes.io/name: dk-data
    app.kubernetes.io/component: cronjobs
    release: mimir
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: dk-data
      app.kubernetes.io/component: batch-job
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 15s
---
# All ingestion CronJobs (molecule + CMS/HCS) are covered by dk-data-cronjobs above.
# Both mol-* and fetch-cms-* pod templates use:
#   app.kubernetes.io/component: batch-job
#   app.kubernetes.io/part-of: dk-data
# so no additional PodMonitor is needed per pipeline.
