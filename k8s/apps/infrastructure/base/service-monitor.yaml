---
# PostgREST Probe (013-observability-governance, US2)
# PostgREST v12.2.3 does not expose Prometheus metrics natively.
# This Probe CRD uses blackbox-exporter to check the /health endpoint.
# If blackbox-exporter is not deployed, this resource will be ignored.
# The APIUnavailable alert references probe_success from this probe.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: dk-data-postgrest-probe
  labels:
    app.kubernetes.io/name: dk-data
    app.kubernetes.io/component: postgrest
    release: mimir
spec:
  jobName: dk-data-postgrest
  prober:
    url: blackbox-exporter.infra.svc.cluster.local:9115
    path: /probe
  module: http_2xx
  targets:
    staticConfig:
      static:
        - postgrest:3000/health
      labels:
        app: postgrest
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dk-data-job-trigger
  labels:
    app.kubernetes.io/name: dk-data
    app.kubernetes.io/component: job-trigger
    release: mimir
spec:
  selector:
    matchLabels:
      app: job-trigger
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
# NOTE: CronJob batch pod metrics flow via OTEL push to Alloy (http://alloy.infra.svc.cluster.local:4317)
# rather than Prometheus pull. dk_data.ingestion.main calls setup_telemetry() which pushes
# OTLP metrics to Alloy → Mimir. No HTTP /metrics endpoint is exposed by CronJob pods.
# A PodMonitor is therefore NOT registered. To add pull-based scraping in future:
#   1. Call start_http_server(9091) in dk_data.ingestion.main before the job loop
#   2. Add containerPort name: metrics / containerPort: 9091 to all CronJob pod specs
#   3. Re-add PodMonitor with port: metrics here
