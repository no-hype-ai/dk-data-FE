---
# PgBouncer — connection pooler for the dk_data PostgreSQL cluster (item 6)
#
# Sits in front of CloudNativePG at postgres-cluster-rw.infra.svc.cluster.local:5432.
# All application services (job-trigger, cronjob pods, SQLMesh, PostgREST)
# point POSTGRES_HOST at pgbouncer.infra.svc.cluster.local:5432.
#
# Mode: transaction — each SQL transaction reuses a server connection from the
# pool.  This is the lowest-overhead mode and is compatible with SQLMesh and
# psycopg2; it is NOT compatible with session-level features (SET, LISTEN/NOTIFY,
# advisory locks) so those must use direct connections.
#
# pool_size 20 per user/db pair keeps the total CloudNativePG connection count
# well below the default pg max_connections=100 even when multiple CronJobs run
# concurrently.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: infra
  labels:
    app: pgbouncer
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: connection-pooler
    app.kubernetes.io/part-of: dk-data
data:
  pgbouncer.ini: |
    [databases]
    ; Per-database pool_size overrides.
    ;
    ; CRITICAL sizing math (feature 002 perf pass):
    ;
    ; pool_size is PER PGBOUNCER REPLICA. With 2 pgbouncer replicas:
    ;   actual_max_server_connections = pool_size × pgbouncer_replicas
    ;
    ; Postgres budget (assumes max_connections=200 — see
    ; docs/reports/capacity-audit-2026-Q2.md to bump):
    ;   - postgres superuser + replication + admin: 30 (reserved)
    ;   - app workload available: 170
    ;
    ; Per-replica pool sizes that sum to ≤ 85 (× 2 replicas = 170):
    ;   dk_data:        50 per replica × 2 = 100 total — covers
    ;                   PostgREST 3 replicas × PGRST_DB_POOL=30 = 90
    ;                   with 10 headroom
    ;   behavior_labs:  25 per replica × 2 = 50  total
    ;   litellm:        10 per replica × 2 = 20  total
    ;
    ; Total worst-case = 170 = budget. No headroom — if a 4th
    ; database lands, raise max_connections first.
    ;
    ; Tradeoff: under a thundering-herd burst that lands entirely on
    ; ONE pgbouncer replica, only 50 dk_data slots are available
    ; (40 of 90 PostgREST connections will queue at the pgbouncer
    ; client layer until the other replica picks up traffic). This
    ; is acceptable: it bounds the worst case at "queue, not crash"
    ; and the metering proxy's per-consumer concurrency guard
    ; (max_in_flight=8 high-tier, 4 standard) caps how much of
    ; the 90 PostgREST demand can come from any single consumer.
    dk_data = host=postgres-cluster-rw.infra.svc.cluster.local port=5432 dbname=dk_data pool_size=50
    behavior_labs = host=postgres-cluster-rw.infra.svc.cluster.local port=5432 dbname=behavior_labs pool_size=25
    litellm = host=postgres-cluster-rw.infra.svc.cluster.local port=5432 dbname=litellm pool_size=10

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 5432
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt

    pool_mode = transaction
    max_client_conn = 1000
    default_pool_size = 20
    reserve_pool_size = 5
    reserve_pool_timeout = 3

    log_connections = 0
    log_disconnections = 0
    log_stats = 1
    stats_period = 60

    server_reset_query = DISCARD ALL
    server_check_query = SELECT 1
    server_check_delay = 30

    ignore_startup_parameters = extra_float_digits
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: infra
  labels:
    app: pgbouncer
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: connection-pooler
    app.kubernetes.io/part-of: dk-data
spec:
  # Feature 002 perf pass: 2 replicas so a single pod restart
  # doesn't take down every dk-data, behavior-labs, and litellm
  # consumer simultaneously. PgBouncer is the cluster-wide DB
  # gateway; one replica is unacceptable single-point-of-failure.
  # NB: pool_size in [databases] is per-pgbouncer-instance, so
  # 2 replicas × pool_size=100 = 200 max server connections to
  # dk_data — exactly the postgres max_connections. The runbook
  # docs/runbooks/wal-budget.md notes this trade-off.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
        app.kubernetes.io/name: pgbouncer
        app.kubernetes.io/component: connection-pooler
        app.kubernetes.io/part-of: dk-data
        team: data-platform
        service: dk-data
        product: dk-data
    spec:
      # Spread across nodes — both pgbouncer pods on the same node
      # defeats the HA upgrade.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: pgbouncer
                topologyKey: kubernetes.io/hostname
      # PgBouncer holds active server connections; on shutdown it
      # needs time to drain in-flight queries before SIGKILL.
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 70  # pgbouncer uid in official image
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Build userlist.txt from Doppler-managed secrets at pod start.
        # PgBouncer requires "username" "password" pairs in its auth file.
        # We write scram-sha-256 password hashes from the plain secret so the
        # password is never stored in cleartext on disk.
        - name: write-userlist
          image: ghcr.io/data-kinetic/pgbouncer:1.23.0
          command:
            - /bin/sh
            - -c
            - |
              echo "\"${POSTGRES_USER}\" \"${POSTGRES_PASSWORD}\"" > /etc/pgbouncer/userlist.txt
              echo "\"authenticator\" \"${POSTGREST_PASSWORD}\"" >> /etc/pgbouncer/userlist.txt
              chmod 600 /etc/pgbouncer/userlist.txt
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGREST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGREST_PASSWORD
          volumeMounts:
            - name: pgbouncer-userlist
              mountPath: /etc/pgbouncer
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: pgbouncer
          image: ghcr.io/data-kinetic/pgbouncer:1.23.0
          ports:
            - containerPort: 5432
              name: pgbouncer
          volumeMounts:
            - name: pgbouncer-ini
              mountPath: /opt/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
              readOnly: true
            - name: pgbouncer-userlist
              mountPath: /etc/pgbouncer
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: pgbouncer-ini
          configMap:
            name: pgbouncer-config
        - name: pgbouncer-userlist
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: infra
  labels:
    app: pgbouncer
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: connection-pooler
    app.kubernetes.io/part-of: dk-data
spec:
  selector:
    app: pgbouncer
  ports:
    - name: pgbouncer
      port: 5432
      targetPort: 5432
  type: ClusterIP
