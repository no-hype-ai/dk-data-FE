---
# PgBouncer — connection pooler for the dk_data PostgreSQL cluster (item 6)
#
# Sits in front of CloudNativePG at postgresql.infra.svc.cluster.local:5432.
# All application services (job-trigger, cronjob pods, SQLMesh, PostgREST)
# point POSTGRES_HOST at pgbouncer.infra.svc.cluster.local:5432.
#
# Mode: transaction — each SQL transaction reuses a server connection from the
# pool.  This is the lowest-overhead mode and is compatible with SQLMesh and
# psycopg2; it is NOT compatible with session-level features (SET, LISTEN/NOTIFY,
# advisory locks) so those must use direct connections.
#
# pool_size 20 per user/db pair keeps the total CloudNativePG connection count
# well below the default pg max_connections=100 even when multiple CronJobs run
# concurrently.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: infra
  labels:
    app: pgbouncer
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: connection-pooler
    app.kubernetes.io/part-of: dk-data
data:
  pgbouncer.ini: |
    [databases]
    ; Per-database pool_size overrides (T210)
    dk_data = host=postgresql.infra.svc.cluster.local port=5432 dbname=dk_data pool_size=80
    behavior_labs = host=postgresql.infra.svc.cluster.local port=5432 dbname=behavior_labs pool_size=50
    litellm = host=postgresql.infra.svc.cluster.local port=5432 dbname=litellm pool_size=20

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 5432
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt

    pool_mode = transaction
    max_client_conn = 1000
    default_pool_size = 20
    reserve_pool_size = 5
    reserve_pool_timeout = 3

    log_connections = 0
    log_disconnections = 0
    log_stats = 1
    stats_period = 60

    server_reset_query = DISCARD ALL
    server_check_query = SELECT 1
    server_check_delay = 30

    ignore_startup_parameters = extra_float_digits
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: infra
  labels:
    app: pgbouncer
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: connection-pooler
    app.kubernetes.io/part-of: dk-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
        app.kubernetes.io/name: pgbouncer
        app.kubernetes.io/component: connection-pooler
        app.kubernetes.io/part-of: dk-data
        team: data-platform
        service: dk-data
        product: dk-data
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70  # pgbouncer uid in official image
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Build userlist.txt from Doppler-managed secrets at pod start.
        # PgBouncer requires "username" "password" pairs in its auth file.
        # We write scram-sha-256 password hashes from the plain secret so the
        # password is never stored in cleartext on disk.
        - name: write-userlist
          image: ghcr.io/data-kinetic/pgbouncer:1.23.0
          command:
            - /bin/sh
            - -c
            - |
              echo "\"${POSTGRES_USER}\" \"${POSTGRES_PASSWORD}\"" > /etc/pgbouncer/userlist.txt
              echo "\"authenticator\" \"${POSTGREST_PASSWORD}\"" >> /etc/pgbouncer/userlist.txt
              chmod 600 /etc/pgbouncer/userlist.txt
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGREST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGREST_PASSWORD
          volumeMounts:
            - name: pgbouncer-userlist
              mountPath: /etc/pgbouncer
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: pgbouncer
          image: ghcr.io/data-kinetic/pgbouncer:1.23.0
          ports:
            - containerPort: 5432
              name: pgbouncer
          volumeMounts:
            - name: pgbouncer-ini
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
              readOnly: true
            - name: pgbouncer-userlist
              mountPath: /etc/pgbouncer
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: pgbouncer-ini
          configMap:
            name: pgbouncer-config
        - name: pgbouncer-userlist
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: infra
  labels:
    app: pgbouncer
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: connection-pooler
    app.kubernetes.io/part-of: dk-data
spec:
  selector:
    app: pgbouncer
  ports:
    - name: pgbouncer
      port: 5432
      targetPort: 5432
  type: ClusterIP
