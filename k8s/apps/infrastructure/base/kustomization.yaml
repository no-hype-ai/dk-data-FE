apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Database initialization and seeding
  - db-init-job.yaml
  - job-drugbank-seed.yaml
  # Pod disruption budgets
  - pdb-postgrest.yaml
  - pdb-job-trigger.yaml
  # Networking
  - ingress.yaml
