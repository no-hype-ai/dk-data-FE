apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: dk-data-epo-secrets
  labels:
    app.kubernetes.io/name: dk-data
    app.kubernetes.io/component: secrets
    app.kubernetes.io/managed-by: doppler-operator
  annotations:
    # Fixes issue #169: EPO credentials live in dk-data-fe project (not dk-data-applications)
    # This DopplerSecret creates a separate epo-api-secrets K8s secret from dk-data-fe/prd
spec:
  tokenSecret:
    name: doppler-token-secret
    key: serviceToken
  project: dk-data-fe
  config: prd
  managedSecret:
    name: epo-api-secrets
    type: Opaque
  secrets:
    - EPO_CONSUMER_KEY
    - EPO_CONSUMER_SECRET
  resyncSeconds: 300
