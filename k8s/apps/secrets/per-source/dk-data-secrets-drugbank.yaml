# DopplerSecret — DrugBank API key (per-source isolation, Horizon 3 §D.5)
#
# One secret, one key, one Doppler config. Rotating DRUGBANK_API_KEY now only
# touches the fetch-drugbank consumer — no other source is affected.
#
# Pattern: matches dk-alchemy/k8s/infrastructure/doppler-secrets/base/doppler-secrets.yaml
# Doppler coordination: https://github.com/data-kinetic/dk-alchemy/issues/<tbd>
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: dk-data-secrets-drugbank
  labels:
    app.kubernetes.io/name: dk-data
    app.kubernetes.io/component: source-credentials
    app.kubernetes.io/part-of: dk-data
    app.kubernetes.io/managed-by: doppler-operator
    dk-data.source: drugbank
spec:
  tokenSecret:
    name: doppler-token-secret
    key: serviceToken
  project: dk-data
  config: drugbank
  managedSecret:
    name: dk-data-secrets-drugbank
    type: Opaque
  secrets:
    - DRUGBANK_API_KEY
  resyncSeconds: 300
