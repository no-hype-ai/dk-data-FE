# Per-source DopplerSecret CRs (Horizon 3 §D.5)
#
# Replaces the blast-radius-of-everything `dk-data-secrets` monolith with one
# Secret per source so credential rotation is scoped to a single source.
#
# Each CR here emits a K8s Secret with ONE key:
#   dk-data-secrets-drugbank  → DRUGBANK_API_KEY
#   dk-data-secrets-openfda   → OPENFDA_API_KEY
#   dk-data-secrets-ncbi      → NCBI_API_KEY
#   dk-data-secrets-openalex  → OPENALEX_API_KEY
#   dk-data-secrets-uspto     → USPTO_API_KEY
#   dk-data-secrets-ttd       → TTD_API_KEY
#
# Doppler project: `dk-data`, one config per source (`drugbank`, `openfda`, …).
# See docs/runbooks/credential-rotation.md for the rotation procedure and the
# step-by-step to add a new per-source secret.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - dk-data-secrets-drugbank.yaml
  - dk-data-secrets-openfda.yaml
  - dk-data-secrets-ncbi.yaml
  - dk-data-secrets-openalex.yaml
  - dk-data-secrets-uspto.yaml
  - dk-data-secrets-ttd.yaml
