# DopplerSecret — USPTO PatentsView API key (per-source isolation, Horizon 3 §D.5)
#
# One secret, one key, one Doppler config. Rotating USPTO_API_KEY now only
# touches fetch-uspto-patents / fetch-uspto-trademarks — no other source affected.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: dk-data-secrets-uspto
  labels:
    app.kubernetes.io/name: dk-data
    app.kubernetes.io/component: source-credentials
    app.kubernetes.io/part-of: dk-data
    app.kubernetes.io/managed-by: doppler-operator
    dk-data.source: uspto
spec:
  tokenSecret:
    name: doppler-token-secret
    key: serviceToken
  project: dk-data
  config: uspto
  managedSecret:
    name: dk-data-secrets-uspto
    type: Opaque
  secrets:
    - USPTO_API_KEY
  resyncSeconds: 300
