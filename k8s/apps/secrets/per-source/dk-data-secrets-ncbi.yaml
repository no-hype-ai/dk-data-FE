# DopplerSecret — NCBI E-utilities API key (per-source isolation, Horizon 3 §D.5)
#
# One secret, one key, one Doppler config. Rotating NCBI_API_KEY now only
# touches fetch-pubmed and other NCBI consumers — no other source is affected.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: dk-data-secrets-ncbi
  labels:
    app.kubernetes.io/name: dk-data
    app.kubernetes.io/component: source-credentials
    app.kubernetes.io/part-of: dk-data
    app.kubernetes.io/managed-by: doppler-operator
    dk-data.source: ncbi
spec:
  tokenSecret:
    name: doppler-token-secret
    key: serviceToken
  project: dk-data
  config: ncbi
  managedSecret:
    name: dk-data-secrets-ncbi
    type: Opaque
  secrets:
    - NCBI_API_KEY
  resyncSeconds: 300
