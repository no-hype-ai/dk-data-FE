# DopplerSecret — Therapeutic Target Database API key (per-source isolation, Horizon 3 §D.5)
#
# One secret, one key, one Doppler config. Rotating TTD_API_KEY now only
# touches fetch-ttd — no other source is affected.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: dk-data-secrets-ttd
  labels:
    app.kubernetes.io/name: dk-data
    app.kubernetes.io/component: source-credentials
    app.kubernetes.io/part-of: dk-data
    app.kubernetes.io/managed-by: doppler-operator
    dk-data.source: ttd
spec:
  tokenSecret:
    name: doppler-token-secret
    key: serviceToken
  project: dk-data
  config: ttd
  managedSecret:
    name: dk-data-secrets-ttd
    type: Opaque
  secrets:
    - TTD_API_KEY
  resyncSeconds: 300
