# Molecule Fetch Daily CronJob
# 004-molecule-platform-integration
# SUSPENDED: Pipeline 1 (fetch_molecules.py) must be triggered externally only.
# Use POST /data-platform/source/{source}/ingest to trigger on-demand.
# Sources: ClinicalTrials.gov, OpenFDA Labels
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mol-fetch-daily
  labels:
    app: mol-fetch-daily
    app.kubernetes.io/name: mol-fetch-daily
    app.kubernetes.io/component: ingestion
    app.kubernetes.io/part-of: dk-data
spec:
  schedule: "0 2 * * *"  # 2 AM UTC daily
  suspend: true  # P1 is external-trigger only — use API endpoint to invoke
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 7200  # 2 hour timeout
      template:
        metadata:
          labels:
            app: mol-fetch-daily
            app.kubernetes.io/component: batch-job
            app.kubernetes.io/part-of: dk-data
            team: data-platform
            service: dk-data
            product: dk-data
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
            - name: ghcr-credentials
          containers:
            - name: mol-fetch-daily
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:latest
              command: ["python", "-m", "dk_data.ingestion.fetch_molecules"]
              args: ["--source", "clinicaltrials,openfda"]
              envFrom:
                - secretRef:
                    name: dk-data-secrets
                - configMapRef:
                    name: molecule-pipeline-config
              env:
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_ENABLED
                  value: "true"
                - name: K8S_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "100m"
                limits:
                  memory: "1Gi"
                  cpu: "300m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
