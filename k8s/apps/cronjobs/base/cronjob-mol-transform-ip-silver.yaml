# Molecule Transform — IP/HCS Silver Layer
# 020-drugbank-seed-schema-fix / sqlmesh-init
# Runs ip_silver models: 10 IP + HCS silver models.
# Scheduled 2.5h after ip_bronze (09:00) to allow ip_bronze to complete.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mol-transform-ip-silver
  labels:
    app: mol-transform-ip-silver
    app.kubernetes.io/name: mol-transform-ip-silver
    app.kubernetes.io/component: transform
    app.kubernetes.io/part-of: dk-data
spec:
  schedule: "30 10 * * *"  # 10:30 UTC daily — after silver (08:00+2h) AND ip_bronze (06:30+2h)
                            # hcpcs_molecule_bridge depends on BOTH mol_silver.molecule_aliases
                            # (silver layer) AND hcs_bronze.* (ip_bronze layer)
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 5400  # 90 min
      template:
        metadata:
          labels:
            app: mol-transform-ip-silver
            app.kubernetes.io/component: batch-job
            app.kubernetes.io/part-of: dk-data
            team: data-platform
            service: dk-data
            product: dk-data
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
            - name: ghcr-credentials
          containers:
            - name: mol-transform-ip-silver
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:latest
              command: ["python", "-m", "dk_data.ingestion.transform_molecules"]
              args: ["--layer", "ip_silver"]
              envFrom:
                - secretRef:
                    name: dk-data-secrets
              env:
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_ENABLED
                  value: "true"
              resources:
                requests:
                  memory: "2Gi"
                  cpu: "200m"
                limits:
                  memory: "2Gi"
                  cpu: "500m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: sqlmesh-logs
                  mountPath: /usr/local/lib/python3.11/site-packages/dk_data/sqlmesh/logs
                - name: sqlmesh-cache
                  mountPath: /usr/local/lib/python3.11/site-packages/dk_data/sqlmesh/.cache
          volumes:
            - name: tmp
              emptyDir: {}
            - name: sqlmesh-logs
              emptyDir: {}
            - name: sqlmesh-cache
              emptyDir: {}
