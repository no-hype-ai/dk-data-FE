apiVersion: batch/v1
kind: CronJob
metadata:
  name: fetch-who-gho
  labels:
    app: dk-data-ingestion
    component: who-gho
    feature: "019-cms-puf"
spec:
  schedule: "0 7 1 * *"  # Monthly — 1st at 7AM UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 3600  # 1 hour
      template:
        metadata:
          labels:
            app: fetch-who-gho
            app.kubernetes.io/component: ingestion
            app.kubernetes.io/part-of: dk-data
            team: data-platform
            service: dk-data
            product: dk-data
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: fetch-who-gho
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:main
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "Fetching WHO Global Health Observatory data..."
                  python -m dk_data.ingestion.run --source who_gho
                  echo "WHO GHO fetch complete."
              envFrom:
                - secretRef:
                    name: dk-data-secrets
              env:
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_SERVICE_NAME
                  value: "dk-data-fetch-who-gho"
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "250m"
                limits:
                  memory: "2Gi"
                  cpu: "500m"
              volumeMounts:
                - name: data
                  mountPath: /data/raw
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              emptyDir:
                sizeLimit: 10Gi
            - name: tmp
              emptyDir: {}
