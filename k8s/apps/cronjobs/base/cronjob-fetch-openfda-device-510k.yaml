apiVersion: batch/v1
kind: CronJob
metadata:
  name: fetch-openfda-device-510k
  labels:
    app: dk-data-ingestion
    component: openfda-device-510k
    feature: "fda-devices"
spec:
  schedule: "0 3 8 * *"  # 8th of month 03:00 UTC — staggered from openfda_faers (day 6) and openfda_labels
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 7200  # 2h — full backfill covers 25+ years × ~10K/year
      template:
        metadata:
          labels:
            app: fetch-openfda-device-510k
            app.kubernetes.io/component: fetcher
            app.kubernetes.io/part-of: dk-data
            team: data-platform
            service: dk-data
            product: dk-data
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: fetch-openfda-device-510k
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:latest
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "Fetching OpenFDA Device 510(k) clearances..."
                  python -m dk_data.ingestion.run --source openfda_device_510k
                  echo "OpenFDA Device 510(k) fetch complete."
              envFrom:
                - secretRef:
                    name: dk-data-secrets
              env:
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_SERVICE_NAME
                  value: "dk-data-fetch-openfda-device-510k"
              resources:
                requests:
                  memory: "1Gi"
                  cpu: "250m"
                limits:
                  memory: "4Gi"
                  cpu: "1000m"
              volumeMounts:
                - name: data
                  mountPath: /data/raw
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              emptyDir:
                sizeLimit: 5Gi
            - name: tmp
              emptyDir: {}
