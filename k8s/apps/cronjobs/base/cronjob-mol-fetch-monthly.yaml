# Molecule Fetch Monthly CronJob
# 004-molecule-platform-integration
# SUSPENDED: All sources (bindingdb, sider, tdc_admet, rxnorm, dailymed, fda_drugs,
# kegg_drug, ttd, pharmgkb, imgt, cdc_vaccines) now have individual main.py CronJobs.
# fetch_molecules.py only handles Pipeline 1 sources (chembl, pubchem, openfda, etc.)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mol-fetch-monthly
  labels:
    app: mol-fetch-monthly
    app.kubernetes.io/name: mol-fetch-monthly
    app.kubernetes.io/component: ingestion
    app.kubernetes.io/part-of: dk-data
spec:
  schedule: "0 8 1 * *"  # 1st of month, 8 AM UTC
  suspend: true  # All sources migrated to individual main.py CronJobs
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 7200  # 2 hour timeout
      template:
        metadata:
          labels:
            app: mol-fetch-monthly
            app.kubernetes.io/component: batch-job
            app.kubernetes.io/part-of: dk-data
            team: data-platform
            service: dk-data
            product: dk-data
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
            - name: ghcr-credentials
          containers:
            - name: mol-fetch-monthly
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:main
              command: ["python", "-m", "dk_data.ingestion.fetch_molecules"]
              args: ["--source", "bindingdb,sider,tdc_admet,rxnorm,dailymed,fda_drugs,kegg_drug,ttd,pharmgkb,imgt,cdc_vaccines"]
              envFrom:
                - secretRef:
                    name: dk-data-secrets
              env:
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_ENABLED
                  value: "true"
                - name: K8S_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              envFrom:
                - configMapRef:
                    name: molecule-pipeline-config
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "300m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
