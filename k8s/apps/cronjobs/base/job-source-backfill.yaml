# Per-Source Backfill Job — fetch → bronze transform → health check for ONE source.
#
# This is a MANUAL, ONE-OFF job. Apply it when you need to backfill a single
# data source without running the full initial-backfill pipeline.
#
# HOW TO USE:
#
#   1. Copy this file or edit it in place.
#      IMPORTANT: Rename the job (metadata.name) before each apply to avoid
#      "already exists" errors — Kubernetes Jobs are immutable once created.
#
#   2. Set --source to the source name you want to backfill.
#      See SOURCE_TO_BRONZE_MODELS in source_backfill.py for the full list.
#
#   3. (Optional) Adjust --days-back. Default: compute from SQLMESH_START_DATE.
#
#   4. Apply and watch logs:
#        kubectl apply -f job-source-backfill.yaml -n dk-data-prod
#        kubectl logs -f job/bf-REPLACE_ME -n dk-data-prod
#        kubectl delete job bf-REPLACE_ME -n dk-data-prod
#
# STAGE FLAGS (set in args):
#   --fetch-only       Only fetch raw data (skip transform + health)
#   --transform-only   Only run bronze SQLMesh model (raw already populated)
#   --health-only      Only run the health check (verify bronze table)
#   --dry-run          Show what would happen without doing anything
#
# EXIT CODES:
#   0 — all stages passed
#   1 — fetch failed
#   2 — bronze transform failed
#   3 — health check failed (0 rows or null grain column)
#
# EXAMPLES:
#   Full pipeline, 730 days back:
#     name: bf-pubchem
#     args: ["--source", "pubchem", "--days-back", "730"]
#
#   Fetch only:
#     name: bf-pubchem-fetch
#     args: ["--source", "pubchem", "--fetch-only"]
#
#   Transform only (raw already populated):
#     name: bf-pubchem-xform
#     args: ["--source", "pubchem", "--transform-only"]
#
#   Health check only:
#     name: bf-pubchem-health
#     args: ["--source", "pubchem", "--health-only"]
#
apiVersion: batch/v1
kind: Job
metadata:
  # RENAME before each apply: bf-<source>[-stage] e.g. bf-pubchem, bf-chembl-fetch
  name: bf-REPLACE_ME
  labels:
    app: source-backfill
    app.kubernetes.io/name: source-backfill
    app.kubernetes.io/component: backfill
    app.kubernetes.io/part-of: dk-data
spec:
  backoffLimit: 0          # Do not auto-retry — fix the failure and re-apply
  ttlSecondsAfterFinished: 604800   # Keep pod logs for 7 days
  template:
    metadata:
      labels:
        app: source-backfill
        app.kubernetes.io/component: batch-job
        app.kubernetes.io/part-of: dk-data
        team: data-platform
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: source-backfill
          image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - python
            - -m
            - dk_data.ingestion.source_backfill
          # EDIT --source and --days-back before applying.
          # Common patterns:
          #   Full pipeline, default window:
          #     ["--source", "pubchem"]
          #   Full pipeline, 730 days back:
          #     ["--source", "pubchem", "--days-back", "730"]
          #   Fetch only:
          #     ["--source", "pubchem", "--fetch-only"]
          #   Transform only (raw already populated):
          #     ["--source", "pubchem", "--transform-only"]
          #   Health check only:
          #     ["--source", "pubchem", "--health-only"]
          args: ["--source", "REPLACE_ME", "--days-back", "730"]
          envFrom:
            - secretRef:
                name: dk-data-secrets
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.infra.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "dk-data-source-backfill"
            - name: OTEL_ENABLED
              value: "true"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"   # Sufficient for single-source fetches; raise for large sources
              cpu: "1000m"
          volumeMounts:
            - name: data
              mountPath: /tmp/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: "10Gi"   # Single-source download; raise to 20Gi for NPPES / PUFs
        - name: tmp
          emptyDir: {}
