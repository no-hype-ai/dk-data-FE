apiVersion: batch/v1
kind: CronJob
metadata:
  name: fetch-fda-ndc
  labels:
    app: dk-data-ingestion
    component: fda-ndc
    feature: "019-cms-puf"
spec:
  schedule: "0 1 3 * *"  # 3rd of month 01:00 UTC — staggered off 1st to reduce DB contention
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 7200  # 2 hours — full NDC directory is large (~100k products)
      template:
        metadata:
          labels:
            app: fetch-fda-ndc
            app.kubernetes.io/component: batch-job
            app.kubernetes.io/part-of: dk-data
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
            - name: fetch-fda-ndc
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:latest
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "Fetching FDA NDC directory..."
                  python -m dk_data.ingestion.run --source fda_ndc
                  echo "FDA NDC fetch complete."
              envFrom:
                - secretRef:
                    name: dk-data-secrets
              env:
                - name: DATA_DIR
                  value: "/tmp/dk-data-raw"
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_SERVICE_NAME
                  value: "dk-data-fetch-fda-ndc"
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "100m"
                limits:
                  memory: "2Gi"
                  cpu: "500m"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
