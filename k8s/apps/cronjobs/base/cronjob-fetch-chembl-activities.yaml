apiVersion: batch/v1
kind: CronJob
metadata:
  name: fetch-chembl-activities
  labels:
    app: dk-data-ingestion
    component: chembl-activities
    feature: "019-cms-puf"
spec:
  schedule: "0 3 * * 1"  # Weekly — Mondays at 3AM UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 14400  # 4 hours — large activity dataset
      template:
        metadata:
          labels:
            app: fetch-chembl-activities
            app.kubernetes.io/component: batch-job
            app.kubernetes.io/part-of: dk-data
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
            - name: fetch-chembl-activities
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:latest
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "Fetching ChEMBL activity data..."
                  python -m dk_data.ingestion.run --source chembl_activities
                  echo "ChEMBL activities fetch complete."
              envFrom:
                - secretRef:
                    name: dk-data-secrets
              env:
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_SERVICE_NAME
                  value: "dk-data-fetch-chembl-activities"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "2Gi"
                  cpu: "500m"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
