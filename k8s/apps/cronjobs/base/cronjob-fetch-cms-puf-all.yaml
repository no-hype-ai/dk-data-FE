apiVersion: batch/v1
kind: CronJob
metadata:
  name: fetch-cms-puf-all
  labels:
    app: dk-data-ingestion
    component: cms-puf-all
    feature: "019-cms-puf"
spec:
  schedule: "0 2 * * 1"  # Weekly — Mondays at 2AM UTC (offset from fetch-cms-all Sunday 2AM to avoid contention)
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 7200  # 2 hours — large CMS PUF files via DCAT
      template:
        metadata:
          labels:
            app: fetch-cms-puf-all
            app.kubernetes.io/component: fetcher
            app.kubernetes.io/part-of: dk-data
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
            - name: fetch-cms-puf
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:latest
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "Fetching CMS PUF data (DCAT downloader)..."
                  python -m dk_data.ingestion.fetch_cms_puf --all
                  echo "CMS PUF fetch complete."
              envFrom:
                - secretRef:
                    name: dk-data-secrets
              env:
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_SERVICE_NAME
                  value: "dk-data-fetch-cms-puf-all"
                - name: K8S_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              resources:
                requests:
                  memory: "1Gi"
                  cpu: "100m"
                limits:
                  memory: "4Gi"
                  cpu: "500m"
              volumeMounts:
                - name: data-volume
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data-volume
              emptyDir: {}
            - name: tmp
              emptyDir: {}
