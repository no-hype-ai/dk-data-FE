apiVersion: batch/v1
kind: CronJob
metadata:
  name: fetch-openfda-faers
  labels:
    app: dk-data-ingestion
    component: openfda-faers
    feature: "019-cms-puf"
spec:
  schedule: "0 2 6 * *"  # 6th of month 02:00 UTC — staggered; FAERS monthly quarter release
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 7200  # 2 hours
      template:
        metadata:
          labels:
            app: fetch-openfda-faers
            app.kubernetes.io/component: fetcher
            app.kubernetes.io/part-of: dk-data
            team: data-platform
            service: dk-data
            product: dk-data
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: fetch-openfda-faers
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:latest
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "Fetching OpenFDA FAERS data..."
                  python -m dk_data.ingestion.run --source openfda_faers
                  echo "OpenFDA FAERS fetch complete."
              envFrom:
                - secretRef:
                    name: dk-data-secrets
              env:
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_SERVICE_NAME
                  value: "dk-data-fetch-openfda-faers"
                # Per-source credential (Horizon 3 §D.5, issue #319) —
                # OPENFDA_API_KEY is pulled from the dedicated
                # dk-data-secrets-openfda Secret, NOT the monolithic
                # dk-data-secrets. Rotating openFDA's key touches this
                # Secret only; no other source is affected. Explicit env
                # overrides any inherited value from envFrom above.
                - name: OPENFDA_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets-openfda
                      key: OPENFDA_API_KEY
                      optional: true
              resources:
                requests:
                  memory: "1Gi"
                  cpu: "250m"
                limits:
                  memory: "4Gi"
                  cpu: "1000m"
              volumeMounts:
                - name: data
                  mountPath: /data/raw
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              emptyDir:
                sizeLimit: 10Gi
            - name: tmp
              emptyDir: {}
