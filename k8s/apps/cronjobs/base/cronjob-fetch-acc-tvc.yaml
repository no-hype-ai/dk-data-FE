# ACC TVC (Transcatheter Valve Certification) Fetch CronJob
# Fetches certified TAVR site list and TVT Registry data from NCDR Public Reporting API
# and CardioSmart facility downloads. NCDR refreshes annually but the API publishes
# delta updates monthly, so a monthly schedule keeps the dataset reasonably fresh.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fetch-acc-tvc
  labels:
    app: fetch-acc-tvc
    app.kubernetes.io/name: fetch-acc-tvc
    app.kubernetes.io/component: ingestion
    app.kubernetes.io/part-of: dk-data
spec:
  schedule: "0 3 7 * *"  # 7th of month 03:00 UTC — staggered off other monthly fetchers
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 1800  # 30 min — small NCDR public dataset
      template:
        metadata:
          labels:
            app: fetch-acc-tvc
            app.kubernetes.io/component: fetcher
            app.kubernetes.io/part-of: dk-data
            team: data-platform
            service: dk-data
            product: dk-data
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
            - name: ghcr-credentials
          containers:
            - name: fetch-acc-tvc
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:latest
              command: ["python", "-m", "dk_data.ingestion.main"]
              args: ["acc_tvc"]
              envFrom:
                - secretRef:
                    name: dk-data-secrets
              env:
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_ENABLED
                  value: "true"
                - name: POSTGRES_HOST_DIRECT
                  value: "postgres-cluster-rw.infra.svc.cluster.local:5432"
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
