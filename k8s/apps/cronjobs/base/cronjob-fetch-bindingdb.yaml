# BindingDB Fetch CronJob
# 019-cms-puf-platform-reconciliation
# Downloads BindingDB_All.tsv.zip (~500MB) and loads binding affinity records.
# Full dataset (~1.2M rows with affinity data); monthly refresh is sufficient
# (BindingDB releases annually but accepts incremental data throughout year).
# Memory limit raised to 4Gi — uncompressed BindingDB_All.tsv is ~3GB; 2Gi OOMKilled.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fetch-bindingdb
  labels:
    app: fetch-bindingdb
    app.kubernetes.io/name: fetch-bindingdb
    app.kubernetes.io/component: ingestion
    app.kubernetes.io/part-of: dk-data
spec:
  schedule: "0 3 4 * *"  # 4th of month 03:00 UTC — staggered; chembl+pubchem run on 1st
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 14400  # 4 hour timeout (large file + ~1.2M DB inserts)
      template:
        metadata:
          labels:
            app: fetch-bindingdb
            app.kubernetes.io/component: fetcher
            app.kubernetes.io/part-of: dk-data
            team: data-platform
            service: dk-data
            product: dk-data
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
            - name: ghcr-credentials
          containers:
            - name: fetch-bindingdb
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:latest
              command: ["python", "-m", "dk_data.ingestion.main"]
              args: ["bindingdb"]
              envFrom:
                - secretRef:
                    name: dk-data-secrets
              env:
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_ENABLED
                  value: "true"
                - name: POSTGRES_HOST_DIRECT
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_HOST
              resources:
                requests:
                  memory: "4Gi"
                  cpu: "200m"
                limits:
                  memory: "8Gi"   # BindingDB_All.tsv uncompressed ~3GB; 4Gi was OOMKilled
                  cpu: "500m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
