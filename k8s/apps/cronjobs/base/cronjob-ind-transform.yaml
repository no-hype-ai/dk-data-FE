# Indication Domain Transform — Bronze + Silver
# 022-full-model-coverage
# Runs ind_bronze.icd11_codes then ind_silver.icd11_ontology.
# ind_bronze reads mol_bronze.who_icd (available after ip_bronze at 06:30).
# ind_silver reads ind_bronze.icd11_codes.
# Both run in one job sequentially via transform_all_layers-style invocation.
# Schedule: 07:30 UTC (after ip_bronze 06:30 which provides who_icd).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ind-transform
  labels:
    app: ind-transform
    app.kubernetes.io/name: ind-transform
    app.kubernetes.io/component: transform
    app.kubernetes.io/part-of: dk-data
spec:
  schedule: "0 15 * * *"  # 07:30 UTC daily
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 1800  # 30 min — 2 FULL models, small tables
      template:
        metadata:
          labels:
            app: ind-transform
            app.kubernetes.io/component: fetcher
            app.kubernetes.io/part-of: dk-data
            team: data-platform
            service: dk-data
            product: dk-data
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
            - name: ghcr-credentials
          containers:
            - name: ind-transform-bronze
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  python -m dk_data.ingestion.transform_molecules --layer ind_bronze &&
                  python -m dk_data.ingestion.transform_molecules --layer ind_silver
              envFrom:
                - secretRef:
                    name: dk-data-secrets
              env:
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_ENABLED
                  value: "true"
                - name: POSTGRES_HOST_DIRECT
                  value: "postgresql.infra.svc.cluster.local:5432"
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "100m"
                limits:
                  memory: "4Gi"
                  cpu: "500m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: sqlmesh-logs
                  mountPath: /usr/local/lib/python3.11/site-packages/dk_data/sqlmesh/logs
          volumes:
            - name: tmp
              emptyDir: {}
            - name: sqlmesh-logs
              emptyDir: 
                medium: ""
                sizeLimit: 512Mi
