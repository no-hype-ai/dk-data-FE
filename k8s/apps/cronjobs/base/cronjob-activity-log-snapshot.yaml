# Activity log snapshot CronJob
# Feature: 001-silver-medallion-rebuild / T228
# Calls meta.snapshot_activity() every 5 minutes and meta.purge_activity_log()
# daily to keep the table bounded to 7 days of data.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: activity-log-snapshot
  labels:
    app: dk-data-observability
    app.kubernetes.io/name: activity-log-snapshot
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: dk-data
spec:
  schedule: "*/5 * * * *"  # Every 5 minutes
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      activeDeadlineSeconds: 120  # 2 minutes max
      template:
        metadata:
          labels:
            app: activity-log-snapshot
            app.kubernetes.io/component: monitoring
            app.kubernetes.io/part-of: dk-data
        spec:
          restartPolicy: Never
          securityContext:
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: activity-log-snapshot
              image: postgres:16-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "Snapshotting pg_stat_activity..."
                  psql -h "${POSTGRES_HOST}" -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" \
                    -c "SELECT meta.snapshot_activity()"
                  # Purge old rows once a day (idempotent at 00:00)
                  HOUR=$(date -u +%H)
                  MINUTE=$(date -u +%M)
                  if [ "${HOUR}" = "00" ] && [ "${MINUTE}" -lt 10 ]; then
                    echo "Running daily purge..."
                    psql -h "${POSTGRES_HOST}" -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" \
                      -c "SELECT meta.purge_activity_log(7)"
                  fi
                  echo "Activity snapshot complete."
              env:
                - name: POSTGRES_HOST
                  value: "postgresql.infra.svc.cluster.local"
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_PASSWORD
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_DB
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "128Mi"
                  cpu: "100m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
