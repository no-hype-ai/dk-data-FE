# CMS Medicare Coverage Database Ingest CronJob
# 021-post-deploy-fixes
# Fetches NCDs, NCAs, and Technology Assessments from api.coverage.cms.gov
# ~2,400 records total, free public API, no auth required
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fetch-cms-coverage
  labels:
    app: fetch-cms-coverage
    app.kubernetes.io/name: fetch-cms-coverage
    app.kubernetes.io/component: ingestion
    app.kubernetes.io/part-of: dk-data
spec:
  schedule: "0 5 * * 2"  # Tuesdays 5:00 AM UTC (weekly, off-peak)
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 1800  # 30 minute timeout — ~2,400 records via paginated REST
      template:
        metadata:
          labels:
            app: fetch-cms-coverage
            app.kubernetes.io/component: batch-job
            app.kubernetes.io/part-of: dk-data
            team: data-platform
            service: dk-data
            product: dk-data
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
            - name: ghcr-credentials
          containers:
            - name: fetch-cms-coverage
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:main
              command: ["python", "-m", "dk_data.ingestion.main"]
              args: ["cms_coverage"]
              env:
                - name: POSTGRES_HOST
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_HOST
                - name: POSTGRES_PORT
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_PORT
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_PASSWORD
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_DB
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_ENABLED
                  value: "true"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "300m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
