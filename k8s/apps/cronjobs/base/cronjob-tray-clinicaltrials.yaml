# Tray procedure CronJob: tray-clinicaltrials
# Feature: 001-silver-medallion-rebuild / T155
# Atomically rebuilds bronze table via unlogged tray with atomic swap.
# Connects DIRECTLY to PostgreSQL primary (NOT PgBouncer) because ALTER TABLE
# RENAME and SET LOGGED require session-level state across transactions.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tray-clinicaltrials
  labels:
    app: tray-clinicaltrials
    app.kubernetes.io/name: tray-clinicaltrials
    app.kubernetes.io/component: transform
    app.kubernetes.io/part-of: dk-data
spec:
  schedule: "0 3 * * 0"  # Sunday 3 AM UTC — after all fetches complete
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 14400  # 4 hour timeout
      template:
        metadata:
          labels:
            app: tray-clinicaltrials
            app.kubernetes.io/component: transform
            app.kubernetes.io/part-of: dk-data
            team: data-platform
            service: dk-data
            product: dk-data
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
            - name: ghcr-credentials
          containers:
            - name: tray-clinicaltrials
              image: postgres:16-alpine
              command: ["psql"]
              args:
                - "-v"
                - "ON_ERROR_STOP=1"
                - "-c"
                - "CALL mol_bronze.refresh_clinicaltrials_via_tray();"
              envFrom:
                - secretRef:
                    name: dk-data-secrets
              env:
                - name: PGHOST
                  value: "postgres-cluster-rw.infra.svc.cluster.local"
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_PASSWORD
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_DB
                - name: POSTGRES_HOST_DIRECT
                  value: "postgres-cluster-rw.infra.svc.cluster.local:5432"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
