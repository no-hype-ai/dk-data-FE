# CMS Opioid Treatment PUF Ingest CronJob
# 019-cms-puf-platform-reconciliation (T015)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fetch-cms-opioid-puf
  labels:
    app: fetch-cms-opioid-puf
    app.kubernetes.io/name: fetch-cms-opioid-puf
    app.kubernetes.io/component: ingestion
    app.kubernetes.io/part-of: dk-data
spec:
  schedule: "30 8 15 4 *"  # Annually Apr 15 8:30 AM UTC — Medicare Opioid PUF (Part D Prescribers) released each April
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 14400  # 4h — multi-year streaming with checkpoint/resume
      template:
        metadata:
          labels:
            app: fetch-cms-opioid-puf
            app.kubernetes.io/component: fetcher
            app.kubernetes.io/part-of: dk-data
            team: data-platform
            service: dk-data
            product: dk-data
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
            - name: ghcr-credentials
          containers:
            - name: fetch-cms-opioid-puf
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:latest
              command: ["python", "-m", "dk_data.ingestion.main"]
              args: ["cms_opioid_puf"]
              envFrom:
                - secretRef:
                    name: dk-data-secrets
              env:
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_ENABLED
                  value: "true"
                - name: POSTGRES_HOST_DIRECT
                  value: "postgres-cluster-rw.infra.svc.cluster.local:5432"
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "100m"
                limits:
                  memory: "2Gi"
                  cpu: "300m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
