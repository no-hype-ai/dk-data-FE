# TAVR Benchmark Inputs — Phase 1B denormalized scoring inputs
# Phase 1B of edwards-meadow TAVR Benchmark Lab.
# Spec: .dk/specs/010-tavr-benchmark-inputs-provisioning/spec.md
# Migration: 242_tavr_benchmark_inputs.sql
#
# Depends on Phase 1A outputs (tavr_hospital_profile + tavr_program_year)
# being populated. Schedule deliberately runs AFTER those jobs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fetch-tavr-benchmark-inputs
  labels:
    app: fetch-tavr-benchmark-inputs
    app.kubernetes.io/name: fetch-tavr-benchmark-inputs
    app.kubernetes.io/component: ingestion
    app.kubernetes.io/part-of: dk-data
spec:
  schedule: "0 7 * * 2"  # Tuesdays 07:00 UTC, weekly (after program-year at 06:30)
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: fetch-tavr-benchmark-inputs
            app.kubernetes.io/component: fetcher
            app.kubernetes.io/part-of: dk-data
            team: data-platform
            service: dk-data
            product: dk-data
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
            - name: ghcr-credentials
          containers:
            - name: fetch-tavr-benchmark-inputs
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:latest
              command: ["python", "-m", "dk_data.ingestion.main"]
              args: ["tavr_benchmark_inputs"]
              envFrom:
                - secretRef:
                    name: dk-data-secrets
              env:
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_ENABLED
                  value: "true"
                - name: POSTGRES_HOST_DIRECT
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_HOST
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "300m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
