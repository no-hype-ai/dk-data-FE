apiVersion: batch/v1
kind: CronJob
metadata:
  name: fetch-tga-orphan-designations
  labels:
    app: dk-data-ingestion
    component: tga-orphan-designations
    feature: "tga-au"
spec:
  schedule: "0 22 10 * *"  # 10th of month 22:00 UTC — monthly
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: fetch-tga-orphan-designations
            app.kubernetes.io/component: fetcher
            app.kubernetes.io/part-of: dk-data
            team: data-platform
            service: dk-data
            product: dk-data
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: fetch-tga-orphan-designations
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:latest
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "Fetching TGA Orphan Designations..."
                  python -m dk_data.ingestion.run --source tga_orphan_designations
                  echo "TGA Orphan Designations fetch complete."
              envFrom:
                - secretRef:
                    name: dk-data-secrets
              env:
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_SERVICE_NAME
                  value: "dk-data-fetch-tga-orphan-designations"
              resources:
                requests: {memory: "256Mi", cpu: "100m"}
                limits:   {memory: "1Gi",   cpu: "500m"}
              volumeMounts:
                - {name: data, mountPath: /data/raw}
                - {name: tmp,  mountPath: /tmp}
          volumes:
            - {name: data, emptyDir: {sizeLimit: 1Gi}}
            - {name: tmp,  emptyDir: {}}
