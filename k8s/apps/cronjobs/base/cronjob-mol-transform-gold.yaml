# Molecule Transform — Gold Layer
# 020-drugbank-seed-schema-fix / sqlmesh-init
# Runs mol_gold.* aggregations (9 models).
# Scheduled 2h after silver (10:00) to allow silver to complete.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mol-transform-gold
  labels:
    app: mol-transform-gold
    app.kubernetes.io/name: mol-transform-gold
    app.kubernetes.io/component: transform
    app.kubernetes.io/part-of: dk-data
spec:
  schedule: "0 12 * * *"  # 12:00 UTC daily — 4h after silver start (08:00+4h)
                           # mol_gold aggregates from all mol_silver including
                           # molecule_aliases and identifier_mappings which need
                           # ample time to complete their chain
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 5400  # 90 min
      template:
        metadata:
          labels:
            app: mol-transform-gold
            app.kubernetes.io/component: batch-job
            app.kubernetes.io/part-of: dk-data
            team: data-platform
            service: dk-data
            product: dk-data
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
            - name: ghcr-credentials
          containers:
            - name: mol-transform-gold
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:main
              command: ["python", "-m", "dk_data.ingestion.transform_molecules"]
              args: ["--layer", "gold"]
              env:
                - name: POSTGRES_HOST
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_HOST
                - name: POSTGRES_PORT
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_PORT
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_PASSWORD
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_DB
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_ENABLED
                  value: "true"
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "200m"
                limits:
                  memory: "1Gi"
                  cpu: "500m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
