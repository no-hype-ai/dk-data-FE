# Molecule Transform — Bronze Layer
# 020-drugbank-seed-schema-fix / sqlmesh-init
# Runs mol_bronze.* transformations (5 models).
# Staggered schedule: bronze at 06:00, silver at 08:00, gold at 10:00.
# ip_bronze runs in parallel at 06:30 (independent of mol_bronze).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mol-transform-bronze
  labels:
    app: mol-transform-bronze
    app.kubernetes.io/name: mol-transform-bronze
    app.kubernetes.io/component: transform
    app.kubernetes.io/part-of: dk-data
spec:
  schedule: "0 8 * * *"  # 06:00 UTC daily
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 5400  # 90 min — bronze is 5 models
      template:
        metadata:
          labels:
            app: mol-transform-bronze
            app.kubernetes.io/component: fetcher
            app.kubernetes.io/part-of: dk-data
            team: data-platform
            service: dk-data
            product: dk-data
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
            - name: ghcr-credentials
          containers:
            - name: mol-transform-bronze
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:latest
              command: ["python", "-m", "dk_data.ingestion.transform_molecules"]
              args: ["--layer", "bronze"]
              envFrom:
                - secretRef:
                    name: dk-data-secrets
              env:
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_ENABLED
                  value: "true"
                - name: POSTGRES_HOST_DIRECT
                  value: "postgres-cluster-rw.infra.svc.cluster.local:5432"
              resources:
                requests:
                  memory: "2Gi"
                  cpu: "200m"
                limits:
                  memory: "4Gi"
                  cpu: "500m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: sqlmesh-logs
                  mountPath: /usr/local/lib/python3.11/site-packages/dk_data/sqlmesh/logs
          volumes:
            - name: tmp
              emptyDir: {}
            - name: sqlmesh-logs
              emptyDir: 
                medium: ""
                sizeLimit: 512Mi
