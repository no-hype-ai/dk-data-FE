# Mart / Scoring / Targeting Transform
# 022-full-model-coverage
# Runs hcs_gold data mart models:
#   dim_hospital, fact_financial_metrics, fact_tavr_program (from staging.*)
#   target_scores, score_factors (from hcs_gold.*)
#   targeting_scores, targeting_summary (from hcs_gold.target_scores)
# Dependencies: cms-gold-refresh (14:30) + mol_gold_ext (14:00)
# Schedule: 15:30 UTC daily.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mart-transform
  labels:
    app: mart-transform
    app.kubernetes.io/name: mart-transform
    app.kubernetes.io/component: transform
    app.kubernetes.io/part-of: dk-data
spec:
  schedule: "30 15 * * *"  # 15:30 UTC daily
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 3600  # 1h — 7 FULL models
      template:
        metadata:
          labels:
            app: mart-transform
            app.kubernetes.io/component: batch-job
            app.kubernetes.io/part-of: dk-data
            team: data-platform
            service: dk-data
            product: dk-data
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
            - name: ghcr-credentials
          containers:
            - name: mart-transform
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:latest
              command: ["python", "-m", "dk_data.ingestion.transform_molecules"]
              args: ["--layer", "mart"]
              envFrom:
                - secretRef:
                    name: dk-data-secrets
              env:
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_ENABLED
                  value: "true"
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "200m"
                limits:
                  memory: "1Gi"
                  cpu: "500m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: sqlmesh-logs
                  mountPath: /usr/local/lib/python3.11/site-packages/dk_data/sqlmesh/logs
                - name: sqlmesh-cache
                  mountPath: /usr/local/lib/python3.11/site-packages/dk_data/sqlmesh/.cache
          volumes:
            - name: tmp
              emptyDir: {}
            - name: sqlmesh-logs
              emptyDir: {}
            - name: sqlmesh-cache
              emptyDir: {}
