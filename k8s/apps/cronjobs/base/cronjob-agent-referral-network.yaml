# Referral Network Agent CronJob
# 019-cms-puf-platform-reconciliation (T059)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent-referral-network
  labels:
    app: agent-referral-network
    app.kubernetes.io/name: agent-referral-network
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: dk-data
spec:
  schedule: "0 5 1-7 * 1"  # First Monday of month 5:00 AM UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200  # 2 hour timeout
      template:
        metadata:
          labels:
            app: agent-referral-network
            app.kubernetes.io/component: batch-job
            app.kubernetes.io/part-of: dk-data
            team: data-platform
            service: dk-data
            product: dk-data
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
            - name: ghcr-credentials
          containers:
            - name: agent-referral-network
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:main
              command: ["python", "-m", "dk_data.agents.referral_network", "--limit", "50"]
              env:
                - name: POSTGRES_HOST
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_HOST
                - name: POSTGRES_PORT
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_PORT
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_PASSWORD
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_DB
                - name: LITELLM_PROXY_URL
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: LITELLM_PROXY_URL
                - name: LITELLM_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: LITELLM_API_KEY
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: DATABASE_URL
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_ENABLED
                  value: "true"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "1Gi"
                  cpu: "300m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
