# PubChem range-based CronJob — shard 6 (CID 100,000,001–999,999,999)
# Feature: 001-silver-medallion-rebuild / T212
# Splits the full PubChem CID space into 6 weekly shards so that
# each job fits in a 6-hour window and memory stays below 8Gi.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fetch-pubchem-range-6
  labels:
    app: dk-data-ingestion
    component: pubchem-range-6
    feature: "001-silver-medallion-rebuild"
spec:
  schedule: "0 2 * * 6"  # Weekly, staggered by day-of-week
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 21600  # 6h — large range
      template:
        metadata:
          labels:
            app: fetch-pubchem-range-6
            app.kubernetes.io/component: fetcher
            app.kubernetes.io/part-of: dk-data
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: fetch-pubchem-range-6
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:latest
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "Fetching PubChem CID range 100000001-999999999 (shard 6)..."
                  python -m dk_data.ingestion.run --source pubchem \
                    --cid-start 100000001 --cid-end 999999999
                  echo "PubChem range 6 fetch complete."
              envFrom:
                - secretRef:
                    name: dk-data-secrets
              env:
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_SERVICE_NAME
                  value: "dk-data-fetch-pubchem-range-6"
                - name: PUBCHEM_CID_START
                  value: "100000001"
                - name: PUBCHEM_CID_END
                  value: "999999999"
                - name: POSTGRES_HOST_DIRECT
                  value: "postgres-cluster-rw.infra.svc.cluster.local:5432"
              resources:
                requests:
                  memory: "2Gi"
                  cpu: "500m"
                limits:
                  memory: "8Gi"
                  cpu: "2000m"
              volumeMounts:
                - name: data
                  mountPath: /data/raw
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              emptyDir:
                sizeLimit: 10Gi
            - name: tmp
              emptyDir: {}
