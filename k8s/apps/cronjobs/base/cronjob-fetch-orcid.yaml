# ORCID Fetch Weekly CronJob
# 012-platform-hardening
# Fetches researcher profiles from ORCID public API
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fetch-orcid
  labels:
    app: fetch-orcid
    app.kubernetes.io/name: fetch-orcid
    app.kubernetes.io/component: ingestion
    app.kubernetes.io/part-of: dk-data
spec:
  suspend: true  # Disabled — no ORCID membership; OpenAlex covers author data
  schedule: "0 18 * * 0"  # Weekly Sunday 6 PM UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: fetch-orcid
            app.kubernetes.io/component: fetcher
            app.kubernetes.io/part-of: dk-data
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-credentials
          containers:
            - name: fetch-orcid
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:latest
              command: ["python", "-m", "dk_data.ingestion.main"]
              args: ["orcid"]
              envFrom:
                - secretRef:
                    name: dk-data-secrets
              env:
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_ENABLED
                  value: "true"
                - name: POSTGRES_HOST_DIRECT
                  value: "postgresql.infra.svc.cluster.local:5432"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "300m"
