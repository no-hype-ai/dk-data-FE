apiVersion: batch/v1
kind: CronJob
metadata:
  name: fetch-openfda-device-pma
  labels:
    app: dk-data-ingestion
    component: openfda-device-pma
    feature: "fda-devices"
spec:
  schedule: "0 4 8 * *"  # 8th of month 04:00 UTC — 1h after 510k
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 3600  # 1h — PMA corpus ~20K, single paginated scan
      template:
        metadata:
          labels:
            app: fetch-openfda-device-pma
            app.kubernetes.io/component: fetcher
            app.kubernetes.io/part-of: dk-data
            team: data-platform
            service: dk-data
            product: dk-data
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: fetch-openfda-device-pma
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:latest
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "Fetching OpenFDA Device PMA records..."
                  python -m dk_data.ingestion.run --source openfda_device_pma
                  echo "OpenFDA Device PMA fetch complete."
              envFrom:
                - secretRef:
                    name: dk-data-secrets
              env:
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_SERVICE_NAME
                  value: "dk-data-fetch-openfda-device-pma"
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "250m"
                limits:
                  memory: "2Gi"
                  cpu: "500m"
              volumeMounts:
                - name: data
                  mountPath: /data/raw
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              emptyDir:
                sizeLimit: 2Gi
            - name: tmp
              emptyDir: {}
