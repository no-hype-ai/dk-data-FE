# ChEMBL activities per-year CronJob — 2024
# Feature: 001-silver-medallion-rebuild / T211
# Fetches only activities ingested for year 2024, staggered to avoid
# concurrent execution with other year-based fetchers.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fetch-chembl-activities-2024
  labels:
    app: dk-data-ingestion
    component: chembl-activities-2024
    feature: "001-silver-medallion-rebuild"
spec:
  schedule: "0 4 * * 1"  # Weekly, staggered
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 14400  # 4h
      template:
        metadata:
          labels:
            app: fetch-chembl-activities-2024
            app.kubernetes.io/component: fetcher
            app.kubernetes.io/part-of: dk-data
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-credentials
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
            - name: fetch-chembl-activities-2024
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:latest
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "Fetching ChEMBL activity data for year 2024..."
                  python -m dk_data.ingestion.run --source chembl_activities --year 2024
                  echo "ChEMBL activities 2024 fetch complete."
              envFrom:
                - secretRef:
                    name: dk-data-secrets
              env:
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_SERVICE_NAME
                  value: "dk-data-fetch-chembl-activities-2024"
                - name: CHEMBL_YEAR_FILTER
                  value: "2024"
                - name: POSTGRES_HOST_DIRECT
                  value: "postgres-cluster-rw.infra.svc.cluster.local:5432"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "2Gi"
                  cpu: "500m"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
