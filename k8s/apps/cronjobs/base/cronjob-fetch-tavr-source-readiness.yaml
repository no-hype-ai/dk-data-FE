# TAVR Source Readiness — derived classifier
# Phase 1A of edwards-meadow TAVR Benchmark Lab.
# Spec: .dk/specs/007-tavr-source-readiness-provisioning/spec.md
# Migration: 239_tavr_source_readiness.sql
#
# Derived table — reads meta.refresh_log + meta.table_health +
# hcs_gold.tavr_catalog_candidate_manifest in-DB. No upstream HTTPS source.
# Scheduled daily so that freshness signals stay current for tavr-bench.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fetch-tavr-source-readiness
  labels:
    app: fetch-tavr-source-readiness
    app.kubernetes.io/name: fetch-tavr-source-readiness
    app.kubernetes.io/component: ingestion
    app.kubernetes.io/part-of: dk-data
spec:
  schedule: "30 5 * * *"  # Daily 05:30 UTC — after Monday catalog fetch (05:00)
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: fetch-tavr-source-readiness
            app.kubernetes.io/component: fetcher
            app.kubernetes.io/part-of: dk-data
            team: data-platform
            service: dk-data
            product: dk-data
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
            - name: ghcr-credentials
          containers:
            - name: fetch-tavr-source-readiness
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:latest
              command: ["python", "-m", "dk_data.ingestion.main"]
              args: ["tavr_source_readiness"]
              envFrom:
                - secretRef:
                    name: dk-data-secrets
              env:
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_ENABLED
                  value: "true"
                - name: POSTGRES_HOST_DIRECT
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_HOST
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "300m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
