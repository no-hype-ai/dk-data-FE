# OpenAlex CI Fetch CronJob
# 011-datasource-integration
# Fetches pharma-relevant publications from OpenAlex API daily
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fetch-openalex-ci
  labels:
    app: fetch-openalex-ci
    app.kubernetes.io/name: fetch-openalex-ci
    app.kubernetes.io/component: ingestion
    app.kubernetes.io/part-of: dk-data
spec:
  schedule: "30 1 * * *" # Daily 01:30 UTC — overnight before 06:00 transform
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 86400  # 24 hour timeout (full backfill with checkpoint/resume)
      template:
        metadata:
          labels:
            app: fetch-openalex-ci
            app.kubernetes.io/component: fetcher
            app.kubernetes.io/part-of: dk-data
            team: data-platform
            service: dk-data
            product: dk-data
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
            - name: ghcr-credentials
          containers:
            - name: fetch-openalex-ci
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:latest
              command: ["python", "-m", "dk_data.ingestion.main"]
              args: ["openalex_ci"]
              envFrom:
                - secretRef:
                    name: dk-data-secrets
              env:
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://alloy.infra.svc.cluster.local:4317"
                - name: OTEL_ENABLED
                  value: "true"
                - name: POSTGRES_HOST_DIRECT
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: POSTGRES_HOST
                # Per-source credential (Horizon 3 §D.5, issue #319) —
                # OPENALEX_API_KEY is pulled from the dedicated
                # dk-data-secrets-openalex Secret, NOT the monolithic
                # dk-data-secrets. Rotating OpenAlex's key touches this
                # Secret only; no other source is affected. Explicit env
                # overrides any inherited value from envFrom above.
                - name: OPENALEX_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets-openalex
                      key: OPENALEX_API_KEY
                      optional: true
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "100m"
                limits:
                  memory: "1Gi"
                  cpu: "500m"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
