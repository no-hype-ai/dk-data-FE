apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dk-data-metering-proxy
  labels:
    app.kubernetes.io/name: dk-data
    app.kubernetes.io/component: metering-proxy
    release: mimir
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: metering-proxy
  endpoints:
    # /metrics is served by uvicorn on port 3001 (name: proxy).
    # The service also declares port 9090 (name: metrics) but nothing binds to
    # it in the container — uvicorn only listens on --port 3001.
    - port: proxy
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
