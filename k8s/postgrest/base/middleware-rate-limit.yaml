# Rate Limiting Middleware for dk-data-fe
# Feature: 002-production-readiness
# Task: T103
#
# Limits requests to 100/minute per IP to prevent abuse.
# Burst allows temporary spikes for legitimate traffic.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  labels:
    app.kubernetes.io/name: dk-data-fe
    app.kubernetes.io/component: middleware
spec:
  rateLimit:
    average: 100    # 100 requests per minute average
    burst: 50       # Allow burst of 50 additional requests
    period: 1m
    sourceCriterion:
      ipStrategy:
        depth: 1    # Use first X-Forwarded-For IP (behind load balancer)
