# IngressRoute for dk-data-fe PostgREST API
# Feature: 002-production-readiness
# Task: T102
#
# Configures Traefik ingress with TLS, rate limiting, and security headers.
# Domain should be updated in overlay kustomization per environment.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dk-data-fe-api
  labels:
    app.kubernetes.io/name: dk-data-fe
    app.kubernetes.io/component: ingress
spec:
  entryPoints:
    - websecure
  routes:
    # Health endpoint (no auth, no rate limit)
    - match: Host(`api.dk-data-fe.example.com`) && PathPrefix(`/health`)
      kind: Rule
      services:
        - name: postgrest
          port: 3000
      middlewares:
        - name: security-headers

    # Data catalog (public, rate limited)
    - match: Host(`api.dk-data-fe.example.com`) && PathPrefix(`/data_catalog`)
      kind: Rule
      services:
        - name: postgrest
          port: 3000
      middlewares:
        - name: rate-limit
        - name: cors-headers
        - name: security-headers

    # Protected API endpoints (rate limited)
    - match: Host(`api.dk-data-fe.example.com`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: postgrest
          port: 3000
      middlewares:
        - name: rate-limit
        - name: cors-headers
        - name: security-headers
  tls:
    certResolver: letsencrypt
    domains:
      - main: api.dk-data-fe.example.com
