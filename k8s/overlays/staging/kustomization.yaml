apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dk-data-staging

labels:
- pairs:
    environment: staging

# Per-source DopplerSecret CRs (Horizon 3 §D.5). Each CR scopes one key to
# one Doppler config so rotation blast-radius is a single source.
# WS4 SP3 follow-on (feature 211) — staging-only prestaged restore.
# Spec: docs/superpowers/specs/2026-05-19-staging-prestaged-restore-design.md
resources:
- ../../base
- ../../apps/secrets/per-source
- staging-prestaged-restore.yaml

images:
- name: ghcr.io/data-kinetic/dk-data-fe/job-trigger
  newName: ghcr.io/data-kinetic/dk-data-fe/job-trigger
  newTag: staging-a654f16

  # PostgREST — 2 replicas for staging

  # Job-trigger — enabled for staging (T033)

  # PostgREST config overrides for staging

  # DopplerSecret — staging config

  # Molecule Pipeline ConfigMap — staging overrides (lower batch, debug logging)

  # Mol-fetch-daily CronJob — staging schedule (more frequent for testing)

  # Ingress — staging hostname and middleware namespace
# Fix minio-backup-credentials DopplerSecret for staging (base hardcodes config: prd)
# Fix MINIO_ENDPOINT for staging backup CronJobs (base hardcodes infra namespace)
# Per-source DopplerSecrets — staging overlay points each at its `-stg` config.
# Base manifests use the production config name (`drugbank`, `openfda`, ...).
# Horizon 3 §D.5.

# ---------------------------------------------------------------------------
# WS4 SP3 (feature 211) — data created once.
# Staging uses a SEPARATE Postgres (postgresql.infra-staging; see
# docs/PLATFORM_GUIDE.md:490), so to avoid double-fetching every external
# source it consumes prod-produced data via the feature-005 prestaged-
# hydration path (deploy/jobs/prestaged-hydrate.yaml). Therefore suspend
# ONLY the external fetchers (CronJob name ^fetch-*, 112 jobs). All
# transforms / *-gold-* / agents / hydrate / snapshots keep running on the
# prestaged raw data. Staging-overlay ONLY: prod still fetches once.
# Reversible: delete this patch (or flip suspend:false).
# OPERATIONAL PRECONDITION: staging's prestaged-hydration pipeline must be
# provisioned (PRESTAGED_ROOT + prod artifact store) or staging raw data
# goes stale. See specs/211-ws4-staging-main-reconcile/sp3-design.md.
# ---------------------------------------------------------------------------
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: postgrest
    spec:
      replicas: 2
  target:
    kind: Deployment
    name: postgrest
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: job-trigger
    spec:
      replicas: 1
  target:
    kind: Deployment
    name: job-trigger
- patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: postgrest-config
    data:
      PGRST_LOG_LEVEL: "warn"
      PGRST_DB_POOL: "10"
  target:
    kind: ConfigMap
    name: postgrest-config
- patch: |-
    apiVersion: secrets.doppler.com/v1alpha1
    kind: DopplerSecret
    metadata:
      name: dk-data-secrets
    spec:
      config: stg
  target:
    kind: DopplerSecret
    name: dk-data-secrets
- patch: |-
    apiVersion: secrets.doppler.com/v1alpha1
    kind: DopplerSecret
    metadata:
      name: doppler-ghcr
    spec:
      config: stg
  target:
    kind: DopplerSecret
    name: doppler-ghcr
- patch: |-
    apiVersion: secrets.doppler.com/v1alpha1
    kind: DopplerSecret
    metadata:
      name: dk-data-secrets-drugbank
    spec:
      config: drugbank-stg
  target:
    kind: DopplerSecret
    name: dk-data-secrets-drugbank
- patch: |-
    apiVersion: secrets.doppler.com/v1alpha1
    kind: DopplerSecret
    metadata:
      name: dk-data-secrets-openfda
    spec:
      config: openfda-stg
  target:
    kind: DopplerSecret
    name: dk-data-secrets-openfda
- patch: |-
    apiVersion: secrets.doppler.com/v1alpha1
    kind: DopplerSecret
    metadata:
      name: dk-data-secrets-ncbi
    spec:
      config: ncbi-stg
  target:
    kind: DopplerSecret
    name: dk-data-secrets-ncbi
- patch: |-
    apiVersion: secrets.doppler.com/v1alpha1
    kind: DopplerSecret
    metadata:
      name: dk-data-secrets-openalex
    spec:
      config: openalex-stg
  target:
    kind: DopplerSecret
    name: dk-data-secrets-openalex
- patch: |-
    apiVersion: secrets.doppler.com/v1alpha1
    kind: DopplerSecret
    metadata:
      name: dk-data-secrets-uspto
    spec:
      config: uspto-stg
  target:
    kind: DopplerSecret
    name: dk-data-secrets-uspto
- patch: |-
    apiVersion: secrets.doppler.com/v1alpha1
    kind: DopplerSecret
    metadata:
      name: dk-data-secrets-ttd
    spec:
      config: ttd-stg
  target:
    kind: DopplerSecret
    name: dk-data-secrets-ttd
- patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: molecule-pipeline-config
    data:
      BATCH_SIZE: "50"
      LOG_LEVEL: "DEBUG"
  target:
    kind: ConfigMap
    name: molecule-pipeline-config
- patch: |-
    apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: mol-fetch-daily
    spec:
      schedule: "0 */6 * * *"
  target:
    kind: CronJob
    name: mol-fetch-daily
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: data.staging.behaviorlabs.ai
    - op: replace
      path: /spec/tls/0/hosts/0
      value: data.staging.behaviorlabs.ai
    - op: replace
      path: /spec/tls/0/secretName
      value: data-staging-behaviorlabs-ai-tls
    - op: replace
      path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
      value: dk-data-staging-dk-data-rate-limit@kubernetescrd
  target:
    kind: Ingress
    name: dk-data-api
- patch: |-
    apiVersion: secrets.doppler.com/v1alpha1
    kind: DopplerSecret
    metadata:
      name: minio-backup-credentials
    spec:
      config: stg
  target:
    kind: DopplerSecret
    name: minio-backup-credentials
- patch: |-
    - op: replace
      path: /spec/jobTemplate/spec/template/spec/containers/0/env/5/value
      value: "minio.infra-staging.svc.cluster.local:9000"
  target:
    kind: CronJob
    name: pg-backup-daily
- patch: |-
    - op: replace
      path: /spec/jobTemplate/spec/template/spec/containers/0/env/5/value
      value: "minio.infra-staging.svc.cluster.local:9000"
  target:
    kind: CronJob
    name: pg-backup-weekly
- patch: |-
    apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: ignored-matched-by-target-regex
    spec:
      suspend: true
  target:
    kind: CronJob
    name: ^fetch-.*
