apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dk-data-staging

labels:
- pairs:
    environment: staging

resources:
- ../../base

images:
- name: ghcr.io/data-kinetic/dk-data-fe/job-trigger
  newName: ghcr.io/data-kinetic/dk-data-fe/job-trigger
  newTag: staging-d7f1412

  # PostgREST — 2 replicas for staging

  # Job-trigger — enabled for staging (T033)

  # PostgREST config overrides for staging

  # DopplerSecret — staging config

  # Molecule Pipeline ConfigMap — staging overrides (lower batch, debug logging)

  # Mol-fetch-daily CronJob — staging schedule (more frequent for testing)

  # Ingress — staging hostname and middleware namespace
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: postgrest
    spec:
      replicas: 2
  target:
    kind: Deployment
    name: postgrest
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: job-trigger
    spec:
      replicas: 1
  target:
    kind: Deployment
    name: job-trigger
- patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: postgrest-config
    data:
      PGRST_LOG_LEVEL: "warn"
      PGRST_DB_POOL: "10"
  target:
    kind: ConfigMap
    name: postgrest-config
- patch: |-
    apiVersion: secrets.doppler.com/v1alpha1
    kind: DopplerSecret
    metadata:
      name: dk-data-secrets
    spec:
      config: stg
  target:
    kind: DopplerSecret
    name: dk-data-secrets
- patch: |-
    apiVersion: secrets.doppler.com/v1alpha1
    kind: DopplerSecret
    metadata:
      name: doppler-ghcr
    spec:
      config: stg
  target:
    kind: DopplerSecret
    name: doppler-ghcr
- patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: molecule-pipeline-config
    data:
      BATCH_SIZE: "50"
      LOG_LEVEL: "DEBUG"
  target:
    kind: ConfigMap
    name: molecule-pipeline-config
- patch: |-
    apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: mol-fetch-daily
    spec:
      schedule: "0 */6 * * *"
  target:
    kind: CronJob
    name: mol-fetch-daily
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: data.staging.behaviorlabs.ai
    - op: replace
      path: /spec/tls/0/hosts/0
      value: data.staging.behaviorlabs.ai
    - op: replace
      path: /spec/tls/0/secretName
      value: data-staging-behaviorlabs-ai-tls
    - op: replace
      path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
      value: dk-data-staging-dk-data-rate-limit@kubernetescrd
  target:
    kind: Ingress
    name: dk-data-api
