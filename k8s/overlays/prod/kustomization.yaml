apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dk-data-prod

labels:
  - pairs:
      environment: production
    includeSelectors: false

resources:
  - ../../base

patches:
  # PostgREST — 3 replicas for HA with production resources
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: postgrest
      spec:
        replicas: 3
        template:
          spec:
            containers:
              - name: postgrest
                resources:
                  requests:
                    memory: "256Mi"
                    cpu: "200m"
                  limits:
                    memory: "1Gi"
                    cpu: "1000m"
    target:
      kind: Deployment
      name: postgrest

  # Job Trigger — 2 replicas for availability
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: job-trigger
      spec:
        replicas: 2
        template:
          spec:
            containers:
              - name: job-trigger
                resources:
                  requests:
                    memory: "128Mi"
                    cpu: "100m"
                  limits:
                    memory: "512Mi"
                    cpu: "500m"
    target:
      kind: Deployment
      name: job-trigger

  # PostgREST config overrides for production
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: postgrest-config
      data:
        PGRST_LOG_LEVEL: "error"
        PGRST_DB_POOL: "20"
        PGRST_DB_POOL_ACQUISITION_TIMEOUT: "30"
    target:
      kind: ConfigMap
      name: postgrest-config
