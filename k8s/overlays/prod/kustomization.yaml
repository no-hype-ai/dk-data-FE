apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dk-data-prod

labels:
- pairs:
    environment: production

resources:
- ../../base

images:
- name: ghcr.io/data-kinetic/dk-data-fe/job-trigger
  newName: ghcr.io/data-kinetic/dk-data-fe/job-trigger
  newTag: prod-9722d19

  # PostgREST — 3 replicas for HA with production resources

  # Job Trigger — 2 replicas for production

  # PostgREST config overrides for production

  # Molecule Pipeline ConfigMap — production settings

  # Mol-transform CronJob — production resources (higher memory for gold aggregation)
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: postgrest
    spec:
      replicas: 3
      template:
        spec:
          containers:
            - name: postgrest
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "200m"
                limits:
                  memory: "1Gi"
                  cpu: "1000m"
  target:
    kind: Deployment
    name: postgrest
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: job-trigger
    spec:
      replicas: 2
      template:
        spec:
          containers:
            - name: job-trigger
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
  target:
    kind: Deployment
    name: job-trigger
- patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: postgrest-config
    data:
      PGRST_LOG_LEVEL: "error"
      PGRST_DB_POOL: "20"
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: "30"
  target:
    kind: ConfigMap
    name: postgrest-config
- patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: molecule-pipeline-config
    data:
      BATCH_SIZE: "200"
      LOG_LEVEL: "INFO"
  target:
    kind: ConfigMap
    name: molecule-pipeline-config
