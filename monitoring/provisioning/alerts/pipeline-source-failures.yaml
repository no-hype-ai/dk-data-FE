      # ── Generic CMS Bulk Source Failure Alert (template-style comment) ────────
      # The remaining 25 CMS PUF sources follow the identical pattern as
      # cms_part_d_spending and cms_part_b_spending above.
      # To add an alert for any source, copy a rule block above and replace:
      #   - uid: pipeline-fail-{source_name_hyphenated}
      #   - title: "Pipeline: {source_name} — 3 consecutive failures"
      #   - labels.source_name: {source_name}
      #   - WHERE ds.source_name = '{source_name}'
      #
      # Full list of remaining CMS PUF sources needing individual rules:
      # cms_nppes, cms_inpatient_puf, cms_physician_puf, cms_hospital_general_info,
      # cms_medicare_advantage, cms_medicaid_drug_spending, cms_dme_puf,
