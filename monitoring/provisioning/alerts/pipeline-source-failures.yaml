      # cms_geographic_variation, cms_chronic_conditions, cms_dual_eligible,
      # cms_enrollment_puf, cms_claim_type_puf, cms_utilization_puf, cms_cost_reports_puf
      #
      # These CMS PUF sources are file-based (requires_file: True) and only fail
      # if an uploaded file is malformed or the loader throws an exception.
      # Individual alerts for these low-signal sources can be added in a follow-up
      # when the ops team establishes per-source SLOs.
