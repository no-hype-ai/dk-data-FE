apiVersion: 1
# Grafana Alert: Pipeline Source Failures
# Feature: 019-cms-puf-platform-reconciliation (T054)
#
# Alert fires when a source has 3 consecutive failures in meta.refresh_log.
# One rule per source_id, labeled with source_name for routing.
# Routes to existing notification policy per FR-034 and SC-013.
#
# Datasource: PostgreSQL (dk-data database)
# Evaluation interval: 1h (refresh_log is written after each ingestion run)

groups:
  - orgId: 1
    name: pipeline-source-failures
    folder: dk-data
    interval: 1h
    rules:

      # ── CMS Part D Drug Spending ──────────────────────────────────────────────
      - uid: pipeline-fail-cms-part-d-spending
        title: "Pipeline: cms_part_d_spending — 3 consecutive failures"
        condition: C
        labels:
          source_name: cms_part_d_spending
          severity: warning
          team: data-platform
        annotations:
          summary: "cms_part_d_spending has failed 3 consecutive ingestion runs"
          runbook: "Check CMS data.gov for file availability; verify loader logs in Loki"
        data:
          - refId: A
            relativeTimeRange: { from: 259200, to: 0 }
            datasourceUid: postgresql
            model:
              rawSql: |
                SELECT COUNT(*) as consecutive_failures
                FROM (
                    SELECT status
                    FROM meta.refresh_log rl
                    JOIN meta.data_sources ds ON ds.source_id = rl.source_id
                    WHERE ds.source_name = 'cms_part_d_spending'
                    ORDER BY rl.refreshed_at DESC
                    LIMIT 3
                ) recent
                WHERE status = 'failed'
              format: table
          - refId: B
            relativeTimeRange: { from: 259200, to: 0 }
            datasourceUid: __expr__
            model:
              expression: A
              type: reduce
              reducer: last
          - refId: C
            relativeTimeRange: { from: 259200, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [3], type: gte }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
              expression: B
              type: threshold

