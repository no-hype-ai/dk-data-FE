# Grafana Provisioning: Data Platform Folder & Plugin
#
# Feature: 017-grafana-datasource-dashboard
#
# This file documents the Grafana-side configuration required to support
# the datasource-health.json dashboard. Apply these settings to the
# dk-alchemy Grafana deployment (Helm values or Grafana Operator CR).
#
# ─────────────────────────────────────────────────────────────────────
# 1. Plugin: netsage-sankey-panel (required for Medallion Flow panel)
# ─────────────────────────────────────────────────────────────────────
#
# In Grafana Helm values or Grafana Operator CR env section:
#
#   env:
#     GF_INSTALL_PLUGINS: "netsage-sankey-panel"
#
# Verify after Grafana pod restart:
#   curl http://localhost:3000/api/plugins/netsage-sankey-panel | jq '.name'
#
# NOTE: Requires Grafana pod restart. Coordinate with platform team.
#
# ─────────────────────────────────────────────────────────────────────
# 2. Folder: "Data Platform" (required for dashboard routing)
# ─────────────────────────────────────────────────────────────────────
#
# The sidecar provisioner creates the folder automatically from
# __metadata.folder in the dashboard JSON. No additional config needed
# unless explicit team access control is required.
#
# If team-based access control is needed, add a Grafana Org/Team
# provisioning entry (via Grafana API or grafana-operator FolderBinding):
#
#   folder: Data Platform
#   teamAccess:
#     - teamName: data-platform
#       permission: Viewer
#
# ─────────────────────────────────────────────────────────────────────
# 3. Dashboard provisioner (sidecar — verify existing config)
# ─────────────────────────────────────────────────────────────────────
#
# The Grafana sidecar must be configured to watch the monitoring/dashboards/
# directory. Confirm the sidecar ConfigMap or Helm values include:
#
#   sidecar:
#     dashboards:
#       enabled: true
#       searchNamespace: ALL   # or specific namespace
#       label: grafana_dashboard
#       folderAnnotation: k8s-sidecar-target-directory
#
# Dashboard JSONs must be included in a ConfigMap with the label
# grafana_dashboard: "1" for the sidecar to pick them up.
