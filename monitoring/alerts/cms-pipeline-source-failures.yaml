      # New detail-grain sources (086 additions)
      - alert: CMSPhysicianPUFServicesFailed
        expr: cms_source_health_status{source="cms_physician_puf_services"} == 0
        for: 1h
        labels:
          severity: warning
          source: cms_physician_puf_services
          team: data-platform
        annotations:
          summary: "CMS Physician PUF Services (HCPCS grain) ingestion failed"
          description: "cms_physician_puf_services health status is error. Required by equipment_inventory agent."

      - alert: CMSCostReportsPUFLinesFailed
        expr: cms_source_health_status{source="cms_cost_reports_puf_lines"} == 0
        for: 1h
        labels:
          severity: warning
          source: cms_cost_reports_puf_lines
          team: data-platform
        annotations:
          summary: "CMS Cost Reports PUF Lines (staffing grain) ingestion failed"
          description: "cms_cost_reports_puf_lines health status is error. Required by staffing_decomposition agent."

      # Entity linking sources (020-entity-linking-gaps additions)
      - alert: CMSPartDPrescriberFailed
        # Annual file: released by CMS each January. Staleness window is 400d to
        # accommodate CMS release timing variation (typically Jan but can slip).
        # cms_source_health_status is set by record_cms_source_sync() in the loader.
        expr: |
          absent_over_time(
            cms_source_health_status{source="cms_part_d_prescriber"}[400d]
          ) == 1 or cms_source_health_status{source="cms_part_d_prescriber"} == 0
        for: 2h
        labels:
          severity: warning
          source: cms_part_d_prescriber
          team: data-platform
        annotations:
          summary: "CMS Part D Prescribers ingestion failed or not loaded this year"
          description: "cms_part_d_prescriber has not been successfully loaded. This is an annual file — check CMS release schedule and file staging."

      # HCS Silver Agent Quality Alerts
      - alert: HCSAgentHighQuarantineRate
        # cms_agent_records_quarantined_total is a Counter incremented by record_agent_run()
        # in observability/metrics.py for every quarantined record.
        # Agent names follow the pattern hcs_<name> (e.g. hcs_drug_market, hcs_service_lines).
        expr: |
          sum(increase(cms_agent_records_quarantined_total{agent_name=~"hcs_.*"}[7d])) > 500
        for: 30m
        labels:
          severity: warning
          team: data-platform
        annotations:
          summary: "HCS agents quarantining >500 records in 7 days"
          description: "High quarantine rate for HCS silver agents. Check agent prompts and source data quality."

      - alert: HCSAgentStale
        # cms_source_last_sync_timestamp is set by record_cms_source_sync() in
        # observability/metrics.py on every successful HCS source sync.
        # 720 hours = 30 days.
        expr: |
          (
            time() - max(cms_source_last_sync_timestamp{source=~"hcs_.*"})
          ) / 3600 > 720
          or absent(cms_source_last_sync_timestamp{source=~"hcs_.*"})
        for: 1h
        labels:
          severity: warning
          team: data-platform
        annotations:
          summary: "HCS silver tables not refreshed in 30 days"
          description: "No hcs_* source has been synced in 30+ days. Check agent CronJobs."
