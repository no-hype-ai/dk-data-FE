# Alert Rules: CMS PUF Pipeline Source Failures
# Features: 019-cms-puf-platform-reconciliation, 020-entity-linking-gaps
# Monitors all 29 CMS PUF data sources for consecutive failures
# via cms_source_health_status Prometheus metric.
#
# Severity guide:
#   warning  — bulk file sources (expected to be file-provided, may legitimately skip)
#   critical — API-driven or high-priority sources

groups:
  - name: cms_puf_pipeline_failures
    rules:

      # Core 7 CMS PUF sources
      - alert: CMSPartDSpendingFailed
        expr: |
          absent_over_time(
            cms_source_health_status{source="cms_part_d_spending"}[90d]
          ) == 1 or cms_source_health_status{source="cms_part_d_spending"} == 0
        for: 1h
        labels:
          severity: warning
          source: cms_part_d_spending
          team: data-platform
        annotations:
          summary: "CMS Part D Spending ingestion has not succeeded in 90 days"
          description: "No successful refresh for cms_part_d_spending in 90 days. Check file availability and upload process."
          runbook_url: "https://github.com/data-kinetic/dk-data-FE/blob/main/docs/runbooks/cms-puf-ingestion.md"

      - alert: CMSPartBSpendingFailed
        expr: |
          absent_over_time(
            cms_source_health_status{source="cms_part_b_spending"}[90d]
          ) == 1 or cms_source_health_status{source="cms_part_b_spending"} == 0
        for: 1h
        labels:
          severity: warning
          source: cms_part_b_spending
          team: data-platform
        annotations:
          summary: "CMS Part B Spending ingestion failed or stale"
          description: "cms_part_b_spending health status is error or absent. Verify source file."

      - alert: CMSOpenPaymentsFailed
        expr: cms_source_health_status{source="cms_open_payments"} == 0
        for: 1h
        labels:
          severity: warning
          source: cms_open_payments
          team: data-platform
        annotations:
          summary: "CMS Open Payments ingestion failed"
          description: "cms_open_payments health status is error. Check file upload."

      - alert: CMSNPPESFailed
        expr: cms_source_health_status{source="cms_nppes"} == 0
        for: 1h
        labels:
          severity: critical
          source: cms_nppes
          team: data-platform
        annotations:
          summary: "CMS NPPES (NPI Registry) ingestion failed"
          description: "cms_nppes health status is error. NPPES is critical for provider identity linking."

      - alert: CMSInpatientPUFFailed
        expr: cms_source_health_status{source="cms_inpatient_puf"} == 0
        for: 1h
        labels:
          severity: warning
          source: cms_inpatient_puf
          team: data-platform
        annotations:
          summary: "CMS Inpatient PUF ingestion failed"
          description: "cms_inpatient_puf health status is error. Check file upload."

      - alert: CMSPhysicianPUFFailed
        expr: cms_source_health_status{source="cms_physician_puf"} == 0
        for: 1h
        labels:
          severity: warning
          source: cms_physician_puf
          team: data-platform
        annotations:
          summary: "CMS Physician PUF ingestion failed"
          description: "cms_physician_puf health status is error."

      - alert: CMSHospitalGeneralInfoFailed
        expr: cms_source_health_status{source="cms_hospital_general_info"} == 0
        for: 1h
        labels:
          severity: warning
          source: cms_hospital_general_info
          team: data-platform
        annotations:
          summary: "CMS Hospital General Info ingestion failed"
          description: "cms_hospital_general_info health status is error."

