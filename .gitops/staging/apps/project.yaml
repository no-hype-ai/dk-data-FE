# AppProject is defined in prod/apps/project.yaml with consolidated destinations
# This file is kept for reference but the project.yaml in prod contains both namespaces
# To avoid duplicate resource errors in ArgoCD, staging references the consolidated project
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dk-data
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: dk-data platform deployment (production and staging)

  sourceRepos:
    - https://github.com/data-kinetic/dk-data-fe.git

  # Consolidated destinations for both environments
  destinations:
    - namespace: dk-data-prod
      server: https://kubernetes.default.svc
    - namespace: dk-data-staging
      server: https://kubernetes.default.svc
    # Staging on k3s-slave-1 (009-infra-evolution Phase 6)
    - namespace: dk-data-staging
      server: https://10.0.0.12:6443

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  orphanedResources:
    warn: true
