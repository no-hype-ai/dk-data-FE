apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dk-data-staging
  namespace: argocd
  labels:
    tenant: dk-data
    environment: staging
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dk-data

  source:
    repoURL: https://github.com/data-kinetic/dk-data-fe.git
    targetRevision: staging
    path: k8s/overlays/staging

  destination:
    server: https://10.0.0.12:6443
    namespace: dk-data-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    # Doppler operator adds defaults (host, processors, verifyTLS) and
    # strips tokenSecret.key, causing perpetual OutOfSync
    - group: secrets.doppler.com
      kind: DopplerSecret
      jqPathExpressions:
        - .spec.host
        - .spec.processors
        - .spec.verifyTLS
        - .spec.tokenSecret.key
