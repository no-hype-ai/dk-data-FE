# Job Trigger Service Deployment
# Feature: 002-production-readiness
# Tasks: T030, T067
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-trigger
  labels:
    app: job-trigger
    app.kubernetes.io/name: job-trigger
    app.kubernetes.io/component: ingestion
    app.kubernetes.io/part-of: dk-data-fe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-trigger
  template:
    metadata:
      labels:
        app: job-trigger
        app.kubernetes.io/name: job-trigger
        app.kubernetes.io/part-of: dk-data-fe
    spec:
      serviceAccountName: job-trigger
      containers:
        - name: job-trigger
          image: dk-data-fe-job-trigger:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            # Database credentials from Doppler
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: dk-data-fe-secrets
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: dk-data-fe-secrets
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: dk-data-fe-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dk-data-fe-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: dk-data-fe-secrets
                  key: POSTGRES_DB
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # OpenTelemetry configuration (T067)
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "alloy.monitoring:4317"
            - name: OTEL_ENABLED
              value: "true"
            - name: SERVICE_VERSION
              value: "1.0.0"
            - name: ENVIRONMENT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
# ServiceAccount for job-trigger to create K8s Jobs
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-trigger
  labels:
    app: job-trigger
    app.kubernetes.io/part-of: dk-data-fe
---
# Role for creating jobs in namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-creator
rules:
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-trigger-can-create-jobs
subjects:
  - kind: ServiceAccount
    name: job-trigger
roleRef:
  kind: Role
  name: job-creator
  apiGroup: rbac.authorization.k8s.io
