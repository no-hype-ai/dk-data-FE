# Job Trigger Service
# Feature: 001-data-layer-postgrest-gitops
# Task: T031
apiVersion: v1
kind: Service
metadata:
  name: job-trigger
  namespace: tavr-data
  labels:
    app: job-trigger
    app.kubernetes.io/name: job-trigger
