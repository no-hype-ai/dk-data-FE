# CronJob for refreshing catalog metadata
# Feature: 001-data-layer-postgrest-gitops
# Task: T029
apiVersion: batch/v1
kind: CronJob
metadata:
  name: catalog-refresh
  namespace: tavr-data
  labels:
    app: catalog-refresh
    app.kubernetes.io/name: catalog-refresh
    app.kubernetes.io/component: catalog
    app.kubernetes.io/part-of: tavr-data-platform
spec:
  schedule: "0 6 * * *"  # Daily at 6 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600  # 10 minute timeout
      template:
        metadata:
          labels:
            app: catalog-refresh
        spec:
          restartPolicy: OnFailure
          containers:
            - name: catalog-refresh
              image: tavr-data-ingestion:latest
              command:
                - python
                - scripts/catalog_refresh.py
              env:
                - name: POSTGRES_HOST
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: host
                - name: POSTGRES_PORT
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: port
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: username
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: password
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: database
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
