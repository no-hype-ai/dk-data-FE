# PostgREST Deployment
# Feature: 001-data-layer-postgrest-gitops
# Task: T024
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
  namespace: tavr-data
  labels:
    app: postgrest
    app.kubernetes.io/name: postgrest
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: tavr-data-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgrest
  template:
    metadata:
      labels:
        app: postgrest
        app.kubernetes.io/name: postgrest
    spec:
      containers:
        - name: postgrest
          image: postgrest/postgrest:v12.0.2
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: postgrest-config
            - secretRef:
                name: postgrest-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
