# PostgREST Secrets (template - values should be replaced via Kustomize secretGenerator or external secrets)
# Feature: 001-data-layer-postgrest-gitops
# Tasks: T026, T054
apiVersion: v1
kind: Secret
metadata:
  name: postgrest-secrets
  namespace: tavr-data
  labels:
    app: postgrest
    app.kubernetes.io/name: postgrest
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: tavr-data-platform
type: Opaque
stringData:
  # Database connection string - REPLACE IN OVERLAYS
  # Format: postgres://authenticator:PASSWORD@HOST:PORT/DATABASE
  PGRST_DB_URI: "postgres://authenticator:changeme@postgres:5432/edwards_tavr"
  # T054: JWT secret for role-based access
  # Generate a secure secret: openssl rand -base64 32
  # JWT payload format: {"role": "analyst", "exp": <timestamp>}
  # Available roles: web_anon (anonymous), analyst (extended), api_user (full read)
  PGRST_JWT_SECRET: "REPLACE_WITH_SECURE_SECRET_IN_PRODUCTION"
  # Role claim location in JWT token
  PGRST_JWT_ROLE_CLAIM_KEY: ".role"
