# PostgREST Secrets Reference
# Feature: 002-production-readiness
# Tasks: T016, T017
#
# IMPORTANT: This file is now DEPRECATED for production use.
# Secrets are managed via Doppler and synced to dk-data-fe-secrets.
#
# For local development only, use environment variables or .env files.
# This file is kept for documentation purposes.
#
# Required secrets in dk-data-fe-secrets (from Doppler):
#   - POSTGRES_HOST: Database hostname
#   - POSTGRES_PORT: Database port (default: 5432)
#   - POSTGRES_USER: Database user (authenticator role)
#   - POSTGRES_PASSWORD: Database password
#   - POSTGRES_DB: Database name (edwards_tavr)
#   - PGRST_JWT_SECRET: JWT signing secret (256-bit minimum)
#
# The deployment now references dk-data-fe-secrets instead of this file.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgrest-secrets-documentation
  labels:
    app.kubernetes.io/name: postgrest
    app.kubernetes.io/component: documentation
data:
  README: |
    PostgREST secrets are now managed via Doppler.

    The DopplerSecret CRD syncs secrets from Doppler to the
    'dk-data-fe-secrets' Kubernetes Secret.

    Required Doppler secrets:
    - POSTGRES_HOST
    - POSTGRES_PORT
    - POSTGRES_USER
    - POSTGRES_PASSWORD
    - POSTGRES_DB
    - PGRST_JWT_SECRET

    See .gitops/base/secrets/doppler-secret.yaml for configuration.
