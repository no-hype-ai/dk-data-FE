# Kustomize Base Configuration
# Feature: 002-production-readiness
# Tasks: T015, T066
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dk-data-fe-prod

labels:
  - pairs:
      app.kubernetes.io/part-of: dk-data-fe
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  # Secrets (Doppler integration)
  - secrets/doppler-secret.yaml
  - secrets/doppler-token.yaml
  # Observability (metrics, alerts)
  - observability/service-monitor.yaml
  - observability/alert-rules.yaml
  # PostgREST API
  - postgrest/deployment.yaml
  - postgrest/service.yaml
  - postgrest/configmap.yaml
  # Note: postgrest/secret.yaml removed - secrets now come from DopplerSecret
  # Batch Jobs (ingestion)
  - ingestion/cronjob-cms-all.yaml
  # Catalog refresh
  - catalog/cronjob-refresh.yaml
  # Job trigger service
  - ingestion/job-trigger-deployment.yaml
  - ingestion/job-trigger-service.yaml

images:
  - name: postgrest/postgrest
    newTag: v12.0.2
