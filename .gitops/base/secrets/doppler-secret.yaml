# DopplerSecret for dk-data-fe
# Feature: 002-production-readiness
# Task: T013
#
# Synchronizes secrets from Doppler to Kubernetes.
# Required secrets in Doppler project 'dk-infrastructure':
#   - POSTGRES_HOST, POSTGRES_PORT, POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   - PGRST_JWT_SECRET (256-bit minimum)
#   - ANTHROPIC_API_KEY (optional, for enrichment service)
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: dk-data-fe-secrets
  labels:
    app.kubernetes.io/name: dk-data-fe
    app.kubernetes.io/component: secrets
    app.kubernetes.io/managed-by: doppler-operator
spec:
  # Reference to the Doppler service token
  tokenSecret:
    name: doppler-token-dk-data-fe
    key: serviceToken
  # Doppler project and config
  project: dk-infrastructure
  config: prod  # Overridden in staging/dev overlays
  # Target Kubernetes Secret
  managedSecret:
    name: dk-data-fe-secrets
    type: Opaque
  # Resync interval for secret rotation support (5 minutes)
  resyncSeconds: 300
