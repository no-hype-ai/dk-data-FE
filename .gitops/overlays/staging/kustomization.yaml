# Staging Environment Overlay
# Feature: 001-data-layer-postgrest-gitops
# Task: T033
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tavr-data-staging

namePrefix: staging-

labels:
  - pairs:
      environment: staging
    includeSelectors: false

resources:
  - ../../base

# Staging-specific patches
patches:
  # 2 replicas for staging
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: postgrest

  # Override PostgREST config for staging
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: postgrest-config
      data:
        PGRST_LOG_LEVEL: "warn"
        PGRST_DB_POOL: "10"
    target:
      kind: ConfigMap
      name: postgrest-config

  # Override secrets for staging (use external secrets in real deployments)
  - patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: postgrest-secrets
      stringData:
        PGRST_DB_URI: "postgres://authenticator:staging_password@postgres:5432/edwards_tavr_staging"
        PGRST_JWT_SECRET: "staging-jwt-secret-replace-me"
    target:
      kind: Secret
      name: postgrest-secrets
