# Staging Environment Overlay
# Feature: 002-production-readiness
# Task: T033
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dk-data-fe-staging

namePrefix: staging-

labels:
  - pairs:
      environment: staging
    includeSelectors: false

resources:
  - ../../base

# Staging-specific patches
patches:
  # 2 replicas for staging
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: postgrest

  # Override PostgREST config for staging
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: postgrest-config
      data:
        PGRST_LOG_LEVEL: "warn"
        PGRST_DB_POOL: "10"
    target:
      kind: ConfigMap
      name: postgrest-config

  # Override DopplerSecret config for staging
  - patch: |-
      apiVersion: secrets.doppler.com/v1alpha1
      kind: DopplerSecret
      metadata:
        name: dk-data-fe-secrets
      spec:
        config: stg
    target:
      kind: DopplerSecret
      name: dk-data-fe-secrets
