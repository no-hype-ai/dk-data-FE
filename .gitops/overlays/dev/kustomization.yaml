# Dev Environment Overlay
# Feature: 001-data-layer-postgrest-gitops
# Task: T032
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tavr-data-dev

namePrefix: dev-

labels:
  - pairs:
      environment: dev
    includeSelectors: false

resources:
  - ../../base

# Dev-specific patches
patches:
  # Reduce resource requirements for dev
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "200m"
    target:
      kind: Deployment
      name: postgrest

  # Override PostgREST config for dev
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: postgrest-config
      data:
        PGRST_LOG_LEVEL: "debug"
        PGRST_DB_POOL: "5"
    target:
      kind: ConfigMap
      name: postgrest-config

  # Override secrets for dev (use external secrets in real deployments)
  - patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: postgrest-secrets
      stringData:
        PGRST_DB_URI: "postgres://authenticator:dev_password@postgres:5432/edwards_tavr_dev"
        PGRST_JWT_SECRET: "dev-jwt-secret-not-for-production"
    target:
      kind: Secret
      name: postgrest-secrets
