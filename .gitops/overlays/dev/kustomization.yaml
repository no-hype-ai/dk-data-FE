# Dev Environment Overlay
# Feature: 002-production-readiness
# Task: T032
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dk-data-fe-dev

namePrefix: dev-

labels:
  - pairs:
      environment: dev
    includeSelectors: false

resources:
  - ../../base

# Dev-specific patches
patches:
  # Reduce resource requirements for dev
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "200m"
    target:
      kind: Deployment
      name: postgrest

  # Override PostgREST config for dev
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: postgrest-config
      data:
        PGRST_LOG_LEVEL: "debug"
        PGRST_DB_POOL: "5"
    target:
      kind: ConfigMap
      name: postgrest-config

  # Override DopplerSecret config for dev
  - patch: |-
      apiVersion: secrets.doppler.com/v1alpha1
      kind: DopplerSecret
      metadata:
        name: dk-data-fe-secrets
      spec:
        config: dev
    target:
      kind: DopplerSecret
      name: dk-data-fe-secrets
