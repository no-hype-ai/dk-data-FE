# Production Environment Overlay
# Feature: 001-data-layer-postgrest-gitops
# Task: T034
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tavr-data-prod

namePrefix: prod-

labels:
  - pairs:
      environment: prod
    includeSelectors: false

resources:
  - ../../base

patches:
  # PostgREST - 3 replicas for HA with production resources
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: postgrest
      spec:
        replicas: 3
        template:
          spec:
            containers:
              - name: postgrest
                resources:
                  requests:
                    memory: "256Mi"
                    cpu: "200m"
                  limits:
                    memory: "1Gi"
                    cpu: "1000m"
    target:
      kind: Deployment
      name: postgrest

  # Job Trigger - 2 replicas for availability
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: job-trigger
      spec:
        replicas: 2
        template:
          spec:
            containers:
              - name: job-trigger
                resources:
                  requests:
                    memory: "128Mi"
                    cpu: "100m"
                  limits:
                    memory: "512Mi"
                    cpu: "500m"
    target:
      kind: Deployment
      name: job-trigger

  # Override PostgREST config for production
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: postgrest-config
      data:
        PGRST_LOG_LEVEL: "error"
        PGRST_DB_POOL: "20"
        PGRST_DB_POOL_ACQUISITION_TIMEOUT: "30"
    target:
      kind: ConfigMap
      name: postgrest-config

  # Production secrets - MUST be replaced via external secrets manager
  # These are placeholders only - DO NOT use in production
  - patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: postgrest-secrets
      stringData:
        PGRST_DB_URI: "postgres://authenticator:REPLACE_VIA_EXTERNAL_SECRETS@postgres:5432/edwards_tavr"
        PGRST_JWT_SECRET: "REPLACE_VIA_EXTERNAL_SECRETS"
    target:
      kind: Secret
      name: postgrest-secrets
