# Production Replicas Patch
# Feature: 001-data-layer-postgrest-gitops
# Task: T035
#
# Increases replicas for production high availability

# PostgREST - 3 replicas for HA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: postgrest
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
# Job Trigger - 2 replicas for availability
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-trigger
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: job-trigger
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
