apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dk-data-recording-rules
  labels:
    app.kubernetes.io/name: dk-data
    app.kubernetes.io/component: recording-rules
    prometheus: mimir
spec:
  groups:
    - name: dk-data.datasource-dashboard
      interval: 5m
      limit: 200   # cap series per rule; 26 sources × ~4 label combos = well under limit
      rules:
        # Ingestion volume per source — used in stacked area chart (30-day range)
        - record: job:dk_pipeline_records_processed:rate5m
          expr: |
            rate(dk_pipeline_records_processed_total[5m])

        # Fetch duration p95 per source — used in fetch duration trend panel (30-day range)
        - record: job:dk_pipeline_duration_seconds_p95:5m
          expr: |
            histogram_quantile(0.95,
              sum by (source, le) (
                rate(dk_pipeline_duration_seconds_bucket[5m])
              )
            )

        # Fetch duration p50 per source — used in fetch duration trend panel (30-day range)
        - record: job:dk_pipeline_duration_seconds_p50:5m
          expr: |
            histogram_quantile(0.50,
              sum by (source, le) (
                rate(dk_pipeline_duration_seconds_bucket[5m])
              )
            )

        # Storage size per source — used in storage growth trend panel (30-day range)
        # last_over_time handles the gauge's sparse emit cadence (per-run, not fixed interval)
        - record: job:dk_data_source_table_size_bytes:last
          expr: |
            last_over_time(dk_data_source_table_size_bytes[10m])
