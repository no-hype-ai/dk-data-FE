openapi: 3.1.0
info:
  title: DK Molecule Data Platform - Pipeline API
  version: 1.0.0
  description: |
    REST API for data pipeline management, monitoring, and entity resolution.
    Provides visibility into Raw → Bronze → Silver → Gold processing.

servers:
  - url: /api/v1
    description: Production API

security:
  - bearerAuth: []

paths:
  /pipeline/status:
    get:
      summary: Get pipeline status
      description: Overview of all pipeline stages and their health
      operationId: getPipelineStatus
      tags:
        - Pipeline
      responses:
        '200':
          description: Pipeline status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineStatus'

  /pipeline/sources:
    get:
      summary: List data sources
      description: Get status of all configured data sources
      operationId: listDataSources
      tags:
        - Data Sources
      responses:
        '200':
          description: Data source list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataSource'

  /pipeline/sources/{source_name}:
    get:
      summary: Get data source details
      description: Detailed status for a specific data source
      operationId: getDataSource
      tags:
        - Data Sources
      parameters:
        - name: source_name
          in: path
          required: true
          schema:
            type: string
            enum: [drugbank, chembl, pubchem, clinicaltrials, openfda_faers, openfda_labels, uniprot, pdb, sider, openalex]
      responses:
        '200':
          description: Data source details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceDetail'

  /pipeline/sources/{source_name}/sync:
    post:
      summary: Trigger source sync
      description: Manually trigger a sync for this data source
      operationId: triggerSourceSync
      tags:
        - Data Sources
      security:
        - bearerAuth: []
      parameters:
        - name: source_name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                full_refresh:
                  type: boolean
                  default: false
                  description: Force full refresh instead of incremental
      responses:
        '202':
          description: Sync job started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJob'
        '429':
          description: Sync already in progress

  /pipeline/jobs:
    get:
      summary: List pipeline jobs
      description: Get history of pipeline execution jobs
      operationId: listPipelineJobs
      tags:
        - Pipeline Jobs
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, completed, failed]
        - name: source
          in: query
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PipelineJob'

  /pipeline/jobs/{job_id}:
    get:
      summary: Get job details
      description: Detailed status of a specific pipeline job
      operationId: getJobDetails
      tags:
        - Pipeline Jobs
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineJobDetail'

  /pipeline/resolution/queue:
    get:
      summary: Get resolution queue
      description: List molecules pending manual resolution review
      operationId: getResolutionQueue
      tags:
        - Entity Resolution
      parameters:
        - name: confidence_max
          in: query
          description: Maximum confidence score to include
          schema:
            type: number
            default: 0.8
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Resolution queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_pending:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResolutionCandidate'

  /pipeline/resolution/queue/{inchi_key}:
    put:
      summary: Resolve molecule mapping
      description: Approve or reject a pending entity resolution
      operationId: resolveMapping
      tags:
        - Entity Resolution
      parameters:
        - name: inchi_key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [approve, reject, merge]
                merge_target:
                  type: string
                  description: InChI Key to merge into (if action=merge)
                notes:
                  type: string
              required:
                - action
      responses:
        '200':
          description: Resolution applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  affected_records:
                    type: integer

  /pipeline/quality:
    get:
      summary: Get data quality summary
      description: Overview of data quality metrics across all sources
      operationId: getQualitySummary
      tags:
        - Data Quality
      responses:
        '200':
          description: Quality summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualitySummary'

  /pipeline/quality/issues:
    get:
      summary: List quality issues
      description: Get list of detected data quality issues
      operationId: listQualityIssues
      tags:
        - Data Quality
      parameters:
        - name: severity
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: source
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [open, acknowledged, resolved]
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Quality issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QualityIssue'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 1000
    offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0

  schemas:
    PipelineStatus:
      type: object
      properties:
        overall_health:
          type: string
          enum: [healthy, degraded, unhealthy]
        layers:
          type: object
          properties:
            raw:
              $ref: '#/components/schemas/LayerStatus'
            bronze:
              $ref: '#/components/schemas/LayerStatus'
            silver:
              $ref: '#/components/schemas/LayerStatus'
            gold:
              $ref: '#/components/schemas/LayerStatus'
        last_full_sync:
          type: string
          format: date-time
        next_scheduled_sync:
          type: string
          format: date-time
        active_jobs:
          type: integer
        pending_resolutions:
          type: integer

    LayerStatus:
      type: object
      properties:
        record_count:
          type: integer
        last_updated:
          type: string
          format: date-time
        health:
          type: string
          enum: [healthy, stale, error]

    DataSource:
      type: object
      properties:
        name:
          type: string
        display_name:
          type: string
        status:
          type: string
          enum: [active, syncing, error, disabled]
        record_count:
          type: integer
        last_sync:
          type: string
          format: date-time
        next_sync:
          type: string
          format: date-time
        refresh_schedule:
          type: string
          enum: [daily, weekly, monthly]

    DataSourceDetail:
      allOf:
        - $ref: '#/components/schemas/DataSource'
        - type: object
          properties:
            api_endpoint:
              type: string
            rate_limit:
              type: string
            sync_history:
              type: array
              items:
                type: object
                properties:
                  timestamp:
                    type: string
                    format: date-time
                  records_added:
                    type: integer
                  records_updated:
                    type: integer
                  duration_seconds:
                    type: integer
            schema_version:
              type: string
            last_external_update:
              type: string
              format: date-time

    SyncJob:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
        source:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        started_at:
          type: string
          format: date-time

    PipelineJob:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [sync, transform, resolution, quality_check]
        source:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        records_processed:
          type: integer

    PipelineJobDetail:
      allOf:
        - $ref: '#/components/schemas/PipelineJob'
        - type: object
          properties:
            stages:
              type: array
              items:
                type: object
                properties:
                  stage:
                    type: string
                  status:
                    type: string
                  started_at:
                    type: string
                    format: date-time
                  completed_at:
                    type: string
                    format: date-time
                  records_in:
                    type: integer
                  records_out:
                    type: integer
                  errors:
                    type: integer
            error_log:
              type: array
              items:
                type: string

    ResolutionCandidate:
      type: object
      properties:
        inchi_key:
          type: string
        candidate_names:
          type: array
          items:
            type: string
        source_identifiers:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
              identifier:
                type: string
        confidence_score:
          type: number
        potential_matches:
          type: array
          items:
            type: object
            properties:
              inchi_key:
                type: string
              name:
                type: string
              similarity:
                type: number
        created_at:
          type: string
          format: date-time

    QualitySummary:
      type: object
      properties:
        overall_score:
          type: number
          minimum: 0
          maximum: 100
        completeness:
          type: number
        accuracy:
          type: number
        consistency:
          type: number
        timeliness:
          type: number
        issues_by_severity:
          type: object
          properties:
            critical:
              type: integer
            high:
              type: integer
            medium:
              type: integer
            low:
              type: integer
        sources:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              quality_score:
                type: number
              open_issues:
                type: integer

    QualityIssue:
      type: object
      properties:
        issue_id:
          type: string
          format: uuid
        severity:
          type: string
          enum: [low, medium, high, critical]
        category:
          type: string
          enum: [missing_data, invalid_format, duplicate, inconsistent, stale]
        source:
          type: string
        description:
          type: string
        affected_records:
          type: integer
        sample_records:
          type: array
          items:
            type: string
        detected_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [open, acknowledged, resolved]
