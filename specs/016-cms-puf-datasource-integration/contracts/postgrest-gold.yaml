# PostgREST Gold Schema Contracts: CMS PUF Data Source Integration
# 5 gold-layer views exposed via PostgREST
# Schema: gold | Auth: analyst/api_user JWT | Base: /gold/
# Revised: 2026-03-11

# ============================================================================
# 1. Provider Profile (360-degree view)
# ============================================================================

gold.cms_provider_360:
  description: |
    Aggregated provider profile combining NPPES demographics, Part D prescribing,
    Physician PUF procedures, Open Payments, and agent-enriched network data.
  primary_key: npi
  access: [analyst, api_user]

  columns:
    # Identity
    npi: { type: text, description: "10-digit NPI" }
    entity_type: { type: text, description: "individual or organization" }
    name_display: { type: text, description: "Formatted display name" }
    credential: { type: text }
    specialty_primary: { type: text }
    specialty_secondary: { type: "text[]" }
    practice_state: { type: text }
    practice_city: { type: text }
    practice_zip: { type: text }

    # Prescribing (aggregated from Part D)
    total_rx_claims: { type: integer, description: "Total Part D claims across all drugs" }
    total_rx_cost: { type: numeric, description: "Total Part D drug cost" }
    unique_drugs_prescribed: { type: integer }
    top_drugs: { type: jsonb, description: "Top 10 drugs by claim count [{drug_name, claims, cost}]" }

    # Procedures (aggregated from Physician PUF)
    total_services: { type: numeric, description: "Total line service count" }
    total_beneficiaries: { type: integer }
    total_medicare_payment: { type: numeric }
    top_procedures: { type: jsonb, description: "Top 10 HCPCS by volume [{hcpcs, description, count}]" }

    # Payments (aggregated from Open Payments)
    total_general_payments: { type: numeric }
    total_research_payments: { type: numeric }
    payment_count: { type: integer }
    top_payers: { type: jsonb, description: "Top 5 payers [{name, amount}]" }

    # Network (agent-enriched)
    referral_count: { type: integer, description: "Number of inferred referral edges" }
    network_centrality: { type: numeric, description: "Degree centrality in referral network" }

    # Metadata
    data_year: { type: integer, description: "Most recent data year" }
    last_refreshed: { type: timestamptz }

  example_queries:
    - description: "Look up provider by NPI"
      url: "/gold.cms_provider_360?npi=eq.1234567890"
    - description: "Find high-prescribing providers in CA"
      url: "/gold.cms_provider_360?practice_state=eq.CA&total_rx_claims=gte.10000&order=total_rx_claims.desc&limit=50"
    - description: "Providers by specialty"
      url: "/gold.cms_provider_360?specialty_primary=eq.Cardiology&order=total_services.desc"

# ============================================================================
# 2. Facility Profile (360-degree view)
# ============================================================================

gold.cms_facility_360:
  description: |
    Aggregated facility profile combining POS, Hospital Quality, HCRIS cost data,
    and agent-enriched service lines, staffing, and equipment.
  primary_key: ccn
  access: [analyst, api_user]

  columns:
    # Identity
    ccn: { type: text, description: "6-char CMS Certification Number" }
    facility_name: { type: text }
    facility_type: { type: text }
    state: { type: text }
    county: { type: text }
    city: { type: text }
    bed_count: { type: integer }
    ownership_type: { type: text }

    # Quality
    star_rating: { type: integer, description: "CMS overall star rating (1-5)" }
    mortality_score: { type: numeric }
    readmission_score: { type: numeric }
    patient_experience_score: { type: numeric }
    safety_score: { type: numeric }

    # Cost (from HCRIS)
    total_operating_cost: { type: numeric }
    cost_per_discharge: { type: numeric }
    case_mix_index: { type: numeric }

    # Service Lines (agent-enriched)
    service_lines: { type: jsonb, description: "Inferred service lines [{name, drg_count, volume}]" }

    # Staffing (agent-enriched)
    staffing_profile: { type: jsonb, description: "Decomposed staffing [{category, fte, cost}]" }

    # Equipment (agent-enriched)
    equipment_inventory: { type: jsonb, description: "Inferred equipment [{category, procedure_count}]" }

    # System Affiliation (agent-enriched)
    health_system_name: { type: text }
    health_system_id: { type: text }

    # Metadata
    data_year: { type: integer }
    last_refreshed: { type: timestamptz }

  example_queries:
    - description: "Look up facility by CCN"
      url: "/gold.cms_facility_360?ccn=eq.050001"
    - description: "5-star hospitals in Texas"
      url: "/gold.cms_facility_360?state=eq.TX&star_rating=eq.5&order=bed_count.desc"
    - description: "Facilities by health system"
      url: "/gold.cms_facility_360?health_system_name=eq.HCA Healthcare"

# ============================================================================
# 3. Drug Market Profile
# ============================================================================

gold.cms_drug_market_profile:
  description: |
    Drug-level market data combining NDC directory, Medicare spending,
    formulary coverage, and therapeutic classification.
  primary_key: ndc
  access: [analyst, api_user]

  columns:
    ndc: { type: text, description: "11-digit NDC" }
    drug_name: { type: text }
    generic_name: { type: text }
    labeler_name: { type: text }
    route: { type: text }
    dosage_form: { type: text }
    part_d_total_spending: { type: numeric }
    part_d_total_claims: { type: integer }
    part_d_avg_cost_per_claim: { type: numeric }
    part_b_total_spending: { type: numeric }
    formulary_coverage_pct: { type: numeric, description: "% of Part D plans covering this drug" }
    rbcs_category: { type: text, description: "RBCS therapeutic category" }
    usp_category: { type: text, description: "USP drug classification" }
    data_year: { type: integer }
    last_refreshed: { type: timestamptz }

  example_queries:
    - description: "Look up drug by NDC"
      url: "/gold.cms_drug_market_profile?ndc=eq.00002-7510-01"
    - description: "Top Part D drugs by spending"
      url: "/gold.cms_drug_market_profile?order=part_d_total_spending.desc&limit=50"
    - description: "Drugs in a therapeutic category"
      url: "/gold.cms_drug_market_profile?rbcs_category=eq.Immunology"

# ============================================================================
# 4. Market Analytics (Geographic + Population)
# ============================================================================

gold.cms_market_analytics:
  description: |
    Geographic and population-level analytics combining CMS Geographic Variation,
    Chronic Conditions, and Post-Acute Care PUFs.
  primary_key: [state, county]
  access: [analyst, api_user]

  columns:
    state: { type: text }
    county: { type: text }
    fips_code: { type: text }
    total_beneficiaries: { type: integer }
    per_capita_spending: { type: numeric }
    diabetes_prevalence: { type: numeric }
    heart_failure_prevalence: { type: numeric }
    copd_prevalence: { type: numeric }
    depression_prevalence: { type: numeric }
    alzheimers_prevalence: { type: numeric }
    snf_episodes: { type: integer, description: "Skilled nursing facility episodes" }
    hha_episodes: { type: integer, description: "Home health agency episodes" }
    irf_episodes: { type: integer, description: "Inpatient rehab facility episodes" }
    hospice_episodes: { type: integer }
    dmepos_spending: { type: numeric, description: "Durable medical equipment spending" }
    data_year: { type: integer }
    last_refreshed: { type: timestamptz }

  example_queries:
    - description: "Market analytics by state"
      url: "/gold.cms_market_analytics?state=eq.CA&order=per_capita_spending.desc"
    - description: "Counties with high diabetes prevalence"
      url: "/gold.cms_market_analytics?diabetes_prevalence=gte.0.3&order=total_beneficiaries.desc"
    - description: "Post-acute utilization in Florida"
      url: "/gold.cms_market_analytics?state=eq.FL&select=county,snf_episodes,hha_episodes,hospice_episodes"

# ============================================================================
# 5. Provider Network (Referral Edges)
# ============================================================================

gold.cms_provider_network:
  description: |
    Inferred provider-to-provider relationships from shared patient analysis.
    Agent-enriched from Physician PUF co-occurrence data.
  primary_key: [source_npi, target_npi]
  access: [analyst, api_user]

  columns:
    source_npi: { type: text }
    target_npi: { type: text }
    relationship_type: { type: text, description: "referral, shared_patient, co_practice" }
    strength_score: { type: numeric, description: "0.0-1.0 relationship strength" }
    shared_patient_count: { type: integer }
    source_specialty: { type: text }
    target_specialty: { type: text }
    confidence_score: { type: numeric, description: "Agent confidence 0.0-1.0" }
    data_year: { type: integer }
    last_refreshed: { type: timestamptz }

  example_queries:
    - description: "Referral network for a provider"
      url: "/gold.cms_provider_network?source_npi=eq.1234567890&order=strength_score.desc"
    - description: "Strong cardiologist-to-surgeon referrals"
      url: "/gold.cms_provider_network?source_specialty=eq.Cardiology&target_specialty=eq.Cardiac Surgery&strength_score=gte.0.7"
