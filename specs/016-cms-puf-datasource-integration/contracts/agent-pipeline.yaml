# Agent Pipeline Contracts: CMS PUF Data Source Integration
# 6 Silver+ enrichment agents — LLM calls via LiteLLM (OpenAI-compatible client)
# Execution: K8s Jobs triggered monthly
# Revised: 2026-03-11

# ============================================================================
# Common Infrastructure
# ============================================================================

base_agent:
  description: |
    Abstract base class for all Silver+ enrichment agents.
    All LLM calls go through LiteLLM proxy (OpenAI-compatible client).
    Direct Anthropic SDK usage is forbidden per dk-canon.

  llm_config:
    client: openai.OpenAI  # OpenAI-compatible Python client
    base_url: "${LITELLM_BASE_URL}"  # Doppler-managed
    api_key: "${LITELLM_API_KEY}"    # Doppler-managed
    model: "haiku"  # LiteLLM alias — not a provider model ID
    temperature: 0.1
    response_format: json_object

  execution:
    trigger: k8s_job  # Not BullMQ (Python-only repo)
    schedule: monthly  # K8s CronJob: cronjob-agents-monthly.yaml
    retry: backoffLimit=3, restartPolicy=OnFailure
    monitoring: meta.agent_execution_log (append-only)

  validation_tiers:
    auto_accept: { min_confidence: 0.8, action: "Write to silver table" }
    needs_review: { min_confidence: 0.5, max_confidence: 0.79, action: "Write with needs_review flag" }
    quarantine: { max_confidence: 0.49, action: "Write to meta.agent_quarantine" }

  output_schema:
    enriched: "list[dict] — records to write to silver table"
    quarantine: "list[dict] — low-confidence records for review"
    execution_log:
      agent_name: str
      agent_version: str
      started_at: datetime
      completed_at: datetime
      status: "RUNNING | COMPLETED | FAILED"
      records_input: int
      records_enriched: int
      records_quarantined: int
      error_message: "str | None"
      model_used: str  # LiteLLM alias
      cost_usd: float

# ============================================================================
# Agent 1: ServiceLineInference
# ============================================================================

service_line_inference:
  description: |
    Maps DRG codes to clinical service lines. Requires medical domain knowledge
    that cannot be expressed in SQL joins or lookup tables.
  input:
    source: bronze.cms_inpatient_puf
    columns: [drg_code, drg_description, total_discharges]
    batch_size: 100  # DRG codes per LLM call
  output:
    target: silver.ref_drg_service_line
    columns:
      drg_code: { type: text, pk: true }
      drg_description: { type: text }
      service_line: { type: text, description: "Inferred service line name" }
      confidence_score: { type: numeric }
      agent_version: { type: text }
  prompt_template: |
    Given these DRG codes and descriptions, classify each into a clinical service line.
    Return JSON array: [{"drg_code": "...", "service_line": "...", "confidence": 0.0-1.0}]
    Valid service lines: Cardiology, Orthopedics, Neurology, Oncology, General Surgery,
    Pulmonology, Gastroenterology, Urology, OB/GYN, Pediatrics, Psychiatry,
    Rehabilitation, Trauma, Transplant, Other.

# ============================================================================
# Agent 2: IDNHierarchy
# ============================================================================

idn_hierarchy:
  description: |
    Infers Integrated Delivery Network (IDN) hierarchies from PECOS enrollment
    and CHOW ownership change data. No single source provides the full structure.
  input:
    sources:
      - { table: bronze.cms_pecos, columns: [enrollment_id, organization_name, org_npi, state] }
      - { table: bronze.cms_chow, columns: [ccn, previous_owner, new_owner, effective_date] }
    batch_size: 50  # organizations per LLM call
  output:
    target: silver.cms_health_system_hierarchy
    columns:
      system_id: { type: text, pk: true, description: "Agent-generated UUID" }
      system_name: { type: text }
      parent_system_id: { type: text, fk: "self-referential" }
      member_ccns: { type: "text[]" }
      hierarchy_level: { type: integer, description: "0=top-level system" }
      confidence_score: { type: numeric }
      agent_version: { type: text }
  prompt_template: |
    Given PECOS enrollment records and CHOW ownership changes, determine the
    organizational hierarchy. Group facilities by common ownership and infer
    parent-child relationships. Return JSON with system structure and confidence.

# ============================================================================
# Agent 3: ReferralNetwork
# ============================================================================

referral_network:
  description: |
    Infers provider-to-provider referral relationships from shared patient
    patterns in the Physician PUF. Co-occurrence of patients between providers
    suggests referral or collaborative care relationships.
  input:
    source: bronze.cms_physician_puf
    columns: [npi, hcpcs_code, bene_unique_cnt, place_of_service]
    batch_size: 200  # provider pairs per LLM call
  output:
    target: silver.cms_referral_edges
    columns:
      source_npi: { type: text, pk: true }
      target_npi: { type: text, pk: true }
      relationship_type: { type: text, description: "referral, shared_patient, co_practice" }
      strength_score: { type: numeric }
      shared_patient_count: { type: integer }
      confidence_score: { type: numeric }
      agent_version: { type: text }
  prompt_template: |
    Given co-occurrence patterns between providers (same HCPCS codes, overlapping
    patient populations, shared place of service), classify the relationship type
    and estimate strength. Return JSON array of edges with confidence scores.

# ============================================================================
# Agent 4: ContactVerification
# ============================================================================

contact_verification:
  description: |
    Validates and normalizes contact information (phone, address) from NPPES.
    Identifies likely outdated, disconnected, or misformatted entries.
  input:
    source: bronze.cms_nppes
    columns: [npi, phone, practice_address, mailing_address]
    batch_size: 500  # records per LLM call
  output:
    target: silver.cms_verified_contacts
    columns:
      npi: { type: text, pk: true }
      phone_normalized: { type: text }
      phone_valid: { type: boolean }
      address_normalized: { type: jsonb }
      address_valid: { type: boolean }
      geocode_state: { type: text }
      geocode_zip: { type: text }
      confidence_score: { type: numeric }
      agent_version: { type: text }
  prompt_template: |
    Validate and normalize these contact records. Check phone format (US 10-digit),
    address completeness, and flag likely invalid entries. Return JSON with
    normalized values and validity flags.

# ============================================================================
# Agent 5: StaffingDecomposition
# ============================================================================

staffing_decomposition:
  description: |
    Parses HCRIS (Healthcare Cost Report Information System) cost report line items
    to extract staffing patterns. HCRIS data is semi-structured with varying
    line item formats that resist pure SQL extraction.
  input:
    source: bronze.cms_hcris
    columns: [ccn, worksheet, line_number, column_number, value]
    batch_size: 20  # facilities per LLM call (HCRIS is complex)
  output:
    target: silver.cms_staffing_profiles
    columns:
      ccn: { type: text, pk: true }
      staffing_category: { type: text, description: "Nursing, Physician, Admin, Tech, Support" }
      fte_count: { type: numeric }
      salary_cost: { type: numeric }
      benefits_cost: { type: numeric }
      contract_labor_cost: { type: numeric }
      confidence_score: { type: numeric }
      agent_version: { type: text }
  prompt_template: |
    Parse these HCRIS cost report line items for facility {ccn}. Extract staffing
    categories with FTE counts and costs. Worksheets S-3 (revenue), A (cost),
    and A-6 (reclassification) contain staffing data. Return structured JSON.

# ============================================================================
# Agent 6: EquipmentInventoryInference
# ============================================================================

equipment_inventory_inference:
  description: |
    Infers equipment inventory from HCPCS procedure codes in the Outpatient PUF.
    Certain procedures require specific equipment (e.g., CT scans require CT
    scanners). Maps procedure patterns to likely equipment.
  input:
    source: bronze.cms_outpatient_puf
    columns: [ccn, hcpcs_code, hcpcs_description, total_services]
    batch_size: 50  # facilities per LLM call
  output:
    target: silver.cms_equipment_inventory
    columns:
      ccn: { type: text, pk: true }
      equipment_category: { type: text, description: "Imaging, Surgical, Lab, Cardiac, etc." }
      equipment_type: { type: text, description: "CT Scanner, MRI, Cath Lab, etc." }
      evidence_hcpcs: { type: "text[]", description: "HCPCS codes that imply this equipment" }
      volume_indicator: { type: text, description: "high, medium, low based on service count" }
      confidence_score: { type: numeric }
      agent_version: { type: text }

    # Also writes to reference table
    ref_output:
      target: silver.ref_hcpcs_equipment
      columns:
        hcpcs_code: { type: text, pk: true }
        hcpcs_description: { type: text }
        equipment_category: { type: text }
        confidence_score: { type: numeric }

  prompt_template: |
    Given outpatient procedure volumes for facility {ccn}, infer the equipment
    inventory. Map HCPCS codes to equipment categories. For example:
    - 70553 (MRI brain) → MRI Scanner
    - 71260 (CT chest) → CT Scanner
    - 93458 (cardiac cath) → Cardiac Catheterization Lab
    Return JSON with equipment list, supporting HCPCS codes, and confidence.
