  auth: none

cms-open-payments-search:
  name: cms-open-payments-search
  description: "Query CMS Open Payments by physician NPI or company name"
  tier: provider_claims
  raw_table: cms_open_payments
  raw_schema: raw
  adapter_module: dk_data.services.mcp.adapters.cms_open_payments
  api_base_url: "https://openpaymentsdata.cms.gov/api/1/datastore/query/{id}"
  input_schema:
    type: object
    properties:
      npi:
        type: string
        pattern: "^\\d{10}$"
      company_name:
        type: string
      year:
        type: integer
    anyOf:
      - required: [npi]
      - required: [company_name]
  output_schema:
    type: object
    properties:
      results:
        type: array
        items:
          type: object
          properties:
            record_id: { type: string }
            npi: { type: string }
            payment_type: { type: string, enum: [general, research, ownership] }
            payer_name: { type: string }
            amount: { type: number }
            nature_of_payment: { type: string }
            date_of_payment: { type: string, format: date }
            dispute_status: { type: string, nullable: true }
      aggregate:
        type: object
        properties:
          total_amount: { type: number }
          total_records: { type: integer }
          by_type: { type: object }
  rate_limit: "5 req/s"
  auth: none

cms-care-compare-search:
  name: cms-care-compare-search
  description: "Query CMS Care Compare provider-level quality data"
  tier: provider_claims
  raw_table: cms_care_compare
  raw_schema: raw
  adapter_module: dk_data.services.mcp.adapters.cms_care_compare
  api_base_url: "https://data.cms.gov/provider-data/api/1/datastore/query/{id}"
