# MCP Tool Contracts: CMS PUF Data Source Integration
# OpenAPI-style tool definitions for ~30 new MCP tools
# Follows existing ToolDefinition pattern from tool_registry.py

# ============================================================================
# Tier 4: Provider & Claims
# ============================================================================

cms-nppes-search:
  name: cms-nppes-search
  description: "Search the CMS NPPES National Provider Registry by NPI, name, or state"
  tier: provider_claims
  raw_table: cms_nppes
  raw_schema: raw
  adapter_module: dk_data.services.mcp.adapters.nppes
  api_base_url: "https://npiregistry.cms.hhs.gov/api/"
  input_schema:
    type: object
    properties:
      npi:
        type: string
        description: "10-digit National Provider Identifier"
        pattern: "^\\d{10}$"
      first_name:
        type: string
        description: "Provider first name (prefix match)"
      last_name:
        type: string
        description: "Provider last name (prefix match)"
      state:
        type: string
        description: "2-letter state code"
        pattern: "^[A-Z]{2}$"
      entity_type:
        type: string
        enum: ["individual", "organization"]
    anyOf:
      - required: [npi]
      - required: [last_name]
  output_schema:
    type: object
    properties:
      results:
        type: array
        items:
          type: object
          properties:
            npi: { type: string }
            entity_type: { type: string }
            provider_name: { type: string }
            credential: { type: string }
            specialty: { type: string }
            address: { type: object }
            phone: { type: string }
            enumeration_date: { type: string, format: date }
            deactivation_date: { type: string, format: date, nullable: true }
      result_count: { type: integer }
  rate_limit: "10 req/s (no auth)"
  auth: none

cms-partd-prescribers-search:
  name: cms-partd-prescribers-search
  description: "Query CMS Part D Prescriber PUF by NPI or drug name"
  tier: provider_claims
  raw_table: cms_part_d_prescribers
  raw_schema: raw
  adapter_module: dk_data.services.mcp.adapters.cms_partd_prescribers
  api_base_url: "https://data.cms.gov/data-api/v1/dataset/{id}/data"
  input_schema:
    type: object
    properties:
      npi:
        type: string
        pattern: "^\\d{10}$"
      drug_name:
        type: string
        description: "Generic drug name"
      year:
        type: integer
        minimum: 2013
        maximum: 2024
    anyOf:
      - required: [npi]
      - required: [drug_name]
  output_schema:
    type: object
    properties:
      results:
        type: array
        items:
          type: object
          properties:
            npi: { type: string }
            drug_name: { type: string }
            generic_name: { type: string }
            total_claims: { type: integer }
            total_drug_cost: { type: number }
            beneficiary_count: { type: integer }
            total_30day_fills: { type: number }
            year: { type: integer }
            suppressed: { type: boolean }
  rate_limit: "5 req/s (Socrata)"
  auth: none

cms-partd-prescribers-summary-search:
  name: cms-partd-prescribers-summary-search
  description: "Query CMS Part D Provider Summary PUF by NPI"
  tier: provider_claims
  raw_table: cms_part_d_prescribers_summary
  raw_schema: raw
  adapter_module: dk_data.services.mcp.adapters.cms_partd_prescribers_summary
