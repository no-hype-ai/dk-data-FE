cms-physician-puf-summary-search:
  name: cms-physician-puf-summary-search
  description: "Query CMS Physician/Supplier Provider Summary PUF by NPI"
  tier: provider_claims
  raw_table: cms_physician_puf_summary
  raw_schema: raw
  adapter_module: dk_data.services.mcp.adapters.cms_physician_puf_summary
  api_base_url: "https://data.cms.gov/data-api/v1/dataset/{id}/data"
  input_schema:
