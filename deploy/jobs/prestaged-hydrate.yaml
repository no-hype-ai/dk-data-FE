apiVersion: batch/v1
kind: Job
metadata:
  name: prestaged-hydrate-<date>
  namespace: dk-data-prod
  labels:
    app: prestaged-hydrate
    app.kubernetes.io/name: prestaged-hydrate
    app.kubernetes.io/part-of: dk-data
    feature: 005-prestaged-hydration
    product: dk-data
    service: dk-data
    team: data-platform
spec:
  # B.2 — Job-level resilience
  # SC-002 target is <4h, so activeDeadlineSeconds = 14400 (4h hard cap).
  activeDeadlineSeconds: 14400
  # backoffLimit: 3 relies on the per-(schema,table) idempotency of
  # `meta.transform_runs.details->>'run_label'` (added by migration 229).
  # A retried attempt re-runs only the steps that didn't already succeed
  # under the current run_label, so three attempts are safe.
  backoffLimit: 3
  ttlSecondsAfterFinished: 604800   # 7 days — keeps the Pod around for forensics
  template:
    metadata:
      labels:
        app: prestaged-hydrate
        app.kubernetes.io/name: prestaged-hydrate
        app.kubernetes.io/part-of: dk-data
        feature: 005-prestaged-hydration
        product: dk-data
        service: dk-data
        team: data-platform
    spec:
      # OnFailure lets the Pod itself restart the container in-place before
      # Job-level retry kicks in; loader is idempotent via run_label.
      restartPolicy: OnFailure
      # B.1 — priority class already provisioned by dk-alchemy
      # (k8s/infrastructure/priority-classes/, value 1,000,000).
      priorityClassName: production-critical
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-credentials
      # B.1 + B.10 — node placement
      #
      # Two nodeSelectorTerms (OR semantics). Either term satisfies scheduling:
      #   1. `dk.role In (general)` — preferred, aligns with the dk-alchemy
      #      §2 node taxonomy (penguin=control, krang=general, scarecrow=bulk).
      #   2. `kubernetes.io/hostname NotIn (k3s-master-1)` — fallback for the
      #      window where retroactive `dk.role` labels aren't yet applied
      #      (dk-alchemy Phase 3 issue #651). Ensures we never land on the
      #      control-plane node (penguin) which is what caused the
      #      DiskPressure / CNPG eviction incident (obs 2482, 2541, 2608).
      #
      # Once #651 is resolved and `dk.role` is present on every node, the
      # fallback term becomes redundant and can be removed.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: dk.role
                    operator: In
                    values: [general]
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [k3s-master-1]
      # Today `dk.role=general` resolves to krang (k3s-slave-1), which carries
      # the `nvidia.com/gpu=true:NoSchedule` taint. We don't use the GPU, but
      # we must tolerate the taint to be schedulable there.
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      initContainers:
        # B.2 — DB connectivity precheck before the loader opens a dump file.
        # Pattern adapted from k8s/apps/infrastructure/base/db-migrate-job.yaml:
        # 5-attempt psycopg2.connect loop with 3s backoff. Fails fast if the
        # writer path is down and avoids wasting loader attempts.
        - name: db-connectivity-wait
          image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for i in 1 2 3 4 5; do
                python -c "import psycopg2,os,sys; psycopg2.connect(host=os.environ.get('POSTGRES_HOST_DIRECT', os.environ['POSTGRES_HOST']), port=os.environ.get('POSTGRES_PORT','5432'), user=os.environ['POSTGRES_USER'], password=os.environ['POSTGRES_PASSWORD'], database=os.environ['POSTGRES_DB']).close(); sys.exit(0)" 2>/dev/null && echo "[db-connectivity-wait] DB reachable on attempt $i" && exit 0
                echo "[db-connectivity-wait] DB unreachable (attempt $i/5); sleeping 3s"
                sleep 3
              done
              echo "[db-connectivity-wait] DB still unreachable after 5 attempts; failing" >&2
              exit 1
          env:
            # Prefer the direct CNPG primary for connectivity check
            # (PgBouncer may be healthy while primary is not).
            - name: POSTGRES_HOST_DIRECT
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_HOST
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: hydrate
          # Image must include postgresql-client-16 (pg_restore) + dk_data pkg.
          image: ghcr.io/data-kinetic/dk-data:prod-<sha>
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "dk_data.ingestion.prestaged", "--source-list", "all"]
          env:
            - name: PRESTAGED_ROOT
              value: /data/prestaged
            # PG_URL is assembled from dk-data-secrets (DopplerSecret-managed);
            # no cluster DNS hardcoded here — hostname injection stays in Doppler.
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: dk-data-secrets
                  key: POSTGRES_DB
            - name: WAL_PAUSE_HIGH_PCT
              value: "70"
            - name: WAL_PAUSE_LOW_PCT
              value: "40"
          # B.1 — Resource budget.
          # CPU requests bumped off the 10m scheduling-hack value used in the
          # -17-slave repair manifest (obs 2527–2534 — 10m thrashes QoS).
          # ephemeral-storage caps let the kubelet evict *this Pod* if it
          # overruns, instead of filling the node and tainting it with
          # DiskPressure (which is what evicted CNPG on 2026-04-15).
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 5Gi
            limits:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 20Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: prestaged
              mountPath: /data/prestaged
              readOnly: true
      volumes:
        - name: prestaged
          # Interim: hostPath on a non-control-plane node. Horizon 2 (C.1)
          # replaces this with an S3/SeaweedFS-backed initContainer pull into
          # a `local-path-bulk` scratch PVC — hostPath is a pinning anti-pattern.
          hostPath:
            path: /opt/dk-data-prestaged
            type: Directory
          # After SeaweedFS cutover:
          # persistentVolumeClaim:
          #   claimName: prestaged-dk-data
