apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingest-who-ghed
  namespace: dk-data-prod
  labels:
    app: dk-data-ingestion
    source: who-ghed
    domain: hcs
  annotations:
    description: |
      Annual refresh of WHO Global Health Expenditure Database.
      WHO GHED publishes updated country-level expenditure data annually
      (typically Q4). Schedule: Jan 15 03:00 UTC.
spec:
  schedule: "0 3 15 1 *"          # 03:00 UTC on Jan 15 — annual
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: ingest
              image: ghcr.io/data-kinetic/dk-data-fe/job-trigger:main-937c9f6
              command:
                - python
                - -m
                - dk_data.ingestion.main
                - --source
                - who_ghed
              env:
                - name: PG_URL
                  valueFrom:
                    secretKeyRef:
                      name: dk-data-secrets
                      key: url
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
