# deploy/hydrate/sources.yaml
#
# Horizon 3 / plan §D.1 — source registry for the per-source Job fan-out.
#
# This file is the INPUT to ``scripts/render_hydrate_jobs.py`` which emits one
# ``k8s/apps/hydrate/base/job-hydrate-<name>.yaml`` Job manifest per entry, and
# is also read by ``src/dk_data/ingestion/hydrate_dispatcher.py`` to know which
# Job name to apply for each source it dispatches.
#
# Entries are kept in 1-1 correspondence with
# ``src/dk_data/ingestion/load_order.py:SOURCE_LOAD_ORDER``. The dispatcher
# itself reads SOURCE_LOAD_ORDER at runtime for the tier / depends_on graph;
# this file only exists so the renderer + ArgoCD have a plain-YAML surface to
# iterate and render over (ArgoCD can't execute Python).
#
# When SOURCE_LOAD_ORDER changes:
#   1. Edit src/dk_data/ingestion/load_order.py.
#   2. Run ``python scripts/render_hydrate_jobs.py --sync`` — it regenerates
#      this file from SOURCE_LOAD_ORDER *and* re-emits the per-source Job
#      manifests. Renderer is idempotent; re-runs overwrite.
#
# Fields
# ------
# name         kebab-case Job name suffix. Used in ``hydrate-<name>-<date>``.
# source_id    canonical ``"{schema}.{table}"`` key (matches SOURCE_LOAD_ORDER).
# schema       target PG schema.
# table        target PG relation.
# tier         1..8 matching SOURCE_LOAD_ORDER (D.1 tier graph).
# depends_on   list of upstream source_ids (defaults to []).
# sla_seconds  activeDeadlineSeconds for the rendered Job. Defaults to 14400 (4h).
#
# Drift protection: every change lands via ArgoCD sync, never direct kubectl.

