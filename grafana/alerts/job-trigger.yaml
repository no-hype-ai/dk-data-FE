apiVersion: 1
groups:
  - orgId: 1
    name: dk-data-job-trigger
    folder: dk-data
    interval: 1m
    rules:
      - uid: dk-data-job-trigger-high-error-rate
        title: "job-trigger high error rate"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                sum(rate(http_server_request_duration_seconds_count{service="job-trigger",
                product="dk-data", http_status_code=~"5.."}[5m]))
                /
                sum(rate(http_server_request_duration_seconds_count{service="job-trigger",
                product="dk-data"}[5m]))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
              expression: A
              type: reduce
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0.05]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
              expression: B
              type: threshold
        for: 5m
        labels:
          team: data-platform
          service: job-trigger
          product: dk-data
          severity: critical
        annotations:
          summary: "job-trigger error rate above 5%"
          description: "The error rate for job-trigger in dk-data has been above 5% for 5 minutes."

      - uid: dk-data-job-trigger-high-latency
        title: "job-trigger high p95 latency"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket{service="job-trigger",
                product="dk-data"}[5m])) by (le))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              type: reduce
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [2]
                    type: gt
              expression: B
              type: threshold
        for: 5m
        labels:
          team: data-platform
          service: job-trigger
          product: dk-data
          severity: warning
        annotations:
          summary: "job-trigger p95 latency above 2s"
          description: "The p95 latency for job-trigger in dk-data has been above 2 seconds for 5 minutes."

      - uid: dk-data-job-trigger-pod-restarts
        title: "job-trigger excessive pod restarts"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                sum(increase(kube_pod_container_status_restarts_total{container="job-trigger",
                namespace=~"dk-data-(prod|staging)"}[1h]))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              type: reduce
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [3]
                    type: gt
              expression: B
              type: threshold
        for: 0s
        labels:
          team: data-platform
          service: job-trigger
          product: dk-data
          severity: warning
        annotations:
          summary: "job-trigger has restarted more than 3 times in the last hour"
          description: "Pod restarts for job-trigger in dk-data indicate potential instability."
