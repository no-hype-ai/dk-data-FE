              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              type: reduce
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        for: 30m
        labels:
          team: data-platform
          product: dk-data
          severity: warning
        annotations:
          summary: "Entity resolution queue backlog >1000"
          description: "{{ $value }} items pending in entity resolution queue. Manual review may be required."

      - uid: dk-data-molecule-quarantine-high
        title: "High molecule quarantine count"
        condition: C
        noDataState: NoData
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              expr: dk_quarantine_count > 500
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              type: reduce
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        for: 1h
        labels:
          team: data-platform
          product: dk-data
          severity: warning
        annotations:
          summary: "High quarantine count (>500 molecules)"
          description: "{{ $value }} molecules are in quarantine status. Review and resolve quarantine reasons."

  # ─── Infrastructure & Resources ──────────────────────────────────────────────
  - orgId: 1
    name: dk-data-infrastructure
    folder: Alerts
    interval: 1m
    rules:
      - uid: dk-data-pod-high-memory
        title: "Pod high memory usage"
        condition: C
        noDataState: NoData
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: mimir
            model:
              expr: >
                (
                  container_memory_usage_bytes{namespace=~"dk-data-(prod|staging)"}
                  /
                  container_spec_memory_limit_bytes{namespace=~"dk-data-(prod|staging)"}
                ) > 0.80
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              type: reduce
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        for: 15m
        labels:
          team: data-platform
          product: dk-data
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} memory usage >80%"
          description: "Pod {{ $labels.pod }} is using more than 80% of its memory limit."

  # ─── dk-data Postgres performance budgets (Section 10.5 of low-tech-solutions doc) ──
  # These alerts consume the meta.* monitoring tables populated by application code
  # (db_timing.py) and the wal-status-snapshot / activity-log-snapshot CronJobs.
  # They enforce the self-imposed budgets in Section 9 of the doc and would have
  # caught the 2026-04-10 chembl_activities incident before it crashed the cluster.
  - orgId: 1
    name: dk-data-postgres-budgets
    folder: Alerts
    interval: 1m
    rules:
      - uid: dk-data-slow-query
        title: "dk-data slow query (>10s)"
        condition: C
        noDataState: NoData
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              # Application-side timing helper logs every query >threshold to meta.slow_query_log
              # AND emits a structured log line "slow_query label=... elapsed_ms=...".
              # Alert when ANY query exceeds 10000 ms (10s) in the last 10 min.
              expr: >
                count_over_time({product="dk-data"} |~ "slow_query" |~ "elapsed_ms=([0-9]{5,})" [10m]) > 0
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              type: reduce
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        for: 5m
        labels:
          team: data-platform
          product: dk-data
          severity: warning
        annotations:
          summary: "dk-data query exceeded 10s budget"
          description: |
            One or more dk-data SQL queries took longer than 10 seconds in the last 10 minutes.
            Self-imposed budget per `transformation-reliability-low-tech-solutions.md` Section 9
            is "statement runtime < 5 minutes" (this alert fires at the 10s warning level).
            Inspect meta.slow_query_log for label, pod_name, and exact elapsed_ms.

      - uid: dk-data-wal-explosion
        title: "dk-data CronJob produced >5GB WAL"
        condition: C
        noDataState: NoData
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: loki
            model:
              # The bootstrap procedures and chunked tray procedures write per-chunk WAL bytes
              # to meta.transform_runs. Application-side fetcher loaders also push to
              # meta.wal_usage. Either path emits a log line on completion that includes
              # wal_mb=<n>. Alert when any single job's wal_mb exceeds 5000 (5 GB).
              expr: >
                count_over_time({product="dk-data"} |~ "wal_mb=([5-9][0-9]{3,}|[1-9][0-9]{4,})" [1h]) > 0
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              type: reduce
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        for: 1m
        labels:
          team: data-platform
          product: dk-data
          severity: critical
        annotations:
          summary: "dk-data WAL explosion: a single job produced >5GB WAL"
          description: |
            A dk-data job produced more than 5 GB of WAL in the last hour. The cluster's
            max_wal_size is 4 GB (single-node CNPG, see SC 9 in
            transformation-reliability-low-tech-solutions.md). Anything >5 GB risks the
            checkpoint storm that caused the 2026-04-10 incident. Inspect
            meta.transform_runs and meta.wal_usage for the offending procedure_name / job_name.

      - uid: dk-data-long-transaction
        title: "dk-data transaction running >1 hour"
        condition: C
        noDataState: NoData
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              # cronjob-activity-log-snapshot.yaml runs every 60s and writes pg_stat_activity
              # rows with query_age_seconds to meta.activity_log AND emits a log line for any
              # transaction older than 1 hour. The xact_age_seconds field is parsed from the log.
              expr: >
                count_over_time({product="dk-data"} |~ "long_transaction.*xact_age_seconds=([4-9][0-9]{3}|[1-9][0-9]{4,})" [10m]) > 0
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              type: reduce
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        for: 5m
        labels:
          team: data-platform
          product: dk-data
          severity: warning
        annotations:
          summary: "dk-data transaction has been running for over 1 hour"
          description: |
            A dk-data transaction (visible in pg_stat_activity) has been running for over 1
            hour. Self-imposed budget per the low-tech-solutions doc Section 9 is
            "connection holding time < 30 minutes". Long transactions hold a snapshot,
            block VACUUM, and pin WAL on disk. Identify the offender via meta.activity_log
            (snapshotted every 60s by cronjob-activity-log-snapshot.yaml) and either let it
            finish or terminate via pg_terminate_backend(pid).

      - uid: dk-data-backfill-stuck
        title: "dk-data backfill source stuck (3+ consecutive failures)"
        condition: C
        noDataState: NoData
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: loki
            model:
              # The orchestrator (cronjob-backfill-orchestrator.yaml) logs
              # "FAIL source=<x> exit=<n>" on each failed chunk. Three consecutive
              # failures move the source to status='failed' in meta.backfill_state
              # and the orchestrator stops picking it. Alert when 3+ FAIL events
              # appear within 1 hour.
              expr: >
                count_over_time({product="dk-data", app="backfill-orchestrator"} |~ "FAIL source=" [1h]) >= 3
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              type: reduce
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        for: 10m
        labels:
          team: data-platform
          product: dk-data
          severity: warning
        annotations:
          summary: "dk-data backfill source has failed 3+ times in the last hour"
          description: |
            The backfill orchestrator has logged 3+ FAIL events in the last hour.
            The source has been moved to status='failed' and the orchestrator skips
            it on future ticks. Inspect:
              SELECT source_name, last_failure_reason, consecutive_failures
              FROM meta.backfill_progress WHERE status = 'failed';
            Fix the underlying issue, then re-enable:
              UPDATE meta.backfill_state SET status='active', consecutive_failures=0
              WHERE source_name='<source>';

      # Infra-freeze adaptation (2026-04-13): max_wal_size is still at the Postgres
      # default of 1 GB (Group B parameter pending infra ticket). A checkpoint fires
      # at 1 GB of WAL and causes an IO spike that stalls PostgREST reads. This alert
      # fires when any single dk-data load tick produces >800 MB of WAL, giving
      # 200 MB of headroom before the checkpoint threshold.
      # When max_wal_size=8GB lands, raise or remove this alert.
      - uid: dk-data-checkpoint-storm
        title: "dk-data backfill approaching WAL checkpoint threshold (>800MB)"
        condition: C
        noDataState: NoData
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: loki
            model:
              # Application-side loaders write wal_mb=<n> to structured logs on chunk
              # completion. Alert when any tick logs wal_mb >= 800 (800 MB).
              # The pattern matches 4+ digit numbers (800, 900, 1000, ...) in wal_mb= fields.
              # Excludes 0-799 by requiring the first digit to be 8 or 9 (800-999)
              # OR 4+ digits starting with 1+ (1000+).
              expr: >
                count_over_time({product="dk-data"} |~ "wal_mb=([8-9][0-9]{2}|[1-9][0-9]{3,})" [1h]) > 0
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              type: reduce
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        for: 1m
        labels:
          team: data-platform
          product: dk-data
          severity: warning
        annotations:
          summary: "dk-data load tick produced >800 MB WAL — approaching checkpoint threshold"
          description: |
            A dk-data load job produced more than 800 MB of WAL in the last hour.
            With max_wal_size=1GB (current infra freeze), a checkpoint fires at 1 GB and
            causes an IO spike that stalls PostgREST reads. Action:
              1. Identify the offending job via meta.transform_runs or meta.wal_usage.
              2. Confirm the backfill is running in the 02:00–06:00 UTC off-peak window.
              3. If running outside that window, reschedule or throttle the CronJob.
              4. If inside the window and close to 1 GB, split the tick into smaller ranges.
            See docs/runbooks/wal-budget.md for thresholds and remediation.

      - uid: dk-data-activity-pile-up
        title: "dk-data >50 active queries simultaneously"
        condition: C
        noDataState: NoData
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              # cronjob-activity-log-snapshot.yaml emits a snapshot summary line:
              #   "pg_stat_activity_summary dk_data_active_count=<N>"
              # Alert when N exceeds 50 (we get ~100 connections out of max_connections=200,
              # but only ~50 should be actively executing — the rest should be idle).
              expr: >
                count_over_time({product="dk-data"} |~ "pg_stat_activity_summary.*dk_data_active_count=([5-9][0-9]|[1-9][0-9]{2,})" [5m]) > 0
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              type: reduce
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        for: 5m
        labels:
          team: data-platform
          product: dk-data
          severity: warning
        annotations:
          summary: "dk-data has more than 50 active queries simultaneously"
          description: |
            More than 50 dk-data queries are simultaneously executing in pg_stat_activity.
            Self-imposed concurrency budget per Section 9 of the low-tech-solutions doc is
            "concurrent dk-data fetchers < 10, transforms < 3". A pile-up of 50+ active
            queries indicates either: (a) a fetcher stampede that bypassed the staggered
            schedule, (b) PgBouncer pool exhaustion forcing the server pool to fan out, or
            (c) a wave of long-running queries blocking each other on locks. Investigate
            meta.activity_log immediately.

      # ─── Metering Proxy — JWT Minting (Feature 003, issue #283) ─────────────
      - uid: dk-data-metering-proxy-jwt-mint-success-rate-low
        title: "MeteringProxyJWTMintSuccessRateLow"
        condition: C
        noDataState: NoData
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              expr: >
                rate(dk_data_metering_jwt_minted_total[5m])
                / (
                    rate(dk_data_metering_jwt_minted_total[5m])
                  + rate(dk_data_metering_jwt_mint_errors_total[5m])
                  )
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              type: reduce
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0.999]
                    type: lt
              expression: B
              type: threshold
        for: 5m
        labels:
          team: data-platform
          product: dk-data
          severity: warning
        annotations:
          summary: "Metering proxy JWT mint success rate below 99.9%"
          description: |
            The metering proxy JWT mint success rate has been below 99.9% for 5 minutes.
            This means a significant fraction of forwarded requests are failing to mint a JWT,
            causing 500 errors to consumers.
            To investigate:
              1. Check metering-proxy logs for JWTMintError messages.
              2. Verify JWT_SECRET is set correctly in the dk-data-secrets k8s secret
                 (Doppler → k8s secret 'dk-data-secrets', key 'JWT_SECRET').
              3. Check the jwt_mint_errors_total metric labels for the specific error_type.
              4. If error_type is 'unknown_tier', a consumer's tier value is not in TIER_TO_ROLE
                 in jwt_mint.py — add it.
            Dashboard: grafana/dashboards/dk-data-adapter-telemetry.json panel 42.

      - uid: dk-data-metering-proxy-requests-forwarded-without-jwt
        title: "MeteringProxyRequestsForwardedWithoutJWT"
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: mimir
            model:
              expr: >
                rate(dk_data_metering_requests_forwarded_without_jwt_total[5m])
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              type: reduce
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        for: 2m
        labels:
          team: data-platform
          product: dk-data
          severity: critical
        annotations:
          summary: "FR-010 VIOLATION: requests reaching PostgREST without a JWT"
          description: |
            One or more requests have been forwarded to PostgREST without a minted JWT
            for at least 2 minutes. This is a critical FR-010 violation (feature 003).
            Without a JWT the request lands as dk_data_no_anon, which has zero grants —
            the query will fail with 'permission denied' and the consumer will receive a 403.
            More critically, this indicates a bypass path in the metering proxy that skips
            JWT minting, which is a security boundary regression.
            To investigate:
              1. Check proxy.py for any code path that calls proxy_request() without minting
                 a JWT first (look for missing jwt_mint.mint() calls).
              2. Check for recent changes to the request routing or auth bypass conditions.
              3. Review the metering-proxy logs for the requests that triggered this counter.
            Dashboard: grafana/dashboards/dk-data-adapter-telemetry.json panel 43.
            Runbook: docs/runbooks/metering-proxy-401-debug.md
